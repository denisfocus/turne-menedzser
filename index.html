TD('ob.sign.k','Leigazolás','Signing','Verpflichtung','Fichaje','Signature','Ingaggio','Contratação','Kontrakt','Contract','Transfer');
TD('ob.sign.t','Válassz egyet a listából','Pick one from the list','Wähle einen aus der Liste','Elige uno de la lista','Choisis-en un dans la liste','Scegline uno dalla lista','Escolhe um da lista','Wybierz kogoś z listy','Kies er één uit de lijst','Listeden birini seç');
TD('ob.sign.p','A felhozatal hírnév szerint NŐ: elöl a kezdők, hátul a nagy nevek. A kezdők ingyen szerződnek — bármelyiket választhatod.','The list is sorted by fame: newcomers first, big names last. Newcomers sign for free — pick any of them.','Die Liste ist nach Ruhm sortiert: Newcomer vorn, große Namen hinten. Newcomer unterschreiben gratis — nimm irgendeinen.','La lista va por fama: primero los novatos, al final los grandes. Los novatos firman gratis: elige cualquiera.','La liste suit la renommée : débutants d\'abord, grands noms ensuite. Les débutants signent gratuitement — prends qui tu veux.','La lista è ordinata per fama: prima gli emergenti, poi i nomi grossi. Gli emergenti firmano gratis — scegli chi vuoi.','A lista segue a fama: primeiro os novatos, depois os grandes nomes. Os novatos assinam de graça — escolhe qualquer um.','Lista rośnie według sławy: najpierw debiutanci, na końcu wielkie nazwiska. Debiutanci podpisują za darmo — wybierz dowolnego.','De lijst loopt op in roem: eerst nieuwkomers, achteraan grote namen. Nieuwkomers tekenen gratis — kies er eentje.','Liste üne göre sıralı: önce yeni isimler, sonra büyükler. Yeni isimler bedava imza atar — hangisini istersen seç.');
TD('ob.sign.tap','Koppints valamelyik Leigazolás gombra','Tap any Sign button','Tippe auf einen Verpflichten-Button','Toca cualquier botón Fichar','Touche un bouton Signer','Tocca un pulsante Ingaggia','Toca num botão Contratar','Dotknij dowolnego przycisku Podpisz','Tik op een Contracteer-knop','Herhangi bir Anlaş butonuna dokun');

TD('ob.deal.k','Alku','Deal','Deal','Trato','Négociation','Trattativa','Acordo','Negocjacje','Deal','Pazarlık');
TD('ob.deal.t','Így működik a tárgyalás','How negotiating works','So läuft die Verhandlung','Así funciona la negociación','Comment se passe la négociation','Come funziona la trattativa','Como funciona a negociação','Jak działają negocjacje','Zo werkt onderhandelen','Pazarlık böyle işler');
TD('ob.deal.p','A csúszka azt állítja, MENNYI JUTALÉKOT kérsz. Feljebb tolva többet vinnél, de zuhan a sikeresély — a nagy nevek keményebben alkudnak. A jutalék alapja a turné NYERESÉGE. Az alapajánlatot bármikor elfogadhatod: az mindig sikerül.','The slider sets HOW MUCH COMMISSION you ask for. Higher means more for you but a lower chance of success — big names drive a harder bargain. Commission is taken from the tour\'s PROFIT. You can always accept the base offer: that never fails.','Der Regler bestimmt, WIE VIEL PROVISION du forderst. Höher heißt mehr für dich, aber weniger Erfolgschance — große Namen verhandeln härter. Die Provision geht vom GEWINN der Tour ab. Das Basisangebot klappt immer.','El deslizador fija CUÁNTA COMISIÓN pides. Más alto es más para ti, pero baja la probabilidad — los grandes regatean más. La comisión sale del BENEFICIO de la gira. La oferta base siempre se acepta.','Le curseur règle LA COMMISSION que tu demandes. Plus haut = plus pour toi, mais moins de chances — les grands noms négocient dur. La commission vient du BÉNÉFICE. L\'offre de base passe toujours.','Il cursore imposta QUANTA COMMISSIONE chiedi. Più alto significa più per te ma meno probabilità — i nomi grossi trattano duro. La commissione viene dall\'UTILE del tour. L\'offerta base riesce sempre.','O cursor define QUANTA COMISSÃO pedes. Mais alto é mais para ti, mas menos hipóteses — os grandes negoceiam melhor. A comissão sai do LUCRO. A proposta base passa sempre.','Suwak ustala, JAKĄ PROWIZJĘ żądasz. Wyżej to więcej dla ciebie, ale mniejsza szansa — wielkie nazwiska targują się ostrzej. Prowizja liczy się od ZYSKU trasy. Oferta bazowa zawsze przechodzi.','De schuif bepaalt HOEVEEL COMMISSIE je vraagt. Hoger is meer voor jou, maar minder kans — grote namen onderhandelen harder. Commissie komt uit de WINST. Het basisbod lukt altijd.','Kaydırıcı NE KADAR KOMİSYON istediğini belirler. Yükseltirsen payın artar ama şans düşer — büyük isimler sıkı pazarlık yapar. Komisyon turnenin KÂRINDAN alınır. Temel teklif her zaman kabul edilir.');

TD('ob.set.p','A sorrend számít: a fogantyúval húzva rendezheted át a dalokat.','Order matters: drag the handle to rearrange the songs.','Die Reihenfolge zählt: zieh am Griff, um die Songs umzusortieren.','El orden importa: arrastra el asa para reordenar los temas.','L\'ordre compte : glisse la poignée pour réorganiser les morceaux.','L\'ordine conta: trascina la maniglia per riordinare i brani.','A ordem conta: arrasta a pega para reordenar as músicas.','Kolejność ma znaczenie: przeciągnij uchwyt, by zmienić układ.','De volgorde telt: sleep de greep om nummers te verschuiven.','Sıra önemli: tutamağı sürükleyerek şarkıları yeniden diz.');

TD('ob.stop.p','Nagyobb terem = több néző, de drágább. A jegyár a várható nézőszámot szabja meg.','Bigger room = more people, but pricier. The ticket price sets how many are expected to come.','Größerer Saal = mehr Publikum, aber teurer. Der Ticketpreis bestimmt die erwartete Besucherzahl.','Sala más grande = más público, pero más cara. El precio marca cuánta gente se espera.','Salle plus grande = plus de monde, mais plus cher. Le prix du billet fixe l\'affluence attendue.','Sala più grande = più pubblico, ma costa di più. Il prezzo del biglietto determina l\'affluenza attesa.','Sala maior = mais público, mas mais cara. O preço do bilhete define a afluência esperada.','Większa sala = więcej widzów, ale drożej. Cena biletu ustala spodziewaną frekwencję.','Grotere zaal = meer publiek, maar duurder. De ticketprijs bepaalt de verwachte opkomst.','Daha büyük salon = daha çok seyirci ama daha pahalı. Bilet fiyatı beklenen katılımı belirler.');

TD('ob.promo.t','Mennyit költesz rá','How much you spend','Wie viel du ausgibst','Cuánto gastas','Combien tu dépenses','Quanto spendi','Quanto gastas','Ile wydajesz','Hoeveel je uitgeeft','Ne kadar harcarsın');
TD('ob.promo.p','Több promó = több néző. A turné nyereségéből megy, nem előre.','More promo = more people. It comes out of the tour\'s profit, not up front.','Mehr Promo = mehr Publikum. Es geht vom Gewinn der Tour ab, nicht vorab.','Más promo = más público. Sale del beneficio de la gira, no por adelantado.','Plus de promo = plus de monde. C\'est pris sur le bénéfice, pas d\'avance.','Più promo = più pubblico. Esce dall\'utile del tour, non in anticipo.','Mais promo = mais público. Sai do lucro da digressão, não à cabeça.','Więcej promocji = więcej widzów. Idzie z zysku trasy, nie z góry.','Meer promo = meer publiek. Het komt uit de winst, niet vooraf.','Daha çok tanıtım = daha çok seyirci. Peşin değil, turnenin kârından düşer.');

TD('ob.liveTop.t','Ez fut most','This is running now','Das läuft gerade','Esto está en marcha','C\'est en cours','Questo sta girando ora','Isto está a decorrer','To właśnie trwa','Dit loopt nu','Şu an bu çalışıyor');
TD('ob.liveTop.p','Itt látod, hol tart a csapat: utazás vagy koncert, hányadik nap, mennyi a hátralévő műsoridő — alatta pedig az állomások eredménye élőben.','Here you see where the crew is: travelling or on stage, which day, how much show time is left — and below, each stop\'s result live.','Hier siehst du, wo die Crew steckt: unterwegs oder auf der Bühne, welcher Tag, wie viel Showzeit bleibt — darunter die Ergebnisse live.','Aquí ves dónde está el equipo: viaje o concierto, qué día, cuánto queda de show — y debajo, el resultado de cada parada en directo.','Ici tu vois où en est l\'équipe : trajet ou concert, quel jour, combien de show reste — et dessous, le résultat de chaque étape en direct.','Qui vedi dov\'è la squadra: viaggio o concerto, che giorno, quanto show resta — e sotto, il risultato di ogni tappa in diretta.','Aqui vês onde está a equipa: viagem ou concerto, que dia, quanto falta do espetáculo — e abaixo, o resultado de cada paragem ao vivo.','Tu widzisz, gdzie jest ekipa: podróż czy koncert, który dzień, ile show zostało — a niżej wynik każdego przystanku na żywo.','Hier zie je waar de crew is: onderweg of op het podium, welke dag, hoeveel showtijd rest — en eronder live het resultaat per stop.','Ekibin nerede olduğunu burada görürsün: yolda mı sahnede mi, kaçıncı gün, ne kadar şov kaldı — altında her durağın sonucu canlı.');

TD('ob.liveMini.k','Mini-játék','Mini-game','Minispiel','Minijuego','Mini-jeu','Minigioco','Minijogo','Minigra','Minigame','Mini oyun');
TD('ob.liveMini.t','Beállok — extra a show-ra','Step in — a boost for the show','Einspringen — Extra für die Show','Te subes: extra para el show','Tu montes : un plus pour le show','Sali sul palco — un extra per lo show','Entras — um extra para o espetáculo','Wskakujesz — dodatek do show','Je springt in — extra voor de show','Sahneye çık — şova ekstra');
TD('ob.liveMini.p','A nagy estéken beállhatsz dobolni, a fénypulthoz vagy a zongorához. A jó teljesítmény bónuszt ad a koncertre. Teljesen opcionális: ha kihagyod, semmit nem veszítesz.','On big nights you can play drums, run the lights or sit at the piano. A good run gives the show a bonus. Fully optional: skipping costs you nothing.','An großen Abenden kannst du trommeln, das Licht fahren oder ans Klavier. Gute Leistung gibt einen Bonus. Völlig optional: Auslassen kostet nichts.','En las noches grandes puedes tocar la batería, la mesa de luces o el piano. Hacerlo bien da bonus. Es opcional: saltarlo no cuesta nada.','Les grands soirs, tu peux jouer la batterie, la console lumière ou le piano. Une bonne perf donne un bonus. Optionnel : passer ne coûte rien.','Nelle grandi serate puoi suonare la batteria, le luci o il piano. Una buona prova dà un bonus. Del tutto opzionale: saltarlo non costa nulla.','Nas grandes noites podes tocar bateria, a mesa de luzes ou o piano. Correr bem dá bónus. É opcional: saltar não custa nada.','W wielkie wieczory możesz zagrać na perkusji, świetle albo pianinie. Dobry występ daje bonus. W pełni opcjonalne: pominięcie nic nie kosztuje.','Op grote avonden speel je drums, licht of piano. Een goede beurt geeft bonus. Volledig optioneel: overslaan kost niets.','Büyük gecelerde davul çalabilir, ışıkları yönetebilir ya da piyanoya geçebilirsin. İyi performans bonus verir. Tamamen isteğe bağlı: atlarsan bir şey kaybetmezsin.');

TD('ob.liveSkip.k','Gyorsítás','Fast-forward','Vorspulen','Adelantar','Avance rapide','Avanti veloce','Avançar','Przewijanie','Doorspoelen','Hızlandır');
TD('ob.liveSkip.t','Nem kell várnod','No waiting required','Warten musst du nicht','No hace falta esperar','Pas besoin d\'attendre','Non devi aspettare','Não precisas de esperar','Nie musisz czekać','Wachten hoeft niet','Beklemene gerek yok');
TD('ob.liveSkip.p','Ugrás a végére: az aktuális szakasz azonnal lefut. Mind: az egész hátralévő turné lepörög. Mindkettő INGYEN, egy koppintás.','Skip: the current leg finishes instantly. All: the whole remaining tour plays out. Both are FREE, one tap.','Überspringen: der aktuelle Abschnitt läuft sofort durch. Alles: die ganze restliche Tour. Beides GRATIS, ein Tipp.','Saltar: el tramo actual termina al instante. Todo: se resuelve el resto de la gira. Ambos GRATIS, un toque.','Passer : l\'étape en cours se termine aussitôt. Tout : le reste de la tournée se déroule. Les deux sont GRATUITS, en un geste.','Salta: la tappa attuale finisce subito. Tutto: si svolge tutto il tour restante. Entrambi GRATIS, un tocco.','Saltar: a etapa atual termina já. Tudo: o resto da digressão decorre. Ambos GRÁTIS, um toque.','Pomiń: bieżący etap kończy się od razu. Wszystko: reszta trasy rozgrywa się sama. Oba ZA DARMO, jedno dotknięcie.','Overslaan: het huidige deel is meteen klaar. Alles: de rest van de tour speelt zich af. Beide GRATIS, één tik.','Atla: mevcut bölüm anında biter. Tümü: turnenin kalanı akar. İkisi de ÜCRETSİZ, tek dokunuş.');

TD('ob.resBreak.k','Eredmény','Result','Ergebnis','Resultado','Résultat','Risultato','Resultado','Wynik','Resultaat','Sonuç');
TD('ob.resBreak.t','Így jön ki a pénz','How the money adds up','So kommt das Geld zustande','Así salen las cuentas','Voilà comment l\'argent tombe','Ecco come tornano i conti','É assim que as contas fecham','Tak wychodzą pieniądze','Zo komt het geld uit','Para böyle çıkıyor');
TD('ob.resBreak.p','Jegybevétel + merch a bevétel. Ebből jön le a helyszín, technika, stáb, utazás és promóció — ami marad, az a turné nyeresége. Azon osztoztok: az előadóé a nagyobb rész, a tiéd a jutalék.','Tickets + merch make the revenue. Venue, gear, crew, travel and promo come off it — what\'s left is the tour\'s profit. You split that: the artist takes the bigger share, you take your commission.','Tickets + Merch ergeben den Umsatz. Davon gehen Venue, Technik, Crew, Reise und Promo ab — der Rest ist der Gewinn. Den teilt ihr: der Künstler bekommt mehr, du deine Provision.','Entradas + merch son los ingresos. De ahí salen recinto, técnica, equipo, viaje y promo: lo que queda es el beneficio. Se reparte: el artista se lleva más, tú tu comisión.','Billets + merch, voilà les recettes. On en retire salle, technique, équipe, voyage et promo — le reste est le bénéfice. Vous le partagez : l\'artiste prend le gros, toi ta commission.','Biglietti + merch fanno il ricavo. Ne escono locale, tecnica, staff, viaggio e promo — il resto è l\'utile. Ve lo dividete: all\'artista la parte grossa, a te la commissione.','Bilhetes + merch são a receita. Saem daí sala, técnica, equipa, viagem e promo — o que resta é o lucro. Dividem: o artista leva mais, tu levas a comissão.','Bilety + merch to przychód. Odchodzą sala, technika, ekipa, podróż i promocja — reszta to zysk. Dzielicie się: artysta bierze więcej, ty prowizję.','Tickets + merch vormen de omzet. Daar gaan zaal, techniek, crew, reis en promo vanaf — wat rest is de winst. Die deel je: de artiest krijgt het grootste deel, jij je commissie.','Bilet + merch geliri oluşturur. Mekân, teknik, ekip, yol ve tanıtım düşer — kalan turnenin kârıdır. Onu paylaşırsınız: büyük pay sanatçının, komisyon senin.');

TD('ob.resStops.k','Állomások','Stops','Stationen','Paradas','Étapes','Tappe','Paragens','Przystanki','Stops','Duraklar');
TD('ob.resStops.t','Mi történt esténként','What happened each night','Was an jedem Abend passierte','Qué pasó cada noche','Ce qui s\'est passé chaque soir','Cos\'è successo ogni sera','O que aconteceu em cada noite','Co się działo każdego wieczoru','Wat er elke avond gebeurde','Her gece ne oldu');
TD('ob.resStops.p','Állomásonként látod a nézőszámot a férőhelyhez képest, hogy a vártnál többen vagy kevesebben jöttek, a merch-bevételt és az új rajongókat.','For each stop you see attendance against capacity, whether more or fewer came than expected, merch revenue and new fans.','Pro Station siehst du Besucher vs. Kapazität, ob mehr oder weniger kamen als erwartet, Merch-Umsatz und neue Fans.','En cada parada ves el público frente al aforo, si vino más o menos gente de lo previsto, el merch y los nuevos fans.','Pour chaque étape : l\'affluence face à la capacité, plus ou moins que prévu, les recettes merch et les nouveaux fans.','Per ogni tappa vedi il pubblico rispetto alla capienza, se sono venuti più o meno del previsto, il merch e i nuovi fan.','Em cada paragem vês o público face à lotação, se vieram mais ou menos do que o previsto, o merch e os novos fãs.','Przy każdym przystanku widzisz frekwencję wobec pojemności, czy przyszło więcej czy mniej, przychód z merchu i nowych fanów.','Per stop zie je opkomst tegenover capaciteit, of er meer of minder kwamen, merch-omzet en nieuwe fans.','Her durakta kapasiteye göre katılımı, beklenenden çok mu az mı geldiğini, merch gelirini ve yeni hayranları görürsün.');

TD('ob.resX2.k','Bónusz','Bonus','Bonus','Bonus','Bonus','Bonus','Bónus','Bonus','Bonus','Bonus');
TD('ob.resX2.t','Duplázás — csak ha akarod','Double it — only if you want','Verdoppeln — nur wenn du willst','Doblar: solo si quieres','Doubler — seulement si tu veux','Raddoppia — solo se vuoi','Duplicar — só se quiseres','Podwojenie — tylko jeśli chcesz','Verdubbelen — alleen als je wilt','İkiye katla — istersen');
TD('ob.resX2.p','A turné végén egy rövid videóért megduplázhatod a jutalékodat. Ez az egyetlen ilyen ajánlat a játékban, turnénként egyszer — semmi más nincs reklámhoz kötve.','At the end of a tour, a short video can double your commission. It\'s the only offer like it, once per tour — nothing else is tied to ads.','Am Tourende kannst du deine Provision für ein kurzes Video verdoppeln. Das ist das einzige Angebot dieser Art, einmal pro Tour — sonst hängt nichts an Werbung.','Al final de la gira, un vídeo corto dobla tu comisión. Es la única oferta así, una vez por gira: nada más depende de anuncios.','En fin de tournée, une courte vidéo double ta commission. C\'est la seule offre de ce type, une fois par tournée — rien d\'autre n\'est lié à la pub.','A fine tour, un breve video raddoppia la tua commissione. È l\'unica offerta del genere, una volta per tour — nient\'altro dipende dalla pubblicità.','No fim da digressão, um vídeo curto duplica a tua comissão. É a única oferta assim, uma vez por digressão — nada mais depende de anúncios.','Na koniec trasy krótki film podwaja twoją prowizję. To jedyna taka oferta, raz na trasę — nic innego nie zależy od reklam.','Aan het eind van een tour verdubbelt een korte video je commissie. Het is het enige aanbod zo, één keer per tour — verder niets met advertenties.','Turne sonunda kısa bir video komisyonunu ikiye katlar. Türünün tek örneği, turne başına bir kez — başka hiçbir şey reklama bağlı değil.');

/* ============================ ÁLLAPOT ============================ */
const KEY='turne_menedzser_v3';
let S=migrate(load()||newGame());
function newGame(){return{money:60000,rep:0,week:1,roster:[],upg:{marketing:0,staff:0,merch:0},tab:'iroda',tour:null,live:null,
 art:{},rel:null,relLog:[],streamIncome:0,lastResult:null,toursDone:0,detail:null,studio:null,
 feed:[],lastLevel:1,lastVenues:1,sound:true,autoShow:false,credits:CRED_WELCOME,themes:['lime'],theme:'lime',scout:null,
 mile:{},recs:{},hall:[],chal:null,chalDone:0,artArc:{},career:false,deal:{},fac:{},staff:{},artUp:{},venues:{},big:{},earned:0,leg:null,recsAll:{},ioOpen:false,giftWk:undefined,giftN:0,
 ob:0,obDone:false,cities:{},analyticsConsent:true,firstOpen:0,agency:'',rtView:'list',
 lang:null,hq:'bud',started:false};}
/* régi mentések kiegészítése az új mezőkkel */
function migrate(s){
 if(!s||typeof s!=='object'||Array.isArray(s))return newGame();
 /* Alapmezők: enélkül egy régi/hiányos mentés a renderben dobott (fehér képernyő). */
 const base=newGame();
 ['money','rep','week','toursDone','tab','credits'].forEach(function(k){
  if(typeof s[k]!=='number'&&k!=='tab')s[k]=base[k];});
 if(typeof s.tab!=='string')s.tab='iroda';
 if(!Array.isArray(s.roster))s.roster=[];
 if(typeof s.resultPending!=='boolean')s.resultPending=false;
 if(s.deal){Object.keys(s.deal).forEach(function(k){if(s.deal[k]>30)delete s.deal[k];});}  // régi 10-60%-os modell alaphelyzetbe
 if(s.live===undefined)s.live=null;
 if(s.tour&&s.tour.promo===undefined)s.tour.promo=0;
 if(s.tour&&s.tour.risk===undefined)s.tour.risk=false;
 if(!s.upg)s.upg={marketing:0,staff:0,merch:0};
 if(s.upg.merch===undefined)s.upg.merch=0;
 if(!s.art)s.art={};
 if(s.rel===undefined)s.rel=null;
 if(!s.relLog)s.relLog=[];
 if(s.streamIncome===undefined)s.streamIncome=0;
 if(s.studio===undefined)s.studio=null;
 if(!s.feed)s.feed=[];
 if(s.sound===undefined)s.sound=true;
 if(s.credits===undefined)s.credits=CRED_WELCOME;
 if(!s.themes)s.themes=['lime'];
 if(!s.theme)s.theme='lime';
 /* Roster-csere: az ismeretlen (régi) előadó-azonosítókat mindenhonnan kipucoljuk,
    hogy a futó mentés ne törjön el. */
 const known=function(id){return !!AM[id];};
 if(Array.isArray(s.roster))s.roster=s.roster.filter(known);
 [['deal'],['art'],['artUp'],['artArc']].forEach(function(k){const o=s[k[0]];
  if(o&&typeof o==='object')Object.keys(o).forEach(function(id){if(!known(id))delete o[id];});});
 if(s.tour&&!known(s.tour.artist))s.tour=null;
 if(s.detail&&!known(s.detail))s.detail=null;          // különben a részletes lap dobna
 if(s.rel&&!known(s.rel.artist))s.rel=null;            // futó kiadás ismeretlen előadóval
 if(s.rel&&typeof s.rel.ms!=='number')s.rel.ms=Math.max(1,(s.rel.ends||0)-Date.now());
 if(s.live&&!known(s.live.artist)){s.live=null;s.resultPending=false;s.lastResult=null;}
 if(s.lastResult&&(!Array.isArray(s.lastResult.rows)||typeof s.lastResult.net!=='number'
   ||!Object.values(AM).some(function(x){return x.n===s.lastResult.artist;}))){
  s.lastResult=null;s.resultPending=false;}
 if(Array.isArray(s.scout))s.scout=s.scout.filter(known);
 if(!s.scout||!s.scout.length)s.scout=null;
 if(s.earned===undefined)s.earned=0;
 if(!s.recsAll)s.recsAll={};
 if(!s.cities)s.cities={};
 /* Nyelv / székhely / kezdőképernyő. RÉGI mentésnél a started undefined → true lesz,
    tehát a meglévő játékos nem kapja újra a kezdőképernyőt, és megtartja a nevét. */
 if(s.lang!==undefined&&s.lang!==null&&LANGIDS.indexOf(s.lang)<0)s.lang=null;
 if(!s.hq||!CM[s.hq])s.hq='bud';
 if(s.started===undefined)s.started=true;
 if(!s.venues)s.venues={};
 if(!s.big)s.big={};
 if(s.analyticsConsent===undefined)s.analyticsConsent=true;   // TODO: élesben false + consent-banner
 if(s.firstOpen===undefined)s.firstOpen=0;
 if(s.agency===undefined)s.agency='';
 if(s.rtView!=='map'&&s.rtView!=='list')s.rtView='list';
 if(s.tilt!==undefined)delete s.tilt;      // a dőlés-vezérlés megszűnt
 if(s.ioOpen===undefined)s.ioOpen=false;
 if(s.giftN===undefined)s.giftN=0;
 /* Visszatérő mentés: a bemutató NEM indul újra. Új játéknál a newGame() false-ra állítja. */
 if(s.obDone===undefined)s.obDone=true;
 if(s.ob===undefined)s.ob=null;
 if(!s.leg)s.leg={pts:0,tot:0,rank:0,perks:{}};
 if(!s.leg.perks)s.leg.perks={};
 if(!s.deal)s.deal={};
 if(!s.fac)s.fac={};if(!s.staff)s.staff={};if(!s.artUp)s.artUp={};
 if(!s.mile)s.mile={};if(!s.recs)s.recs={};if(!s.hall)s.hall=[];
 if(s.chal===undefined)s.chal=null;if(!s.chalDone)s.chalDone=0;if(!s.artArc)s.artArc={};s.career=false;
 if(s.autoShow===undefined)s.autoShow=false;
 if(s.live){
  /* régebbi build turnéja: az újabb összesítő mezők hiányoznának → NaN az eredményben */
  ['tRev','tCost','tPay','tTrav','tAtt','tEvent','tMerch','tArtist','tTake','pool','rep','days','i','mom','attMul']
   .forEach(function(k){if(typeof s.live[k]!=='number')s.live[k]=(k==='mom'||k==='attMul')?1:0;});
  ['rows','log','evUsed','ph','stops','setlist'].forEach(function(k){if(!Array.isArray(s.live[k]))s.live[k]=[];});
  ['fanGain','mini','miniSkip','boost','adUsed'].forEach(function(k){if(!s.live[k]||typeof s.live[k]!=='object')s.live[k]={};});
  if(!s.live.ph.length||!s.live.stops.length){s.live=null;}
 }
 if(s.live){if(s.live.drum&&!s.live.mini){s.live.mini=s.live.drum;s.live.miniSkip=s.live.drumSkip||{};}
  if(!s.live.mini)s.live.mini={};if(!s.live.miniSkip)s.live.miniSkip={};
  /* beragadt szünet feloldása (pl. ha mini-játék közben zárták be) */
  if(s.live.pausedLeft!=null&&!s.live.pendingEv){s.live.ends=Date.now()+s.live.pausedLeft;s.live.pausedLeft=null;}}   /* lastLevel / lastVenues szándékosan maradhat undefined:
                            a checkUnlocks() az első futáskor csendben beállítja, nem spammel. */
 /* helyszín-feloldás bevezetése: a régi mentésben megtervezett, de már zárolt helyszínt lehúzzuk.
    A FUTÓ turnét nem bántjuk — az a szerződés már megköttetett. */
 if(s.tour&&s.tour.stops){const ar=AM[s.tour.artist];
  const fadd=(s.art&&s.art[s.tour.artist]?s.art[s.tour.artist].fameAdd:0)||0;
  s.tour.stops.forEach(st=>{const v=VM[st.venue];
   if(v&&(v.minRep||0)>(s.rep||0)){let ok=VENUES[0];
    for(let i=VENUES.indexOf(v);i>=0;i--)if((VENUES[i].minRep||0)<=(s.rep||0)){ok=VENUES[i];break;}
    st.venue=ok.id;
    /* a jegyár is igazodjon a kisebb helyszínhez (af() itt még nem hívható, S még nincs kész) */
    if(ar)st.price=Math.round((14+Math.min(100,ar.fame+fadd)*0.75)*ok.pmul);}});}
 return s;}
let saveWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}
 catch(e){if(!saveWarned){saveWarned=true;toast('A mentés nem sikerült — a böngésző tárhelye betelt.');}}}

const $=s=>document.querySelector(s), hud=$('#hud'), view=$('#view'), stickyHost=$('#sticky-host'), navEl=$('#nav'), resultEl=$('#result');
function money(n){const s=Math.round(Math.abs(n)).toLocaleString('hu-HU');return (n<0?'−€':'€')+s;}
function k(n){n=Math.round(n);return n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.',',')+'e':''+n;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function signed(){return S.roster.map(id=>AM[id]);}
/* Minden előadó-lista HÍRNÉV SZERINT NÖVEKVŐ: elöl a kicsik, hátul a legendák. */
function byFame(list){return list.slice().sort(function(x,y){return af(x)-af(y);});}
function avail(){return byFame(ARTISTS.filter(a=>a.minRep<=S.rep));}
/* Scouting-felhozatal: a leigazolhatók közül egy 3-as rövidlista.
   INGYEN frissül minden turné után; kreditért azonnal újragenerálható. */
function rollScout(){
 const pool=avail().filter(a=>!S.roster.includes(a.id)).map(a=>a.id);
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 S.scout=pool.slice(0,legLv('scout')?5:3);return S.scout;
}
function scoutList(){
 const ok=(S.scout||[]).filter(id=>AM[id]&&!S.roster.includes(id)&&AM[id].minRep<=S.rep);
 if(ok.length!==(S.scout||[]).length||!S.scout)S.scout=ok;
 if(!S.scout.length)rollScout();
 return byFame(S.scout.map(id=>AM[id]).filter(Boolean));
}
function level(){let l=1;for(let i=0;i<LEVELS.length;i++)if(S.rep>=LEVELS[i])l=i+1;return l;}
function levelProg(){const l=level();const lo=LEVELS[l-1],hi=LEVELS[l]||LEVELS[LEVELS.length-1]+400;return{l,lo,hi,pct:clamp((S.rep-lo)/(hi-lo),0,1),need:Math.max(0,hi-S.rep)};}
function cityPhoto(c,w,h){return `https://loremflickr.com/${w}/${h}/${c.photo}?lock=${c.lk}`;}

   A külső fotószolgáltató TÖBB-CÍMKÉS lekérdezésre nem talál egyezést, és macskát ad

 const sc=Math.min(w,h)*0.5/512, ox=w/2-256*sc, oy=h*0.44-256*sc;
 const sil=ic?'<g transform="translate('+ox.toFixed(1)+','+oy.toFixed(1)+') scale('+sc.toFixed(4)+')">'+
   '<path d="'+ic+'" fill="#ffffff" opacity=".30" transform="translate(-9,-9)"/>'+

 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
  '<defs>'+
   '<linearGradient id="a'+id+'" x1="0" y1="0" x2="1" y2="1">'+
     '<stop offset="0" stop-color="'+pal[0]+'"/><stop offset="1" stop-color="'+pal[1]+'"/></linearGradient>'+
   '<linearGradient id="b'+id+'" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0" stop-color="#ffffff" stop-opacity=".6"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>'+
   '<radialGradient id="r'+id+'" cx="50%" cy="32%" r="64%">'+
     '<stop offset="0" stop-color="#ffffff" stop-opacity=".34"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>'+
   '<linearGradient id="v'+id+'" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0" stop-color="#05060a" stop-opacity="0"/>'+
     '<stop offset=".52" stop-color="#05060a" stop-opacity=".3"/>'+
     '<stop offset="1" stop-color="#05060a" stop-opacity=".93"/></linearGradient>'+
   /* azonos műfajon belül is legyen egyedi árnyalat */
   '<filter id="h'+id+'"><feColorMatrix type="hueRotate" values="'+(((seed*37)%46)-23)+'"/></filter>'+
  '</defs>'+
  '<rect width="'+w+'" height="'+h+'" fill="#0b0d10"/>'+
  '<g filter="url(#h'+id+')"><g transform="rotate('+((seed*13%47)-23)+' '+(w/2)+' '+(h/2)+')">'+
    '<rect x="'+(-w*0.3)+'" y="'+(-h*0.3)+'" width="'+(w*1.6)+'" height="'+(h*1.6)+'" fill="url(#a'+id+')" opacity=".88"/></g></g>'+
  beams+
  '<rect width="'+w+'" height="'+h+'" fill="url(#r'+id+')"/>'+
  sil+heads+
  '<rect width="'+w+'" height="'+h+'" fill="url(#v'+id+')"/>'+
 '</svg>';
 return 'data:image/svg+xml,'+encodeURIComponent(svg);
}
/* a kártyákon a részletesebb műfaj-címke látszik, a mechanika a 4 fő műfajjal számol */
function gLabel(a){return a.sub||a.genre;}
const CROWD='https://loremflickr.com/900/560/concert,crowd,stage,lights?lock=7';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#app').appendChild(t);setTimeout(()=>t.remove(),2000);}
function imgFB(){return `onerror="this.style.opacity=0"`;}
const MK_COST=[0,25000,60000,120000,220000], ST_COST=[0,20000,50000,100000,190000];

/* ============================ GAZDASÁG ============================ */
function haversine(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
 const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const KM_RATE=6.5;
/* A „reális" jegyár a HÍRNÉVVEL skálázódik, méghozzá gyorsulva (négyzetes tag):
   egy szupersztárért fejenként is sokkal többet elkérhetsz, nem csak többen jönnek.
   Hírnév 26 → €58 · 56 → €120 · 88 → €211 alapár (a helyszín pmul-ja jön rá). */
function fairPrice(a,v){const f=af(a);return (22+f*1.05+f*f*0.0125)*v.pmul;}
/* A kereslet hírnév-görbéje. A tiszta (f/100)^2.2 a 13–20 hírnevű KEZDŐKNÉL szinte
   nullát adott — az első turné veszteséges volt. A +FAME_BASE eltolás megemeli az alsó
   végét, a felsőt gyakorlatilag nem érinti (ott úgyis kapacitás-korlát van). */
const DEMAND_BASE=75000, FAME_POWER=2.2, FAME_BASE=14;
function fameDraw(f){return Math.pow((f+FAME_BASE)/(100+FAME_BASE),FAME_POWER);}
function estimate(a,city,v,price,setQ,mom,promo){
 const st=artState(a.id), fans=st.fans[city.r]||0;
 const list=(S.live?S.live.setlist:(S.tour?S.tour.setlist:null));
 const nStops=(S.live?S.live.stops.length:(S.tour?S.tour.stops.length:1));
 const avgE=list?setlistAvgE(a,list):60;
 const taste=tasteMul(city,avgE);           // ← a város ízlése: nincs univerzális „legjobb" szet
 const fresh=freshness(st,city.id);         // ← város-kifáradás
 const reachScale=city.reach/100, gAff=city.aff[a.genre]||1,
   rAff=fanMul(fans),                       // ← dinamikus rajongótábor a régi fix a.reg helyett
   buzz=1+st.hype*0.25,                     // ← friss kiadás azonnali kereslet-lökése
   mkt=1+S.upg.marketing*0.10,
   pro=(1+(PROMO[promo||0].dem-1)*(hasStaff('pr')?1.10:1))*(hasBig('fest')?1.12:1),
   setF=setQ>0?(0.45+setQ/100*0.75):0.30, draw=fameDraw(af(a)), fp=fairPrice(a,v), r=price/fp, pf=clamp(1.25-0.60*r,0.03,1.25);
 let pool=draw*DEMAND_BASE*reachScale*gAff*rAff*buzz*setF*mkt*pro*taste*fresh*(mom||1);
 /* raw = nyers kereslet (férőhely nélkül). A szórás ezen dolgozik, és csak UTÁNA vágjuk
    a kapacitásra — így a jóval túlkeresett koncert biztosan telt ház lesz, a félig telt viszont
    tényleg ingadozik. */
 const raw=Math.max(0,Math.round(pool*pf));
 let att=clamp(raw,0,v.cap), fill=att/v.cap, rev=att*price;
 /* KÖLTSÉGMODELL — két rész:
    fix  = kapacitás × €/férőhely × produkció-méret (a sztár nagyobb show-t hoz), a stáb-fejlesztés csökkenti.
           Ez akkor is jár, ha üres a ház → ettől kockázatos a túl nagy helyszín.
    var  = fejenkénti költség (biztonság, személyzet, jegykezelés), a jegyárral is nő.
           Ez fogja vissza a telt házas koncert margóját, anélkül hogy a megtelést nehezítené. */
 /* a hosszabb turné megosztja az overheadet -> allomasonkent olcsobb fix koltseg */
 const fix=Math.round(v.cap*v.fix*(0.55+af(a)/110)*(1-S.upg.staff*0.08)*tourScale(nStops)*(1-facLv('rig')*0.06)*(1-legLv('cost')*0.05)*ngCost()
   *(venOwnedHere(city.id,v.id)?0.30:1));   // saját teremben nincs bérleti díj
 const varRate=(3+price*0.12)*(hasStaff('mgr')?0.9:1);
 const base=fix+Math.round(att*varRate);
 const merch=merchRev(att,fans);            // ← a merch a nézőszámból és a rajongói szintből jön
 /* hány nézőnél fordul nyereségbe — ez a helyszínválasztás valódi tétje */
 const contrib=price+merchPerHead(fans)-varRate;
 const beAtt=contrib>0?Math.ceil(fix/contrib):Infinity;
 const comm=commRate(a), tprofit=rev+merch-base;
 return{att,raw,fill,rev,base,fp,fans,merch,fix,varRate,beAtt,beFill:beAtt/v.cap,fresh,taste,avgE,comm,tprofit};
}
/* mennyire illik a helyszín mérete a várható kereslethez — a venue-választás így valódi döntés */
function venueFit(fill){
 return fill>=0.98?{t:'Telt ház várható',c:'var(--cash)'}
      :fill>=0.75?{t:'Jó választás',c:'var(--cash)'}
      :fill>=0.45?{t:'Lesznek üres helyek',c:'var(--gold)'}
      :fill>=0.25?{t:'Nagyrészt üres lesz',c:'var(--hot)'}
      :{t:'Túl nagy hely ide',c:'var(--hot)'};
}

/* ---------- BIZONYTALANSÁG ----------
   A becslés csak VÁRHATÓ érték. A tényleges nézőszám szór körülötte:
   kevésbé ismert előadó + gyenge promóció = nagyobb szórás (lehet több, de kevesebb is). */
function sigmaFor(a,promo){
 let s=0.30;                                   // alap szórás
 s*=1-clamp(af(a)/100,0,1)*0.40;               // ismert előadó = kiszámíthatóbb
 s*=PROMO[promo||0].sig;                       // turné-promóció
 s*=1-S.upg.marketing*0.05;                    // iroda marketing-fejlesztés
 return clamp(s,0.06,0.42);
}
/* átlag 1, szórás = sigma (3 egyenletes összege ~ normális) */
function rollFactor(sigma){const u=(Math.random()+Math.random()+Math.random())/3;return Math.max(0.05,1+(u-0.5)*(sigma/0.16667));}
/* ~80%-os sáv a nyers kereslet körül, a végén a férőhelyre vágva */
function band(raw,sigma,cap){return{lo:clamp(Math.round(raw*(1-1.28*sigma)),0,cap),hi:clamp(Math.round(raw*(1+1.28*sigma)),0,cap)};}

/* ================= SETLIST: ENERGIA-ÍV ÉS KÖZÖNSÉG-SZIMULÁCIÓ =================
   Nem a legnagyobb pontszámú dalok halmaza a jó szet, hanem a jól felépített ív:
   erős nyitás → építkezés → lélegzetvételnyi lassú → csúcs → ráadás.
   Csupa nagy energiájú szám egymás után kifárasztja a közönséget (állóképesség). */
const PRICE_MAX=400;                              // jegyár-csúszka felső határa (a presetek is eddig mehetnek)
const MIN_SET=5;                                  // ennyi dal kell egy indítható szethez
/* A kezdő előadóknak rövidebb a katalógusuk — náluk a teljes repertoár a minimum. */
function minSet(a){return Math.min(MIN_SET,(a&&a.songs)?a.songs.length:MIN_SET);}
const ARC=[70,80,60,74,90,97,88];                 // ideális energia-görbe kulcspontjai (0→1)
function arcTarget(t){const x=clamp(t,0,1)*(ARC.length-1),i=Math.floor(x),f=x-i;
 return ARC[i]+((ARC[Math.min(i+1,ARC.length-1)]-ARC[i])*f);}
/* a város közönségének ízlése: mennyire szereti a nagy energiájú szettet */
function tasteMul(city,avgE){if(!city||city.eLike===undefined)return 1;
 return clamp(1-Math.abs(avgE-city.eLike)/260,0.82,1.06);}

function crowdSim(a,list){
 const songs=(list||[]).map(i=>a.songs[i]).filter(Boolean);
 if(!songs.length)return{pts:[],score:0,avgE:60,notes:['Válassz legalább egy dalt.'],fatigue:0};
 let crowd=48,stam=100,fatigue=0,run=0;const pts=[],notes=[];
 songs.forEach((s,i)=>{
  const t=songs.length>1?i/(songs.length-1):0.5, want=arcTarget(t);
  const fit=1-Math.min(1,Math.abs(s.e-want)/40);          // mennyire illik az ívbe (meredek)
  run=s.e>=78?run+1:0;
  if(run>=3){fatigue++;}                                   // 3+ nagy szám egymás után fáraszt
  const drain=s.e>=78?15:(s.e<=52?-20:-3);                 // pörgős fáraszt, lassú pihentet
  stam=clamp(stam-drain,0,100);
  let gain=(songQ(a,s)/100*0.35+fit*1.0)*26-17;   // az ívhez illés dominál a puszta minőség felett
  gain*=(0.45+stam/100*0.75);                              // fáradt közönség kevésbé reagál
  if(run>=3)gain-=8;
  if(i===songs.length-1&&songs.length>2)gain*=1.8;   // a ráadás nagyobbat üt — jóban-rosszban
  crowd=clamp(crowd+gain,0,100);
  pts.push({crowd:Math.round(crowd),stam:Math.round(stam),e:s.e,q:s.q,n:s.n});
 });
 const avg=pts.reduce((x,p)=>x+p.crowd,0)/pts.length;
 const fin=pts[pts.length-1].crowd, peak=Math.max.apply(null,pts.map(p=>p.crowd));
 const avgE=songs.reduce((x,s)=>x+s.e,0)/songs.length;
 const score=clamp(Math.round(avg*0.50+fin*0.30+peak*0.20),0,100);
 if(fatigue)notes.push(`${fatigue} helyen 3+ nagy szám torlódik — a közönség kifárad.`);
 if(songs.length>=3&&pts[pts.length-1].crowd<peak-10)notes.push('Gyengén zárul — a végére erős, nagy energiájú szám kell.');
 if(songs.length>=4&&!songs.some(s=>s.e<=55))notes.push('Nincs lassú szám: egy lélegzetvétel feljebb vinné a csúcsot.');
 const need=minSet(a);
 if(songs.length<need)notes.push(`Még ${need-songs.length} dal kell — a teljes ívhez legalább ${need} szám.`);
 return{pts,score,avgE,notes,fatigue};
}
function showGrade(s){return s>=86?{g:'A+',c:'var(--cash)'}:s>=76?{g:'A',c:'var(--cash)'}:
 s>=64?{g:'B',c:'var(--neon)'}:s>=50?{g:'C',c:'var(--gold)'}:{g:'D',c:'var(--hot)'};}
/* estimate() ezt kapja setQ helyett: a show-pontszám (0–100), városfüggetlenül */
function setlistQ(a,list){return crowdSim(a,list||(S.tour&&S.tour.setlist)||[]).score;}
function setlistAvgE(a,list){return crowdSim(a,list||(S.tour&&S.tour.setlist)||[]).avgE;}

/* ---------- VÁROS-KIFÁRADÁS ----------
   Ha nemrég játszottál ott, a közönség „elhasználódott"; hetek alatt épül vissza.
   Ettől nem éri meg ugyanazt a bombaerős várost újra és újra lenyomni. */
const FRESH_WEEKS=20, FRESH_FLOOR=0.35;
function freshness(A,cityId){
 const last=A&&A.played?A.played[cityId]:undefined;
 if(last===undefined)return 1;
 const gap=Math.max(0,S.week-last);
 return clamp(FRESH_FLOOR+(1-FRESH_FLOOR)*(gap/FRESH_WEEKS),FRESH_FLOOR,1);
}
/* ---------- TURNÉ-MÉRET ----------
   A hosszabb turné megosztja az overheadet: állomásonként olcsóbb a fix költség. */
function tourScale(n){return clamp(1-(Math.max(1,n)-1)*0.045,0.80,1);}
function promoCost(stops,lvl){const seats=stops.reduce((s,x)=>s+VM[x.venue].cap,0);return Math.round(seats*PROMO[lvl||0].seat/1000)*1000;}
function legCost(prev,city,v){return Math.round(haversine(prev,city)*KM_RATE*v.tmul*(1-facLv('bus')*0.12)*(hasBig('jet')?0.75:1));}
function routeKm(){const s=S.tour.stops;let d=0;for(let i=1;i<s.length;i++)d+=haversine(CM[s[i-1].city],CM[s[i].city]);return Math.round(d);}
/* ============================ AKTIVITÁS-FOLYAM ============================
   Az iroda „hírfolyama": mérföldkövek, turnék, megjelenések. Ettől él a kezdőlap. */
function pushFeed(t,s,ic,col){
 if(!S.feed)S.feed=[];
 S.feed.unshift({t,s,ic:ic||'star',col:col||'var(--neon)',wk:S.week,fresh:1});
 S.feed=S.feed.slice(0,14);
}
/* szint- és helyszín-feloldás figyelése (bárhonnan jöhet a hírnév-változás) */
function checkUnlocks(){
 const lv=level();
 if(S.lastLevel===undefined)S.lastLevel=lv;
 else if(lv>S.lastLevel){Analytics.track('agency_level_up',{level:lv,rank:rankName(lv),rep:S.rep,tours:S.toursDone||0});
  pushFeed(`Iroda Lv.${lv} · ${rankName(lv)}`,'Új szint — nagyobb nevek is szóba állnak veled.','trophy','var(--gold)');S.lastLevel=lv;}
 const openN=VENUES.filter(venueOpen).length;
 if(S.lastVenues===undefined)S.lastVenues=openN;
 else if(openN>S.lastVenues){const v=VENUES[openN-1];
  pushFeed(`${v.n} feloldva`,`Mostantól ${k(v.cap)} férőhelyes helyszínt is szervezhetsz.`,v.ic,'var(--neon)');S.lastVenues=openN;}
}

/* ============================ HETI ÜTEM (a flywheel motorja) ============================
   Minden eltelt hét: a streaming a „természetes" szintje felé húz, a hype lecseng,
   a streaming lassan építi a rajongótábort, és csorog egy kis passzív bevétel. */
function advanceWeeks(n){
 n=Math.max(0,Math.round(n));if(!n)return 0;
 S.week+=n;let income=0;
 for(let w=0;w<n;w++){
  S.roster.forEach(id=>{
   const a=AM[id],st=artState(id),tgt=streamTarget(a);
   st.streams=Math.max(0,Math.round(st.streams+(tgt-st.streams)*0.18));
   st.hype=st.hype>0.02?st.hype*0.78:0;
   const m=st.streams/1e6*0.5;                       // 1M havi hallgató ≈ +0,5 alap
   Object.keys(REGIONS).forEach(r=>{                 // ott nő gyorsabban, ahol már van alap
    st.fans[r]=clamp(st.fans[r]+m*(0.4+st.fans[r]/100*0.9),0,100);});
   income+=st.streams*0.0015*(hasBig('label')?1.35:1);                        // 1M havi hallgató ≈ €1 500/hét
  });
  income+=venIncomeWeekly();                          // saját helyszínek bérleti bevétele
  income-=upkeepWeekly();                             // stáb-bér, fenntartás, retainer
 }
 income=Math.round(income);
 /* A heti egyenleg NEGATÍV is lehet (nagy gépezet, kevés streaming) — akkor is levonjuk,
    csak a kassza nem megy mínuszba. */
 S.money=Math.max(0,S.money+income);
 if(income>0)S.streamIncome=(S.streamIncome||0)+income;
 return income;
}

/* ============================ KIADÁSOK (stúdió) ============================
   Egyszerre egy kiadás készül (a stúdió foglalt). Ugyanaz az ütemezett-időbélyeg
   logika, mint a turnénál, ezért a játék bezárása alatt is elkészül. */
function startRelease(artistId,kindId){
 if(S.rel){toast('A stúdió most foglalt.');return;}
 const a=AM[artistId],k=RM[kindId],cost=relCost(a,k);
 if(S.money<cost){toast('Nincs elég pénz erre a kiadásra.');return;}
 S.money-=cost;
 Analytics.track('song_released',{type:kindId,artist:artistId,fame:AM[artistId]?af(AM[artistId]):0});
 S.rel={artist:artistId,kind:kindId,cost,ms:msFromMin(k.min),ends:Date.now()+msFromMin(k.min),days:k.days};
 save();render();startTicker();
 toast(`${a.n} · ${k.n} felvétele elkezdődött.`);
}
function finishRelease(){
 const R=S.rel;if(!R)return;
 const a=AM[R.artist],k=RM[R.kind],st=artState(R.artist);
 const relBoost=1+facLv('studio')*0.12+(hasStaff('prod')?0.25:0);
 st.hype+=k.hype*relBoost;
 st.fameAdd=Math.min(60,st.fameAdd+k.fameAdd);
 st.rels=(st.rels||0)+1;
 Object.keys(REGIONS).forEach(r=>{                    // ahol már ismerik, ott üt nagyobbat
  st.fans[r]=clamp(st.fans[r]+k.fansAdd*relBoost*(0.5+st.fans[r]/100),0,100);});
 const before=st.streams;
 st.streams=Math.round(st.streams*(1+k.hype*0.5));
 S.rel=null;
 S.relLog.unshift({artist:a.n,kind:k.n,ic:k.ic,week:S.week,
   gain:st.streams-before,fame:k.fameAdd,fans:k.fansAdd});
 S.relLog=S.relLog.slice(0,8);
 chalAdd('rel2',1);
 pushFeed(`${a.n} · ${k.n} megjelent`,`Streaming ${fmtStream(before)} → ${fmtStream(st.streams)} · +${k.fameAdd} hírnév`,k.ic,'var(--gold)');
 advanceWeeks(Math.max(1,Math.round(k.days/7)));
 save();
 toast(`${a.n} · ${k.n} megjelent! Streaming ${fmtStream(before)} → ${fmtStream(st.streams)}`);
}
function relRemain(){return S.rel?Math.max(0,S.rel.ends-Date.now()):0;}

/* ============================ ÉLŐ TURNÉ (IDŐMOTOR) ============================
   A turné nem azonnali: minden állomás és minden utazás valós időt vesz igénybe.
   A fázisok ütemezett időbélyegre végződnek (L.ends), ezért a játék bezárása/újratöltése
   után is helyesen halad tovább — a kihagyott fázisok betöltéskor bepótlódnak. */
function buildPhases(stops){
 const ph=[];
 for(let i=0;i<stops.length;i++){
  const km=i>0?haversine(CM[stops[i-1].city],CM[stops[i].city]):0;
  const tmin=i>0?travelMin(km):TIME.prepMin, smin=showMin(VM[stops[i].venue]);
  ph.push({k:'travel',i,km:Math.round(km),min:tmin,ms:msFromMin(tmin),days:i>0?travelDays(km):1});
  ph.push({k:'show',i,min:smin,ms:msFromMin(smin),days:1});
 }
 return ph;
}
/* a teljes turné valós hossza (a tervezőben előre kiírjuk) */
function tourRealMs(stops){return buildPhases(stops).reduce((s,p)=>s+p.ms,0);}
function launchTour(){
 const t=S.tour,a=AM[t.artist],cost=promoCost(t.stops,t.promo||0);
 Analytics.track('tour_created',{stops:t.stops.length,artist:t.artist,setlist:t.setlist.length});
 Analytics.track('tour_started',{stops:t.stops.length,artist:t.artist,fame:af(a),
   promo:t.promo||0,promo_cost:cost,venues:t.stops.map(x=>x.venue).join(','),agency_level:level()});

 S.live={artist:t.artist,setlist:t.setlist.slice(),promo:t.promo||0,promoSpent:cost,risk:!!t.risk,riskDone:false,
  stops:t.stops.map(s=>({...s})),ph:buildPhases(t.stops),i:0,ends:Date.now()+msFromMin(TIME.prepMin),
  pausedLeft:null,pendingEv:null,mom:1,attMul:1,skipNext:false,days:0,
  rows:[],log:[],evUsed:[],boost:{},fanGain:{},mini:{},miniSkip:{},
  tRev:0,tCost:0,tPay:0,tTrav:0,tAtt:0,tEvent:0,tMerch:0,tArtist:0,tTake:0,pool:0,rep:0};
 S.tour=null;S.tab='terkep';teardownMap();save();render();
}
function curPhase(){return S.live?S.live.ph[S.live.i]:null;}
function remainMs(){const L=S.live;if(!L)return 0;return L.pausedLeft!=null?L.pausedLeft:Math.max(0,L.ends-Date.now());}
function phaseCity(){const L=S.live,p=curPhase();if(!p)return null;return CM[L.stops[p.i].city];}

let TK=null;
function startTicker(){stopTicker();if(S.live||S.rel)TK=setInterval(tick,TIME.tick);}
function stopTicker(){if(TK){clearInterval(TK);TK=null;}}
function tick(){
 if(!S.live&&!S.rel){stopTicker();return;}
 /* stúdió: elkészült-e a kiadás (a turnétól függetlenül, párhuzamosan fut) */
 if(S.rel&&Date.now()>=S.rel.ends){finishRelease();if(S.tab==='studio')tabStudio();renderHUD();}
 else if(S.rel&&S.tab==='studio')paintRel();
 const L=S.live;if(!L){if(!S.rel)stopTicker();return;}
 if(L.pausedLeft!=null||L.pendingEv)return;
 const before=L.i;let guard=0;
 while(S.live&&S.live.pausedLeft==null&&!S.live.pendingEv&&Date.now()>=S.live.ends&&guard++<80)finishPhase();
 if(!S.live)return;                                  // turné véget ért
 if(S.live.pausedLeft!=null||S.live.pendingEv)return; // esemény modál nyílt
 if(S.live.i!==before){save();if(S.tab==='terkep')liveScreen();renderHUD();}
 else paintLive();
}
/* egy fázis lezárása: utazás kifizetése vagy koncert lejátszása */
function finishPhase(){
 const L=S.live,p=L.ph[L.i],a=AM[L.artist];
 if(p.k==='travel'){
  if(p.i>0){const c=legCost(CM[L.stops[p.i-1].city],CM[L.stops[p.i].city],VM[L.stops[p.i].venue]);
   L.pool-=c;L.tTrav+=c;L.tCost+=c;}   // a turné kasszáját terheli, nem közvetlenül az ügynökséget
  if(p.km>5000)advanceWeeks(1);
 }else{ runShow(p.i); advanceWeeks(1); }
 L.days+=p.days;
 L.i++;
 const nx=L.ph[L.i];
 if(nx&&nx.k==='show'){const ns=L.stops[nx.i];
  Analytics.track('concert_started',{city:CM[ns.city].n,venue:VM[ns.venue].id,price:ns.price,stop:nx.i+1});}
 if(L.i>=L.ph.length){endTour();return;}
 L.ends+=L.ph[L.i].ms;
 if(L.ends<Date.now()-3600000)L.ends=Date.now()+L.ph[L.i].ms;  // nagyon régi mentés: ne pörögjön el
 const ev=rollEvent();if(ev)openEvent(ev);
}
/* egy koncert lefutása — itt dől el a TÉNYLEGES nézőszám (szórással) */
function runShow(i){
 const L=S.live,a=AM[L.artist],st=L.stops[i],city=CM[st.city],v=VM[st.venue];
 const dr=(L.mini&&L.mini[i])||null;
 /* a dobos mini-játék a KÉSZ setlist-ív rendszeren át hat: a show-pontszámhoz adódik */
 const setQ=clamp(setlistQ(a,L.setlist)+(dr?dr.pts:0),0,114);
 const A=artState(a.id),reg=city.r,fansBefore=A.fans[reg];
 const e=estimate(a,city,v,st.price,setQ,L.mom,L.promo), sig=sigmaFor(a,L.promo);
 let att,fill,rev,cost,profit,repD,merch=0,fanG=0,cancelled=false;
 const comm=commRate(a), promoShare=Math.round((L.promoSpent||0)/Math.max(1,L.stops.length));
 if(L.skipNext){                       // elmaradt koncert: bérleti díj bukó, nincs bevétel
  cancelled=true;L.skipNext=false;att=0;fill=0;rev=0;cost=e.fix;profit=-cost;repD=-Math.round(v.rep/2);
 }else{
  /* kiadatlan szám bemutatása — az első koncerten dől el */
  let riskMul=1;
  if(L.risk&&!L.riskDone){L.riskDone=true;
   if(Math.random()<0.55){riskMul=1.15;A.hype+=0.35;S.rep+=6;L.rep+=6;
    L.log.push({t:'Berobbant a kiadatlan szám',s:'A közönség őrjöng, a felvétel terjed a neten · +6 hírnév, streaming-lökés',ic:'star'});
    pushFeed(`${a.n}: berobbant az új szám`,`${city.n} · a bemutató után ugrott a streaming`,'star','var(--cash)');}
   else{riskMul=0.94;S.rep=Math.max(0,S.rep-4);L.rep-=4;
    L.log.push({t:'Langyos fogadtatás',s:'A kiadatlan szám nem fogott — a közönség kivárt · −4 hírnév',ic:'alert'});}
  }
  const f=rollFactor(sig)*L.attMul*riskMul;
  att=clamp(Math.round(e.raw*f),0,v.cap);fill=att/v.cap;rev=att*st.price;
  cost=e.fix+Math.round(att*e.varRate);   // a fejenkénti rész a TÉNYLEGES nézőszámmal számol
  merch=merchRev(att,fansBefore);      // merch: nézőszám × rajongói szint × pult-fejlesztés
  profit=rev+merch-cost;
  repD=Math.round((fill-0.5)*v.rep);
  if(fill>=0.98)repD+=Math.round(v.rep*0.5);        // telt ház: extra hírnév
  else if(fill<0.25)repD-=Math.round(v.rep*0.6);    // kongó terem: rossz sajtó
  /* a fellépés építi az ottani rajongótábort — nagyobb hely, teltebb ház = többet */
  fanG=(0.5+fill)*(VFAN[v.id]||1)*(1+S.upg.marketing*0.05)*(fill>=0.98?1.25:1);
  A.fans[reg]=clamp(A.fans[reg]+fanG,0,100);
  L.fanGain[reg]=(L.fanGain[reg]||0)+fanG;
  L.mom=fill>=0.9?Math.min(1.4,L.mom+0.06):(fill<0.45?Math.max(0.75,L.mom-0.05):L.mom);
  A.played[st.city]=S.week;            // a varos kozonsege elhasznalodott, hetek alatt epul vissza
  (S.cities=S.cities||{})[st.city]=1;   // életmű: hány különböző városban játszottál
  bumpRec('maxFill',fill);bumpRec('bestAtt',att);
  if(v.cap>=20000){bumpRec('arenaFill',fill);if(fill>=0.9&&!(S.recs&&S.recs.firstArenaWeek))(S.recs=S.recs||{}).firstArenaWeek=S.week;}
  if(fill>=0.98&&v.id==='club'&&city.r==='SA')chalAdd('sa3',1);
 }
 L.attMul=1;                            // az eseményhatás egy koncertre szól
 /* A turné nyereségéből az ügynökség a JUTALÉKÁT viszi, a többi az előadóé. */
 const tp=profit-promoShare+(L.pool||0); L.pool=0;
 const take=Math.round(tp*comm), artistGets=tp-take;
 S.money+=take;                        // azonnal a kasszába (a HUD élőben követi)
 if(S.money<0){L.log.push({t:'A bank fedezte a hiányt',s:'Az ügynökség nem megy mínuszba, de a hírnév sérül.',ic:'alert'});
  S.money=0;S.rep=Math.max(0,S.rep-3);}
 if(take>0)S.earned=(S.earned||0)+take;   // életmű-bevétel: az Örökség-pont egyik alapja
 L.tArtist+=artistGets;L.tTake+=take;   // veszteséges estén is konzisztens a bontás
 if(!cancelled)bumpRec('bestNight',take);   // ugyanaz a valuta, mint a „legjobb turné"
 if(repD>0)repD=Math.round(repD*repMul()*(hasBig('hq')?1.08:1));          // örökség-perk + NG+ rang gyorsítja
 S.rep=Math.max(0,S.rep+repD);L.rep+=repD;
 L.tRev+=rev;L.tCost+=cost;L.tAtt+=att;L.tMerch+=merch;
 Analytics.track('concert_completed',{city:city.n,venue:v.id,artist_fame:af(a),fans:Math.round(fansBefore),
   attendance:att,capacity:v.cap,fill:Math.round(fill*100),revenue:Math.round(rev+merch),
   profit:Math.round(tp),commission:Math.round(take),agency_level:level(),cancelled:cancelled?1:0});
 L.rows.push({city:city.n,region:reg,photo:cityPhoto(city,600,300),venue:v.n,att,exp:e.att,cap:v.cap,fill,
   price:st.price,profit:take,merch,fans:Math.round(fansBefore),fanG:+fanG.toFixed(1),cancelled,
   drum:dr?{acc:dr.acc,pts:dr.pts}:null});
 if(!cancelled&&S.tab==='terkep')toast(`${city.n}: ${k(att)} néző · jutalék ${money(take)} (merch ${money(merch)})`);
}
function endTour(){
 const L=S.live,a=AM[L.artist],A=artState(a.id);
 if(L.pool){const t2=Math.round(L.pool*commRate(a));S.money+=t2;L.tTake+=t2;L.tArtist+=Math.max(0,L.pool-t2);L.pool=0;}
 const net=L.tTake;                                // az ügynökség tényleges bevétele: a jutalék
 if(L.rows.length)S.toursDone++;      // a megszakított turné nem számít
 /* Az elhanyagolt régiók lassan kopnak — ezért érdemes visszatérni oda, ahol felépítettél valamit.
    Csak a már jól ismert régiókat érinti, hogy a kezdés ne legyen büntető. */
 const decay={};
 Object.keys(REGIONS).forEach(r=>{
  if(!L.fanGain[r]&&A.fans[r]>30){const d=Math.min(1.5,(A.fans[r]-30)*0.05);A.fans[r]-=d;decay[r]=+d.toFixed(1);}});
 const fanRows=Object.entries(L.fanGain).map(([r,g])=>({r,n:rgN(r),g:+g.toFixed(1),now:Math.round(A.fans[r])}))
   .sort((x,y)=>y.g-x.g);
 S.lastResult={artist:a.n,photo:artistPhoto(a,600,400),rows:L.rows,tRev:L.tRev,tCost:L.tCost,tPay:L.tPay,tTrav:L.tTrav,
  net,rep:L.rep,tAtt:L.tAtt,setQ:Math.round(setlistQ(a,L.setlist)),promoSpent:L.promoSpent,tEvent:L.tEvent,days:L.days,log:L.log,
  tMerch:L.tMerch,fanRows,decay,streams:A.streams,tArtist:L.tArtist,tTake:L.tTake,comm:Math.round(commRate(a)*100)};
 Analytics.track('tour_completed',{stops:L.rows.length,net:net,commission_pct:Math.round(commRate(a)*100),
   attendance:L.tAtt,revenue:L.tRev+L.tMerch,days:L.days,agency_level:level()});
 pushFeed(`Turné vége · ${a.n}`,`${L.rows.length} állomás · ${k(L.tAtt)} néző · ${money(net)}`,'trophy',net>=0?'var(--cash)':'var(--hot)');
 /* csak a TÉNYLEG lejátszott állomások számítanak — különben a turné megszakítása
    ingyen adná a „Két kontinens" / „Globálissá válás" mérföldkövet */
 const conts={};L.rows.forEach(function(x){if(x.region)conts[x.region]=1;});
 bumpRec('cont',Object.keys(conts).length);bumpRec('bestTour',net);bumpRec('bestMerch',L.tMerch);
 if(Object.keys(conts).length>=4)bumpRec('stops4',L.rows.length);   // világkörüli turné mérete
 if(L.rows.length>=4)chalAdd('tour4',1);
 chalSet('mrc',Math.round(L.tMerch));
 S.hall=(S.hall||[]).concat([{artist:a.n,photo:artistPhoto(a,220,240),stops:L.rows.length,att:L.tAtt,net:net,week:S.week}])
   .sort(function(x,y){return y.net-x.net;}).slice(0,5);
 rollScout();
 S.live=null;S.resultPending=true;      // ha közben bezárták a játékot, újranyitáskor is lássa
 if(!S.rel)stopTicker();save();teardownMap();showResult();
}
function abandonTour(){
 const L=S.live;if(!L)return;
 const left=L.ph.slice(L.i).filter(p=>p.k==='show').length, pen=left*5;
 S.rep=Math.max(0,S.rep-pen);L.rep-=pen;
 L.log.push({t:'Turné megszakítva',s:`${left} elmaradt koncert · −${pen} hírnév`,ic:'alert'});

/* ---------- gyorsítás: MINDIG ingyen, egy koppintás ----------

 const L=S.live;if(!L||L.pendingEv)return;
 L.pausedLeft=null;L.ends=Date.now()-1;save();tick();
}
/* az egész hátralévő turné végigpörgetése — az első döntésnél megáll */

 while(S.live&&!S.live.pendingEv&&guard++<400){S.live.pausedLeft=null;S.live.ends=Date.now()-1;tick();}

/* ============================ VÁRATLAN ESEMÉNYEK ============================ */
const EV_CHANCE=0.40;                       // esély fázishatáronként
function rollEvent(){
 const L=S.live,p=L.ph[L.i];if(!p)return null;
 const slot=p.k==='show'?'pre':(L.i<=1?null:'road');   // koncert előtt / úton
 const slots=slot?[slot]:[];
 if(p.k==='travel'&&L.i>1)slots.push('post');          // az előző koncert utóélete
 if(!slots.length)return null;
 if(Math.random()>EV_CHANCE)return null;
 let pool=EVENTS.filter(e=>e.when.some(w=>slots.includes(w))&&L.evUsed.indexOf(e.id)<0);
 if(hasStaff('road'))pool=pool.filter(e=>['sound','gear','bus','visa'].indexOf(e.id)<0||Math.random()<0.5);
 if(!pool.length)return null;
 let tot=pool.reduce((s,e)=>s+e.w,0),r=Math.random()*tot;
 for(const e of pool){r-=e.w;if(r<=0)return e;}
 return pool[0];
}
function openEvent(ev){
 const L=S.live;
 L.pausedLeft=remainMs();L.pendingEv=ev.id;L.evUsed.push(ev.id);save();
 if(S.tab==='terkep')liveScreen();renderHUD();      // a háttér is a friss állapotot mutassa
 renderEvent(ev);
}
function renderEvent(ev){
 if(D){if(D.raf)clearInterval(D.raf);D=null;}   /* futó alku lezárása, hogy ne maradjon árva időzítő */
 const L=S.live,a=AM[L.artist],city=phaseCity()||CM[L.stops[0].city];
 const txt=ev.d.replace(/\{A\}/g,esc(a.n));
 let h=`<div class="ev"><div class="ph"><img src="${cityPhoto(city,700,300)}" ${imgFB()}><div class="g"></div>
   <span class="kick" style="color:var(--gold)">Váratlan esemény</span>
   <div class="ic" style="color:var(--gold)">${icon(ev.ic)}</div></div>
   <div class="bd"><h3>${esc(ev.t)}</h3><p>${txt}</p><div class="evch">`;
 ev.ch.forEach((c,i)=>h+=`<button class="evb ${c.c||''}" data-ch="${i}"><div class="l">${esc(c.l)}</div><div class="s">${esc(c.s)}</div></button>`);
 h+=`</div></div></div>`;
 const m=$('#modal');m.innerHTML=h;m.className='on';
 m.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>chooseEvent(ev,+b.dataset.ch));
}
function chooseEvent(ev,idx){
 const L=S.live,ch=ev.ch[idx],e=ch.e||{};
 let extra=0;
 let em=e.money||0, er=e.rep||0;
 const tech=['sound','gear','bus','visa','strike'].indexOf(ev.id)>=0;
 if(tech&&hasStaff('road')&&em<0)em=Math.round(em*0.75);      // road crew: olcsóbb technikai malőr
 if(hasStaff('pr')&&er<0)er=Math.round(er/2);                 // PR: fele hírnév-veszteség
 if(em){L.pool+=em;L.tEvent+=em;}
 if(er){S.rep=Math.max(0,S.rep+er);L.rep+=er;}
 if(e.att)L.attMul=clamp(L.attMul*(1+e.att),0.15,2.4);
 if(e.days)L.days+=e.days;
 if(e.skip)L.skipNext=true;
 if(e.wait)extra=e.wait;
 L.log.push({t:ev.t,s:ch.l+(em?` · ${money(em)}`:'')+(er?` · ${er>0?'+':''}${er} hírnév`:'')+
   (e.att?` · ${e.att>0?'+':''}${Math.round(e.att*100)}% nézőszám`:'')+(e.days?` · +${e.days} nap`:''),ic:ev.ic});
 L.ends=Date.now()+(L.pausedLeft||0)+extra;L.pausedLeft=null;L.pendingEv=null;
 $('#modal').className='';$('#modal').innerHTML='';
 save();if(S.tab==='terkep')liveScreen();renderHUD();
}

/* ============================ ANALITIKA ============================
   Cserélhető réteg, ugyanaz a minta, mint az Ads.show() / Store.buy():
   MOST no-op (fejlesztői módban konzol-log). Éles bekötéskor CSAK az
   Analytics.send() törzsét kell kicserélni — a hívási helyek maradnak.

   Firebase (web SDK):   logEvent(getAnalytics(), event, params)
   GA4 (gtag.js):        gtag('event', event, params)

   ADATVÉDELEM: kizárólag anonim JÁTÉK-események mennek, semmilyen személyes adat
   (nincs név, e-mail, eszköz-azonosító, IP-alapú mező). A réteg tiszteli az
   S.analyticsConsent kapcsolót.
   TODO éles bekötéskor: EU/GDPR alatt a consent alapértéke LEGYEN false, és egy
   consent-banner állítsa true-ra; a send() csak utána hívja a valódi SDK-t. */
const Analytics={
 ready:false, queue:[], log:[],
 debug:(location.search.indexOf('debug=1')>=0||location.search.indexOf('dbg')>=0),
 consent(){return S&&S.analyticsConsent!==false;},
 init(){
  if(this.ready)return;this.ready=true;
  /* TODO: itt inicializáld a valódi SDK-t (firebase initializeApp / gtag config). */
  if(!S.firstOpen){S.firstOpen=1;this.track('first_open',{});}
  this.track('session_start',{level:level(),tours:S.toursDone||0,week:S.week});
  const q=this.queue.slice();this.queue.length=0;q.forEach(x=>this.send(x.e,x.p));
 },
 track(event,params){
  if(!this.consent())return;                       // consent nélkül semmi nem megy sehova
  const p=Object.assign({},params||{});
  if(!this.ready&&event!=='first_open'&&event!=='session_start'){this.queue.push({e:event,p:p});return;}
  this.send(event,p);
 },

/* ============================ RITMUS MINI-JÁTÉK (dobos) ============================
   FILOZÓFIA: opcionális felső ráadás, nem kényszer. Aki nem játszik, annál a show
   tisztességes ALAPSZINTEN fut le — a mini-játék csak bónuszt ad (max +14 pont a
   show-értékeléshez), a gyenge játék pedig csak enyhén (max −8) húz le.
   A pontszám a KÉSZ setlist-ív rendszeren keresztül hat: a show-pontszámhoz adódik,
   onnan megy tovább a nézőszámba, merchbe és a rajongótáborba. */
/* A hit-zónák a háttérfotón látható VALÓDI hangszerekre esnek (x/y/w/h = a képdoboz %-a) */
const KIT=[
 {n:'Hi-hat', c:'#FFC24B', x:13, y:50, w:26, h:12, snd:'hihat'},
 {n:'Tom 1',  c:'#C6FF3A', x:34, y:46, w:24, h:14, snd:'tomHi'},
 {n:'Tom 2',  c:'#2FE39B', x:70, y:46, w:24, h:14, snd:'tomLo'},
 {n:'Crash',  c:'#FF3D84', x:86, y:33, w:26, h:12, snd:'crash'},
 {n:'Lábdob', c:'#7CC7FF', x:48, y:69, w:44, h:20, snd:'kick'},
];
/* KÖNNYÍTETT ritmus: lassabb tempó, ritkább minta, jóval nagyvonalúbb időablakok */
/* VILÁGÍTÓ ABLAK modell: a dob kigyullad és világít egy ideig — amíg világít, üss rá.
   Nincs pillanat-találgatás; a világító állapot maga a jelzés. */
/* Rövidebb, de sűrűbb menet: gyorsabb tempó, szűkülő időablakok, a végén szimultán padok. */
/* Egyszerre EGY pad villan — a szimultán padok túl kaotikusak voltak.
   Cserébe feszesebb tempó és rövidebb ablak, de az alap-átvitel könnyű marad. */
/* Kényelmes, teljesíthető szint: széles időablakok, nyugodt tempó. A max elérhető,
   az alap-átvitel könnyű. */
const RG={win:900,winHard:680,perfectFrac:0.26,bars:15000,bpm:96};
let M=null;

/* apró WebAudio visszajelzés — a találat legyen kielégítő */
let AC=null;
function blip(freq,dur,type,vol){
 if(S.sound===false)return;
 try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.16,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(dur||0.09));
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(dur||0.09)+0.02);
 }catch(e){}
}
/* ---------- DOBHANGOK ----------
   WebAudio-szintézis: nincs letöltendő sample, nulla latencia és licenc-kérdés.
   Minden hangszer a SAJÁT hangját kapja (kick / tom hi / tom lo / hi-hat / crash). */
let NOISE=null;
function noiseBuf(){
 if(NOISE)return NOISE;
 const n=Math.floor(AC.sampleRate*1.4),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 NOISE=b;return b;
}
function drumHit(kind){
 if(S.sound===false)return;   // a saját ütés MGAIN nélkül szól, a háttérzene fölé
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime, out=AC.destination;
  const env=(g,peak,dur,curve)=>{g.gain.setValueAtTime(peak,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);};
  if(kind==='kick'){
   const o=AC.createOscillator(),g=AC.createGain();
   o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(44,t+0.13);
   env(g,0.9,0.42);o.connect(g);g.connect(out);o.start(t);o.stop(t+0.45);
   const c=AC.createOscillator(),cg=AC.createGain();          // kattanás a lendülethez
   c.type='triangle';c.frequency.setValueAtTime(900,t);env(cg,0.22,0.035);
   c.connect(cg);cg.connect(out);c.start(t);c.stop(t+0.05);
  }else if(kind==='tomHi'||kind==='tomLo'){
   const hi=kind==='tomHi', f0=hi?260:170, f1=hi?110:72;
   const o=AC.createOscillator(),g=AC.createGain();
   o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+0.22);
   env(g,0.72,hi?0.34:0.44);o.connect(g);g.connect(out);o.start(t);o.stop(t+0.5);
   const s=AC.createBufferSource(),sg=AC.createGain(),bp=AC.createBiquadFilter();
   s.buffer=noiseBuf();bp.type='bandpass';bp.frequency.value=hi?520:340;bp.Q.value=1.2;
   env(sg,0.16,0.08);s.connect(bp);bp.connect(sg);sg.connect(out);s.start(t);s.stop(t+0.1);
  }else if(kind==='hihat'){
   const s=AC.createBufferSource(),g=AC.createGain(),hp=AC.createBiquadFilter();
   s.buffer=noiseBuf();hp.type='highpass';hp.frequency.value=7200;
   env(g,0.3,0.055);s.connect(hp);hp.connect(g);g.connect(out);s.start(t);s.stop(t+0.08);
  }else if(kind==='crash'){
   const s=AC.createBufferSource(),g=AC.createGain(),hp=AC.createBiquadFilter();
   s.buffer=noiseBuf();hp.type='highpass';hp.frequency.value=3600;
   g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.34,t+0.012);
   g.gain.exponentialRampToValueAtTime(0.0001,t+1.25);
   s.connect(hp);hp.connect(g);g.connect(out);s.start(t);s.stop(t+1.3);
  }
 }catch(e){}
}
function buildPattern(){
 /* A nóták a HÁTTÉRZENE ütemére esnek — így tényleg a dalra dobolsz.
    Nehézség-ív: a menet közepétől 2, a végétől 3 pad is felgyulladhat EGYSZERRE,
    és az időablak folyamatosan szűkül. A maxolás így valódi kihívás. */
 const beat=60000/RG.bpm, notes=[]; let pad=-1, k=0;
 for(let b=4;b*beat<RG.bars-700;b++){
  if(b%4===3)continue;                                  // egy levegővétel ütemenként
  const prog=(b*beat)/RG.bars;                          // 0 → 1
  const shrink=1-prog*0.14;                             // a vége felé feszesebb ablak
  const hard=(k%4===3);k++;
  let q,g=0;do{q=Math.floor(Math.random()*KIT.length);}while(q===pad&&g++<24);
  pad=q;
  notes.push({t:b*beat,dur:Math.max(520,Math.round((hard?RG.winHard:RG.win)*shrink)),hard:hard,pad:q,done:false});
 }
 return notes;
}

 M={notes:buildPattern(),t0:0,raf:0,iv:0,sched:-1,stop:stopIdx,crowd:46,combo:0,best:0,

function peakSong(a,list){
 const songs=(list||[]).map(i=>a.songs[i]).filter(Boolean);if(!songs.length)return null;
 let best=songs[0];songs.forEach(s=>{if(s.e>best.e)best=s;});return best;

function judge(kind,padEl){
 const j=$('#mJudge'),cb=$('#mCombo');
 const snd=padEl&&padEl.dataset?KIT[+padEl.dataset.pad]:null;
 if(kind==='perfect'){M.perfect++;M.combo++;M.crowd=clamp(M.crowd+3.6,0,100);
   drumHit(snd?snd.snd:'kick');blip(1320,0.06,'sine',0.09);}   // + apró csillanás a tökéletesre
 else if(kind==='good'){M.good++;M.combo++;M.crowd=clamp(M.crowd+2,0,100);drumHit(snd?snd.snd:'kick');}
 else{M.miss++;M.combo=0;M.crowd=clamp(M.crowd-4.2,0,100);blip(120,0.12,'square',0.11);}
 M.best=Math.max(M.best,M.combo);
 if(j){const txt=kind==='perfect'?'PERFECT':kind==='good'?'JÓ':'MELLÉ';
  const col=kind==='perfect'?'var(--neon)':kind==='good'?'var(--cash)':'var(--hot)';
  j.textContent=txt;j.style.color=col;j.classList.remove('go');void j.offsetWidth;j.classList.add('go');}
 if(cb)cb.textContent=M.combo>=3?`${M.combo}× SOROZAT`:'';
 if(padEl&&kind!=='miss'){padEl.classList.remove('flash');void padEl.offsetWidth;
  padEl.classList.add('flash','hitfx');setTimeout(()=>padEl.classList.remove('hitfx'),120);}
 const cr=$('#mCrowd');if(cr)cr.style.width=M.crowd.toFixed(1)+'%';
}
function tapPad(pi,padEl){
 if(!M||!M.started||M.ended)return;
 const now=performance.now()-M.t0;
 let hit=null;
 M.notes.forEach(n=>{if(n.done||n.pad!==pi||hit)return;if(now>=n.t&&now<=n.t+n.dur)hit=n;});
 if(!hit)return;                                  // nem világít semmi: nincs büntetés
 hit.done=true;
 const perfect=Math.abs(now-(hit.t+hit.dur/2))<=hit.dur*RG.perfectFrac;
 judge(perfect?'perfect':'good',padEl);
}
/* A LOGIKA idozitovel fut (lekesett notak, jatek vege), a RAJZOLAS rAF-fal.
   Igy a jatek akkor is helyesen zajlik le, ha a rAF akadozik vagy szunetel. */
function miniTick(){
 if(!M||M.ended)return;
 const now=performance.now()-M.t0;
 /* háttérzene: basszus + hi-hat + halk kick + szinti dallam, a nóták ugyanerre az ütemre esnek */
 if(S.sound!==false&&AC){
  const bm=60000/RG.bpm, b=Math.floor(now/bm);
  MGAIN=0.5;
  while(M.sched<b+2&&M.sched*bm<RG.bars){
   M.sched++;const k=M.sched, t=AC.currentTime+Math.max(0,(k*bm-now))/1000;
   if(k%2===0)schedKick(t);
   schedHat(t+bm/2000,false);
   if(k%2===0)schedBass(t,BASSN[(k>>1)%BASSN.length]);
   if(k>=8&&k%2===1)schedLead(t,LEADN[((k-9)>>1)%LEADN.length]);
   if(k%16===0)schedStab(t,220);
  }
  MGAIN=1;
 }
 M.notes.forEach(n=>{if(!n.done&&now>n.t+n.dur){n.done=true;judge('miss',null);}});
 if(now>=RG.bars)endMini();
}
function miniDraw(){
 if(!M||M.ended)return;
 const now=performance.now()-M.t0, pads=$('#mPads');
 if(pads){const zs=pads.querySelectorAll('.dz');
  for(let i=0;i<zs.length;i++){
   const el=zs[i],ring=el.querySelector('.dzr'),lit=el.querySelector('.dzl');
   let act=null;
   M.notes.forEach(n=>{if(n.done||n.pad!==i||act)return;if(now>=n.t&&now<=n.t+n.dur)act=n;});
   if(act){
    const p=clamp((now-act.t)/act.dur,0,1);       // mennyi telt el az ablakból
    ring.style.opacity=1;
    ring.style.transform='scale('+(1.32-p*0.5).toFixed(3)+')';
    if(lit)lit.style.opacity=(0.5*(1-p*0.5)).toFixed(2);
    el.classList.add('armed');
   }else{ring.style.opacity=0;if(lit)lit.style.opacity=0;el.classList.remove('armed');}
  }}
 M.raf=requestAnimationFrame(miniDraw);
}
/* pontszám → a show-értékeléshez adott pont (a setlist-ív rendszeren keresztül) */
/* mindkét mini-játék ugyanezt a skálát használja: max +14 bónusz, max −8 visszahúzás */
/* Megengedőbb pontozás: az átlagos játék is pluszban van, a büntetés enyhe. */
function miniPoints(acc){return Math.round(clamp((acc-0.38)*26,-4,14));}
/* közös eredmény-képernyő mindkét mini-játéknak */
function miniResult(kind,acc,detail){
 const pts=miniPoints(acc);
 S.live.mini=S.live.mini||{};
 S.live.mini[M.stop]={kind,acc:+acc.toFixed(3),pts};
 const grade=acc>=0.9?'A+':acc>=0.78?'A':acc>=0.62?'B':acc>=0.45?'C':'D';
 blip(acc>=0.62?1320:220,0.18,'sine',0.18);
 $('#mini').innerHTML=`<div class="mready" style="position:relative;flex:1">
   <div class="mcount" style="color:${pts>=0?'var(--neon)':'var(--hot)'}">${grade}</div>
   <h3>${Math.round(acc*100)}% ${kind==='lights'?'fényteljesítmény':'pontosság'}</h3>
   <p>${detail}<br><b style="color:${pts>=0?'var(--cash)':'var(--hot)'}">${pts>=0?'+':''}${pts} pont</b> a ma esti show-ra.</p>
   <button class="btn lime" id="mDone" style="max-width:280px">Vissza a koncertre</button></div>`;
 $('#mDone').onclick=()=>closeMini(true);
}
function endMini(){
 if(!M||M.ended)return;M.ended=true;cancelAnimationFrame(M.raf);if(M.iv)clearInterval(M.iv);
 const tot=Math.max(1,M.perfect+M.good+M.miss);
 const acc=(M.perfect+M.good*0.6)/tot;
 miniResult('drum',acc,`${M.perfect} perfect · ${M.good} jó · ${M.miss} mellé · leghosszabb sorozat ${M.best}×`);
}

/* ============================ FÉNYSHOW MINI-JÁTÉK (fénypult) ============================
   Profi koncert-fényrig: hátsó truss + színpad-perem mozgó fejgépekkel, volumetrikus
   nyalábok, haze, színwash, strobe — canvasra rajzolva. Alatta PROCEDURÁLIS zene
   (WebAudio, licencmentes), és a fények, a cue-k és a pontozás a ZENE ÜTEMÉRE mennek.
   Skill: irány + intenzitás húzással, szín-illesztés, és a dropra elsütött cue. */
/* Rövidebb és feszesebb: több drop, szűkebb cue-ablak. */
const LT={dur:16000,bpm:112,nBack:9,nFront:11,
  cols:[{id:'ice',n:'Kék',c:[110,215,255]},{id:'white',n:'Fehér',c:[235,245,255]},{id:'amber',n:'Arany',c:[255,180,70]}],
  drops:[6,12,18,24,29],
  cueWin:520};
function countdown(done){
 let c=3;const cd=$('#mCount');
 const step=function(){ if(!M||M.ended)return;
   if(c>0){if(cd)cd.textContent=c;blip(520+(3-c)*90,0.07,'sine',0.12);c--;setTimeout(step,620);}
   else{const r=$('#mReady');if(r)r.style.display='none';done();}};
 step();
}
function beatMs(){return 60000/LT.bpm;}
let MGAIN=1;   // háttérzene hangereje (a dobosnál halkabb, hogy a saját ütés kiemelkedjen)

/* ---- procedurális zene: kick / hat / basszus / stab, tiszta ütemmel ---- */
function schedKick(t){const o=AC.createOscillator(),g=AC.createGain();
 o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(46,t+0.11);
 g.gain.setValueAtTime(0.8*MGAIN,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.36);}
function schedHat(t,open){const s2=AC.createBufferSource(),g=AC.createGain(),hp=AC.createBiquadFilter();
 s2.buffer=noiseBuf();hp.type='highpass';hp.frequency.value=7600;
 g.gain.setValueAtTime((open?0.15:0.09)*MGAIN,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(open?0.16:0.045));
 s2.connect(hp);hp.connect(g);g.connect(AC.destination);s2.start(t);s2.stop(t+0.2);}
function schedBass(t,f){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
 o.type='sawtooth';o.frequency.setValueAtTime(f,t);lp.type='lowpass';lp.frequency.setValueAtTime(420,t);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2*MGAIN,t+0.02);
 g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
 o.connect(lp);lp.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.34);}
function schedStab(t,f){[1,1.5,2].forEach(function(m,i){const o=AC.createOscillator(),g=AC.createGain();
 o.type='square';o.frequency.setValueAtTime(f*m,t);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.07*MGAIN/(i+1),t+0.015);
 g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.45);});}
function schedRiser(t,dur){const s2=AC.createBufferSource(),g=AC.createGain(),bp=AC.createBiquadFilter();
 s2.buffer=noiseBuf();bp.type='bandpass';bp.Q.value=3;
 bp.frequency.setValueAtTime(500,t);bp.frequency.exponentialRampToValueAtTime(6500,t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16*MGAIN,t+dur*0.9);
 g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.06);
 s2.connect(bp);bp.connect(g);g.connect(AC.destination);s2.start(t);s2.stop(t+dur+0.1);}
const BASSN=[55,55,73.4,65.4];
const LEADN=[440,523.3,587.3,523.3,440,392,440,587.3];
function schedLead(t,f){const o=AC.createOscillator(),g=AC.createGain();

 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.06*MGAIN,t+0.02);

function fireCue(){
 if(!M||M.ended||!M.started)return;
 const now=performance.now()-M.t0;
 let hit=null;M.cues.forEach(function(c){if(!c.done&&Math.abs(c.t-now)<=LT.cueWin&&!hit)hit=c;});
 spawnFire(hit?1:0.45);
 if(hit){hit.done=true;hit.hit=true;M.cueOk++;M.combo++;M.best=Math.max(M.best,M.combo);
   M.crowd=clamp(M.crowd+9,0,100);M.strobe=1;M.flash=1;
   const cb=$('#cueBig');if(cb){cb.classList.remove('go');void cb.offsetWidth;cb.classList.add('go');}
   judgeL('hit');blip(180,0.16,'square',0.16);
 }else{M.combo=0;M.crowd=clamp(M.crowd-3,0,100);judgeL('early');blip(110,0.09,'square',0.09);}
}
function spawnFire(power){
 const n=Math.round(16+power*26);
 for(let i=0;i<n;i++){
  const side=Math.random();
  M.fire.push({x:0.06+0.88*side, y:0.94, vy:-(0.010+Math.random()*0.019)*(0.6+power),
    vx:(Math.random()-0.5)*0.006, life:1, r:0.02+Math.random()*0.035});
 }
 M.fireT=Math.max(M.fireT,power);
}

  j.style.color=kind==='hit'?'var(--neon)':'var(--hot)';
  j.classList.remove('go');void j.offsetWidth;j.classList.add('go');}
 if(cm)cm.textContent=M.combo>1?M.combo+'× sorozat':'';
}
function lightTick(){
 if(!M||M.ended)return;

 if(S.sound!==false&&AC){

   M.sched++;const k=M.sched, t=AC.currentTime+Math.max(0,(k*bm-now))/1000;
   schedKick(t);
   schedHat(t+bm/2000,false);
   if(k%2===0)schedBass(t,BASSN[(k>>1)%BASSN.length]);
   if(k%8===0)schedStab(t,220);
   if(LT.drops.indexOf(k)>=0){schedStab(t,330);schedHat(t,true);}

 else M.crowd=clamp(M.crowd-0.16,0,100);
 const wb=$('#wantBand');if(wb)wb.classList.toggle('ok',M.col===M.wantCol);
 M.cues.forEach(function(c){if(!c.done&&now>c.t+LT.cueWin){c.done=true;M.cueMiss++;M.combo=0;

function lightDraw(){
 if(!M||M.ended)return;
 const cv=$('#rigC');
 if(!cv){M.raf=requestAnimationFrame(lightDraw);return;}
 const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,now=performance.now()-M.t0,bm=beatMs();
 const beatF=(now%bm)/bm, pulse=Math.pow(1-beatF,2.2);
 const c=LT.cols[M.col].c, inten=0.72+0.28*pulse;
 ctx.globalCompositeOperation='source-over';
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#060a12');g.addColorStop(1,'#030407');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='lighter';
 /* A nyalábok MAGUKTÓL söpörnek — gyors, ellentétes fázisú mozgás. */
 const sweep=function(i,n,speed,phase){return 0.5+0.46*Math.sin(now/speed+phase+i*0.55);};
 const drawBeams=function(n,y0,dir,len,alpha,speed,phase){
  for(let i=0;i<n;i++){
   const fx=W*(0.06+0.88*(n===1?0.5:i/(n-1)));
   const ex=sweep(i,n,speed,phase)*W, ey=y0+dir*len*H;
   const ang=Math.atan2(ey-y0,ex-fx), wid=W*0.030*(0.7+inten*0.8);
   const px=Math.cos(ang+Math.PI/2)*wid, py=Math.sin(ang+Math.PI/2)*wid;
   const gr=ctx.createLinearGradient(fx,y0,ex,ey);
   const aa=alpha*inten*(0.55+0.45*pulse);
   gr.addColorStop(0,'rgba(255,255,255,'+(aa*0.85).toFixed(3)+')');
   gr.addColorStop(0.12,'rgba('+c[0]+','+c[1]+','+c[2]+','+(aa*0.8).toFixed(3)+')');
   gr.addColorStop(0.6,'rgba('+c[0]+','+c[1]+','+c[2]+','+(aa*0.22).toFixed(3)+')');
   gr.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
   ctx.fillStyle=gr;ctx.beginPath();
   ctx.moveTo(fx-px*0.25,y0-py*0.25);ctx.lineTo(fx+px*0.25,y0+py*0.25);
   ctx.lineTo(ex+px*2.6,ey+py*2.6);ctx.lineTo(ex-px*2.6,ey-py*2.6);
   ctx.closePath();ctx.fill();
   const hg=ctx.createRadialGradient(fx,y0,0,fx,y0,W*0.028);
   hg.addColorStop(0,'rgba(255,255,255,'+(0.9*inten).toFixed(2)+')');
   hg.addColorStop(0.35,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.5*inten).toFixed(2)+')');
   hg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=hg;
   ctx.beginPath();ctx.arc(fx,y0,W*0.028,0,7);ctx.fill();
  }
 };
 drawBeams(LT.nBack, H*0.16, 1, 1.05, 0.62, 520, 0);
 drawBeams(LT.nFront, H*0.93, -1, 1.0, 0.52, 380, 2.1);
 const hz=ctx.createLinearGradient(0,H*0.16,0,H);
 hz.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.06*inten).toFixed(3)+')');
 hz.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=hz;ctx.fillRect(0,0,W,H);
 /* ---- TŰZ a színpad elején ---- */
 for(let i=M.fire.length-1;i>=0;i--){
  const f=M.fire[i];
  f.x+=f.vx;f.y+=f.vy;f.vy*=0.985;f.life-=0.022;

  const px2=f.x*W, py2=f.y*H, rr=f.r*W*(0.5+f.life);
  const fg=ctx.createRadialGradient(px2,py2,0,px2,py2,rr);

  fg.addColorStop(0.45,'rgba(255,'+Math.round(150*t)+',40,'+(0.5*t).toFixed(3)+')');
  fg.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(px2,py2,rr,0,7);ctx.fill();
 }
 ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(0,H*0.145,W,H*0.012);ctx.fillRect(0,H*0.925,W,H*0.014);
 ctx.globalCompositeOperation='lighter';
 if(M.strobe>0.02){ctx.fillStyle='rgba(255,255,255,'+(M.strobe*0.5*(Math.random()>0.4?1:0.2)).toFixed(3)+')';ctx.fillRect(0,0,W,H);}

 M.raf=requestAnimationFrame(lightDraw);
}

/* ============================ ZONGORA MINI-JÁTÉK (Synthesia-stílus) ============================
   Alul egy oktáv (7 fehér + 5 fekete), felülről esnek a hangok a saját billentyűjük fölött.
   Rövid nóta = koppintás, hosszú = tartás, amíg a sáv tart. Opcionális, kihagyható. */
const PK=[ /* i = billentyű sorrend, w = fehér? , n = név, semi = félhang a C-től */
 {n:'C',w:1,s:0},{n:'C#',w:0,s:1},{n:'D',w:1,s:2},{n:'D#',w:0,s:3},{n:'E',w:1,s:4},
 {n:'F',w:1,s:5},{n:'F#',w:0,s:6},{n:'G',w:1,s:7},{n:'G#',w:0,s:8},{n:'A',w:1,s:9},
 {n:'A#',w:0,s:10},{n:'B',w:1,s:11}];
const PN={dur:16000,bpm:92,fall:1700,win:250,hold:0.62};   // fall = esési idő ms, win = találati ablak
function pianoFreq(semi){return 261.63*Math.pow(2,semi/12);}
function pianoTone(semi,len){
 if(S.sound===false)return;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 if(!AC)return;const t=AC.currentTime, f=pianoFreq(semi);
 [1,2,3].forEach(function(h,i){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=i===0?'triangle':'sine';o.frequency.value=f*h;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.16/(i+1),t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.25,len/1000));
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+Math.max(0.3,len/1000)+0.05);});
}
function buildPiano(){
 /* dallamos, könnyen olvasható minta: lépcsős mozgás + néhány tartott hang */
 const beat=60000/PN.bpm, notes=[];
 const scale=[0,2,4,5,7,9,11];           // C-dúr: csak fehér billentyűk a törzsben
 let k=0;
 for(let b=2;b*beat<PN.dur-900;b++){
  if(b%8===7)continue;                    // levegő
  const longOne=(k%6===5);
  const idx=scale[(Math.round(3+2.5*Math.sin(b*0.7)+ (b%3===0?1:0))+7)%7];
  const key=PK.findIndex(function(x){return x.s===idx;});
  notes.push({t:b*beat,dur:longOne?beat*1.6:beat*0.42,key:key<0?0:key,done:false,held:0,hit:false});
  k++;
 }
 return notes;
}

 M.total=M.notes.length;

 $('#mini').innerHTML=

  '<div class="pnroll" id="pnRoll"><canvas id="pnC"></canvas><div class="pnline"></div></div>'+

  '<div class="mmid" style="flex:0 0 auto;min-height:44px"><div class="mjudge" id="mJudge" style="font-size:29px"></div><div class="mcombo" id="mCombo"></div></div>'+
