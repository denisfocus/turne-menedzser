 const now=performance.now()-M.t0;
 let best=null,bd=1e9;
 M.notes.forEach(function(n){if(n.done||n.key!==ki)return;
  const d=Math.abs(n.t-now);if(d<bd){bd=d;best=n;}});
 if(best&&bd<=PN.win){best.hit=true;best.startedAt=now;
  if(bd<=PN.win*0.42){M.perfect++;pjudge('perfect');}else{M.good++;pjudge('good');}
  M.combo++;M.best=Math.max(M.best,M.combo);M.crowd=clamp(M.crowd+2.4,0,100);
  if(best.dur<300){best.done=true;}
 }else{M.crowd=clamp(M.crowd-0.8,0,100);}
 pianoTone(PK[ki].s,320);
}
function pianoUp(ki,el){
 if(!M)return;delete M.down[ki];
 if(el)el.classList.remove('down');
}
function pjudge(kind){
 const j=$('#mJudge'),cm=$('#mCombo');
 if(j){j.textContent=kind==='perfect'?'PERFECT':(kind==='good'?'JÓ':'MELLÉ');
  j.style.color=kind==='perfect'?'var(--neon)':(kind==='good'?'var(--cash)':'var(--hot)');
  j.classList.remove('go');void j.offsetWidth;j.classList.add('go');}
 if(cm)cm.textContent=M.combo>1?M.combo+'× sorozat':'';
}
function pianoTick(){
 if(!M||M.ended)return;
 const now=performance.now()-M.t0, bm=60000/PN.bpm, b=Math.floor(now/bm);
 if(S.sound!==false&&AC){
  while(M.sched<b+2&&M.sched<M.nBeats){
   M.sched++;const k=M.sched, t=AC.currentTime+Math.max(0,(k*bm-now))/1000;
   MGAIN=0.34;
   if(k%2===0)schedKick(t);
   schedHat(t+bm/2000,false);
   if(k%4===0)schedBass(t,BASSN[(k>>2)%BASSN.length]);
   MGAIN=0.5;
  }
 }
 /* tartás mérése + lekésett nóták */
 M.notes.forEach(function(n){
  if(n.done)return;
  const isLong=n.dur>=300;
  if(n.hit&&isLong&&now>=n.t&&now<=n.t+n.dur){
   M.holdAll++;
   if(M.down[n.key]){M.holdOn++;M.crowd=clamp(M.crowd+0.12,0,100);}
  }
  if(now>n.t+Math.max(n.dur,PN.win)){
   n.done=true;
   if(!n.hit){M.miss++;M.combo=0;M.crowd=clamp(M.crowd-3.2,0,100);pjudge('miss');}
  }
 });
 const cr=$('#mCrowd');if(cr)cr.style.width=M.crowd.toFixed(1)+'%';
 if(now>=PN.dur)endPiano();
}
function pianoDraw(){
 if(!M||M.ended)return;
 const cv=$('#pnC');if(!cv){M.raf=requestAnimationFrame(pianoDraw);return;}
 const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,now=performance.now()-M.t0;
 ctx.clearRect(0,0,W,H);
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#080b10');g.addColorStop(1,'#0c1119');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 /* sávok a fehér billentyűk mentén */
 const white=[];PK.forEach(function(k,i){if(k.w)white.push(i);});
 const wN=white.length;
 ctx.fillStyle='rgba(255,255,255,.045)';
 for(let i=1;i<wN;i++){const x=i/wN*W;ctx.fillRect(x-0.5,0,1,H);}
 const xOf=function(ki){
  const k=PK[ki];
  if(k.w){const wi=white.indexOf(ki);return {x:wi/wN*W,w:W/wN};}
  const leftWhite=white.filter(function(w){return w<ki;}).length-1;
  return {x:(leftWhite+1)/wN*W - (W/wN)*0.30, w:(W/wN)*0.60};
 };
 M.notes.forEach(function(n){
  const dy=(n.t-now)/PN.fall;                 // 1 = teteje, 0 = billentyűvonal
  const yEnd=H-dy*H;                          // a nóta ELEJE
  const len=Math.max(10,(n.dur/PN.fall)*H);
  const yTop=yEnd-len;
  if(yEnd<-20||yTop>H+20)return;
  const p=xOf(n.key), pad=Math.max(2,p.w*0.10);
  const col=n.hit?[198,255,58]:(PK[n.key].w?[124,199,255]:[255,159,58]);
  const alpha=n.done&&!n.hit?0.25:0.95;
  const gr=ctx.createLinearGradient(0,yTop,0,yEnd);
  gr.addColorStop(0,'rgba('+col.join(',')+','+(alpha*0.55).toFixed(2)+')');
  gr.addColorStop(1,'rgba('+col.join(',')+','+alpha.toFixed(2)+')');
  ctx.fillStyle=gr;
  const r=Math.min(8,p.w*0.22);
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(p.x+pad,yTop,p.w-pad*2,len,r);
  else ctx.rect(p.x+pad,yTop,p.w-pad*2,len);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,'+(alpha*0.5).toFixed(2)+')';
  ctx.fillRect(p.x+pad,yEnd-3,p.w-pad*2,3);
 });
 /* találati vonal fénye */
 const lg=ctx.createLinearGradient(0,H-26,0,H);
 lg.addColorStop(0,'rgba(198,255,58,0)');lg.addColorStop(1,'rgba(198,255,58,.30)');
 ctx.fillStyle=lg;ctx.fillRect(0,H-26,W,26);
 M.raf=requestAnimationFrame(pianoDraw);
}
function endPiano(){
 if(!M||M.ended)return;M.ended=true;cancelAnimationFrame(M.raf);if(M.iv)clearInterval(M.iv);
 const tot=Math.max(1,M.perfect+M.good+M.miss);
 const hitAcc=(M.perfect+M.good*0.6)/tot;
 const hold=M.holdAll?M.holdOn/M.holdAll:1;
 const acc=clamp(hitAcc*0.75+hold*0.25,0,1);
 miniResult('piano',acc,
  M.perfect+' perfect · '+M.good+' jó · '+M.miss+' mellé · '+Math.round(hold*100)+'% tartás<br>leghosszabb sorozat '+M.best+'×');
}

/* ---------- VÁSÁRLÁS: App Store / Google Play ----------
   A cordova-plugin-purchase globális objektumát használjuk (CdvPurchase). A termékek
   azonosítói a PACKS tömbben vannak; ugyanezekkel kell létrehozni őket a boltokban.
   Ha a plugin nincs jelen (web), minden hívás csendben visszaesik a fejlesztői ágra. */
const IAP={
 ready:false, pending:null,
 init(){
  const CP=window.CdvPurchase;
  if(!CP||!isNative()||IAP.ready)return;
  try{
   const store=CP.store, PT=CP.ProductType, PF=CP.Platform;
   const platform=(nativePlatform()==='ios')?PF.APPLE_APPSTORE:PF.GOOGLE_PLAY;
   PACKS.forEach(function(pk){
    store.register({id:pk.id,type:PT.CONSUMABLE,platform:platform});
   });
   store.when()
    .approved(function(tr){tr.verify();})
    .verified(function(receipt){
      (receipt.collection||[]).forEach(function(item){IAP.grant(item.id);});
      receipt.finish();
    })
    .receiptUpdated(function(){})
    .productUpdated(function(){});
   store.error(function(){ if(IAP.pending){IAP.pending=null;toast('A vásárlás nem sikerült.');} });
   store.initialize([platform]);
   IAP.ready=true;
   Analytics.track('iap_ready',{platform:nativePlatform()});
  }catch(e){IAP.ready=false;}
 },
 grant(productId){
  const pk=PACKS.find(function(p){return p.id===productId;});
  if(!pk)return;
  S.credits=credits()+pk.c;save();renderHUD();
  Analytics.track('iap_completed',{pack:pk.c,price:pk.eur,native:1});
  toast(`+${pk.c} kredit jóváírva.`);
  const cb=IAP.pending;IAP.pending=null;if(cb)cb();
 },
 buy(pack,onOk){
  const CP=window.CdvPurchase;
  if(!CP||!IAP.ready)return false;
  try{
   const prod=CP.store.get(pack.id);
   const offer=prod&&prod.getOffer&&prod.getOffer();
   if(!offer)return false;
   IAP.pending=onOk||null;
   offer.order();
   return true;
  }catch(e){return false;}
 },
 restore(){
  const CP=window.CdvPurchase;
  if(CP&&IAP.ready){try{CP.store.restorePurchases();}catch(e){}}
 }
};

/* ============================ SZÁMLÁLÓ ANIMÁCIÓ ============================ */
function animateNum(el,to,fmt){if(!el)return;const from=parseFloat(el.dataset.v||'0')||0;
 /* háttérben a requestAnimationFrame nem fut → azonnal a végértéket írjuk, ne ragadjon 0-n */
 if(from===to||document.hidden){el.textContent=fmt(to);el.dataset.v=to;return;}
 const t0=performance.now(),dur=650;el.dataset.v=to;
 function step(t){const p=clamp((t-t0)/dur,0,1),e=1-Math.pow(1-p,3),val=from+(to-from)*e;el.textContent=fmt(val);if(p<1)requestAnimationFrame(step);}
 requestAnimationFrame(step);}

 const st=OB[S.ob];

 let tgt=st.sel?document.querySelector(st.sel):null;

 if($('#modal').className==='on'&&st.onModal){

 if(!onRes&&st.onRes&&!st.wait){obHide();return;}
 const needScroll=(obLast!==S.ob);
 if(needScroll)obLast=S.ob;
 const app=$('#app').getBoundingClientRect();
 /* A kiemelés és a buborék a FIX sávok közé szorul: nem lóghat a HUD-ra, a lenti

 if(bar.dataset.sig!==sig){

  if(!foc||(bar.dataset.sig||'').split('|')[0]!==st.id){

     '<h4>'+obTx(st,'t')+'</h4>'+(obTx(st,'p')?'<p>'+obTx(st,'p')+'</p>':'')+

 bar.className='on'+(st.slim?' slim':'');
 document.body.classList.toggle('obwide',!!st.wide);

 {

/* ---- 5) FORGÓ KIHÍVÁSOK (teljesítéssel váltanak, NEM időzítővel) ---- */
const CHALS=[
 {id:'sa3',n:'Dél-amerikai roham',d:'Játssz 3 telt házas klubkoncertet Dél-Amerikában.',g:3,rw:{cred:12}},
 {id:'rel2',n:'Stúdiómaraton',d:'Adj ki 2 zenét (single, EP vagy album).',g:2,rw:{money:60000}},
 {id:'fan60',n:'Helyi hősök',d:'Érj el 60 rajongót egy régióban.',g:60,rw:{cred:10}},
 {id:'tour4',n:'Nagy körút',d:'Vigyél végig egy 4+ állomásos turnét.',g:1,rw:{money:50000}},
 {id:'mrc',n:'Pólóbiznisz',d:'Keress €50 000 merchet egy turnén.',g:50000,rw:{cred:12}},
 {id:'ai',n:'Ázsiai áttörés',d:'Érj el 45 rajongót Ázsiában.',g:45,rw:{cred:12}},
];
function chalBase(id){
 /* a rajongó-alapú kihívásoknál a KIINDULÓ szintet rögzítjük, és a növekményt mérjük —
    különben egy már meglévő rajongótábor minden renderkor újra teljesítené a kihívást */
 const rg=id==='ai'?'AS':null;let best=0;
 (S.roster||[]).forEach(function(x){const A=artState(x);
  Object.keys(REGIONS).forEach(function(g){if(rg&&g!==rg)return;best=Math.max(best,A.fans[g]||0);});});
 return Math.round(best);
}
function rollChal(){
 const pool=CHALS.filter(function(c){return !S.chal||c.id!==S.chal.id;});
 const c=pool[Math.floor(Math.random()*pool.length)]||CHALS[0];
 S.chal={id:c.id,p:0,b:(c.id==='fan60'||c.id==='ai')?chalBase(c.id):0};return S.chal;
}
function curChal(){if(!S.chal)rollChal();const d=CHALS.find(function(c){return c.id===S.chal.id;});return d?{d:d,st:S.chal}:null;}
function chalSet(id,val){const c=curChal();if(!c||c.d.id!==id)return;
 /* bázisos kihívásnál a kiinduló szint FÖLÉ kell nőni — így nem teljesül minden renderkor */
 const b=c.st.b||0, p=(b&&val<=b)?0:val;
 if(p>c.st.p)c.st.p=p;chalCheck();}
function chalAdd(id,n){const c=curChal();if(!c||c.d.id!==id)return;c.st.p+=n;chalCheck();}
function chalCheck(){
 const c=curChal();if(!c)return;
 if(c.st.p>=c.d.g){
  const got=grantReward(c.d.rw);
  pushFeed('Kihívás teljesítve: '+c.d.n,(got?got+' · ':'')+c.d.d,'trophy','var(--cash)');
  toast('Kihívás kész: '+c.d.n+(got?' · '+got:''));
  S.chalDone=(S.chalDone||0)+1;rollChal();
 }
}
/* élőben mért kihívások frissítése */
function chalLive(){
 const c=curChal();if(!c)return;
 if(c.d.id==='fan60'||c.d.id==='ai'){
  const rg=c.d.id==='ai'?'AS':null;let best=0;
  S.roster.forEach(function(id){const A=artState(id);
   Object.keys(REGIONS).forEach(function(g){if(rg&&g!==rg)return;best=Math.max(best,A.fans[g]||0);});});
  chalSet(c.d.id,Math.round(best));   // chalSet a b-hez képest számol
 }
}

function artNext(a){const f=af(a);for(let i=0;i<ARCS.length;i++)if(f<ARCS[i].f)return ARCS[i];return null;}

/* ============================ RÉSZESEDÉS-ALKU ============================
   Leigazoláskor a játékos megalkudja az ÜGYNÖKSÉGI részesedést. A csúszka a kért %,
   a sikeresély élőben látszik: minél többet kérsz az alaphoz képest, annál kisebb —
   és egy felfutott sztárt sokkal nehezebb megszorítani, mint egy feltörekvőt.
   Az alku egy mozgó jelölő megállítása: a siker-zóna MÉRETE = a sikeresély. */
/* Valós zeneipari modell: a játékos a MENEDZSMENT, ami az előadó bevételéből
   jutalékot visz (management + booking, tipikusan 15-20%). Az előadó viszi a többséget.
   A jutalék alapja a turné NYERESÉGE (bevétel + merch − költségek), és a split 100%-ra jön ki.
   Alap-jutalék státusz szerint: a nagy név alkuereje miatt kevesebbet enged. */
function dealBase(a){const f=af(a);return f>=85?12:f>=65?16:f>=45?20:25;}
function dealChance(a,ask){
 const base=dealBase(a), steep=0.9+af(a)/50;      // sztárnál meredekebb a romlás
 return clamp(0.92+(hasStaff('mgr')?0.08:0)-Math.max(0,ask-base)*0.045*steep,0.05,0.95);
}
function dealShare(a){const d=S.deal&&S.deal[a.id];return d===undefined?dealBase(a):d;}
function commRate(a){return dealShare(a)/100;}
function openDeal(id){
 if(S.roster.length>=rosterCap()){toast('Tele az iroda ('+rosterCap()+' előadó) — fejleszd a Nagyobb irodát!');return;}
 const a=AM[id];
 if(S.money<a.sign){toast('Nincs elég pénz.');return;}
 const base=dealBase(a);
 D={a:a,ask:base,round:0,done:false,pos:0,dir:1,raf:0,zone:0.5};
 renderDeal();
}
let D=null;
function dealStatus(a){const f=af(a);return f>=85?'Legenda':f>=65?'Sztár':f>=45?'Áttörés':'Feltörekvő';}
function renderDeal(){
 const a=D.a,base=dealBase(a),ch=dealChance(a,D.ask);
 let h='<div class="ev"><div class="ph"><img src="'+artistPhoto(a,700,300)+'" '+imgFB()+'><div class="g"></div>'+
   '<span class="kick" style="color:var(--neon)">Szerződés-tárgyalás</span>'+
   '<div class="ic" style="color:var(--neon)">'+icon(a.ic)+'</div></div>'+
  '<div class="bd"><h3>'+esc(a.n)+'</h3>'+
   '<p>'+dealStatus(a)+' · hírnév '+af(a)+' · szokásos jutalék <b>'+base+'%</b><br>'+
     'Leigazolási díj: <b>'+(a.sign?money(a.sign):'ingyen')+'</b></p>'+
   '<div class="grp2" style="margin-top:14px"><div class="gl gl2"><span>Menedzsment-jutalék</span>'+
     '<span class="bigprice" id="dPct">'+D.ask+'%</span></div>'+
     '<div class="prow"><button class="step" data-dn="-1">−</button>'+
       '<input type="range" min="5" max="30" step="1" value="'+D.ask+'" id="dRange">'+
       '<button class="step" data-dn="1">+</button></div></div>'+
   '<div class="band"><span>Sikeresély</span><span><b id="dCh" style="color:'+(ch>=0.6?'var(--cash)':ch>=0.3?'var(--gold)':'var(--hot)')+'">'+Math.round(ch*100)+'%</b></span></div>'+
   '<div class="band"><span>Ügynökség / Előadó</span><span><b id="dCut">'+D.ask+'% / '+(100-D.ask)+'%</b></span></div>'+
   '<div class="band"><span>Alapja</span><span>a turné nyeresége</span></div>'+
   
   '<div class="evch" style="margin-top:13px">'+
     '<button class="evb good" data-go="1"><div class="l">'+icon('star','15px')+' Alkudjunk · '+D.ask+'%</div></button>'+
     '<button class="evb" data-base="1"><div class="l">Elfogadom az alapot · '+base+'%</div></button>'+
     '<button class="evb" data-cancel="1"><div class="l">Mégse</div></button>'+
   '</div></div></div>';
 const m=$('#modal');m.innerHTML=h;m.className='on';
 const rg=$('#dRange');
 const upd=function(){D.ask=+rg.value;const c2=dealChance(a,D.ask);
  $('#dPct').textContent=D.ask+'%';
  const e=$('#dCh');e.textContent=Math.round(c2*100)+'%';
  e.style.color=c2>=0.6?'var(--cash)':c2>=0.3?'var(--gold)':'var(--hot)';
  $('#dCut').textContent=D.ask+'% / '+(100-D.ask)+'%';
  m.querySelector('[data-go] .l').innerHTML=icon('star','15px')+' Alkudjunk · '+D.ask+'%';};
 rg.oninput=upd;
 m.querySelectorAll('[data-dn]').forEach(function(b){b.onclick=function(){rg.value=clamp(+rg.value+(+b.dataset.dn),5,30);upd();};});
 m.querySelector('[data-go]').onclick=function(){D.round=0;dealRound();};
 m.querySelector('[data-base]').onclick=function(){D.ask=base;closeDeal(true);};
 m.querySelector('[data-cancel]').onclick=function(){
   if(D&&D.raf)clearInterval(D.raf);
   D=null;$('#modal').className='';$('#modal').innerHTML='';obRewindTo('sign');render();};
}
function dealRound(){
 D.round++;
 const a=D.a,ch=dealChance(a,D.ask);
 /* A nehézség SZOROSAN a sikeresélyhez kötött, két tengelyen egyszerre:
    a zóna négyzetesen szűkül, a jelölő pedig gyorsul. Egy mohó ajánlat így valódi
    kockázat: 90% → fél sáv és lassú inga, 5% → hajszálcsík és villámgyors inga. */
 D.zw=clamp(0.05+ch*ch*0.52,0.05,0.60);
 D.spd=0.014+(1-ch)*0.024;
 D.zone=D.zw/2+Math.random()*(1-D.zw);           // a zóna végig a sávon belül marad
 D.pos=0;D.dir=1;D.locked=false;
 const h='<div class="ev"><div class="bd">'+
  '<h3>Alku · '+D.round+'/3 próba</h3>'+
  '<p>Állítsd meg a jelölőt a sávban.</p>'+
  '<div class="dealbar" id="dBar"><span class="dz2" id="dZone"></span><i class="dm" id="dMark"></i></div>'+
  '<button class="cuebtn" id="dStop" style="margin-top:16px">MEGÁLLÍT</button>'+
  '<div class="band" style="justify-content:center;margin-top:12px"><span id="dMsg">Kért jutalék: <b>'+D.ask+'%</b></span></div>'+
  '</div></div>';
 const m=$('#modal');m.innerHTML=h;m.className='on';
 const z=$('#dZone');z.style.left=((D.zone-D.zw/2)*100).toFixed(1)+'%';z.style.width=(D.zw*100).toFixed(1)+'%';
 $('#dStop').onclick=dealStop;
 /* időzítőn fut, nem rAF-on: akkor is helyesen mozog, ha a rajzolás akadozik */
 const step=function(){
  if(!D||D.locked)return;
  D.pos+=D.dir*(D.spd||0.018);
  if(D.pos>=1){D.pos=1;D.dir=-1;} if(D.pos<=0){D.pos=0;D.dir=1;}
  const mk=$('#dMark');if(mk)mk.style.left=(D.pos*100).toFixed(1)+'%';};
 D.raf=setInterval(step,16);
}
function dealStop(){
 if(!D||D.locked)return;D.locked=true;clearInterval(D.raf);
 const ok=Math.abs(D.pos-D.zone)<=D.zw/2;
 Analytics.track('contract_negotiated',{artist:D.a.id,asked:D.ask,base:dealBase(D.a),
   round:D.round,chance:Math.round(dealChance(D.a,D.ask)*100),success:ok?1:0});
 const msg=$('#dMsg');
 if(ok){blip(1200,0.12,'sine',0.18);
  if(msg)msg.innerHTML='<b style="color:var(--cash)">MEGVAN! '+D.ask+'% jutalék.</b>';
  setTimeout(function(){closeDeal(true);},700);
 }else{blip(140,0.14,'square',0.13);
  if(msg)msg.innerHTML='<b style="color:var(--hot)">Nem ment.</b>';
  setTimeout(function(){
    if(!D)return;
    if(D.round<3)dealOffer();                       // fizetős újrapróbálkozás vagy alap
    else{Analytics.track('contract_failed',{artist:D.a.id,asked:D.ask,fallback:dealBase(D.a)});
      D.ask=dealBase(D.a);closeDeal(false);}
  },800);
 }
}
/* Sikertelen próba után: a játékos VÁLASZT — fizet a következőért, vagy elfogadja az alapot.
   A 2. próba egy reklámvideó, a 3. arany lemez (kredit). */
function dealOffer(){
 if(!D)return;
 const a=D.a,base=dealBase(a),nxt=D.round+1,byAd=(nxt===2);
 if(byAd&&!D.adLogged){D.adLogged=1;Analytics.track('rewarded_ad_offered',{placement:'contract_retry'});}
 const cost=byAd?'egy reklámvideó':(COST_DEAL+' arany lemez');
 const h='<div class="ev"><div class="bd">'+
  '<h3>'+D.round+'. próba nem sikerült</h3>'+
  '<p>Újra <b>'+D.ask+'%</b>-kal — vagy lezárod az alapon.</p>'+
  '<div class="evch" style="margin-top:14px">'+
   '<button class="evb '+(byAd?'good':'pay')+'" data-retry="1"><div class="l">'+
     (byAd?icon('bolt','15px')+' Még egy esély · '+nxt+'. próba'
          :icon('vinyl','15px')+' '+COST_DEAL+' arany lemez · '+nxt+'. próba')+'</div>'+
     '<div class="s">'+(byAd?'':'Egyenleged: '+credits())+'</div></button>'+
   '<button class="evb" data-base="1"><div class="l">Elfogadom az alapot · '+base+'%</div></button>'+
  '</div></div></div>';
 const m=$('#modal');m.innerHTML=h;m.className='on';
 m.querySelector('[data-base]').onclick=function(){D.ask=base;closeDeal(false);};
 m.querySelector('[data-retry]').onclick=function(){
  if(byAd){ Ads.show(function(){ Analytics.track('rewarded_ad_watched',{placement:'contract_retry'}); if(D)dealRound(); }, function(){ toast('A videó megszakadt.'); if(D)dealOffer(); }); }
  else{
   if(!spendCredits(COST_DEAL)){openShop('A 3. alku-próba '+COST_DEAL+' arany lemez. Az alap '+base+'%-ot bármikor elfogadhatod ingyen!');
     /* a bolt felülírja a modált — a bezárása után visszahozzuk az ajánlatot, hogy ne vesszen el az alku */
     const back=setInterval(function(){if($('#modal').className!=='on'){clearInterval(back);if(D)dealOffer();}},400);return;}
   dealRound();
  }};
}

}

/* ============================ BERUHÁZÁSOK (€ sinkek) ============================
   A pénz célja: earn -> reinvest -> earn more. Minden itt EURÓBÓL megy, nem kreditből. */
const FAC=[

  eff:function(l){return '−'+(l*6)+'% fix helyszínköltség';}},
 {id:'office',n:'Nagyobb iroda',ic:'house',max:3,cost:[0,150000,400000,900000],
  d:'Több előadót tudsz egyszerre kezelni.',
  eff:function(l){return (3+l*2)+' előadó fér be';}},
 {id:'bus',n:'Turnébusz és magángép',ic:'plane',max:3,cost:[0,200000,500000,1100000],
  d:'Saját járművek: olcsóbb és gyorsabb utazás az állomások között.',
  eff:function(l){return '−'+(l*12)+'% utazási költség · −'+(l*8)+'% úthossz';}},
];
const STAFF=[
 {id:'road',n:'Road crew',ic:'people',cost:180000,
  d:'Tapasztalt technikusok: ritkább és olcsóbb technikai malőr.',eff:'−50% technikai esemény · −25% annak költsége'},
 {id:'pr',n:'PR-csapat',ic:'megaphone',cost:220000,
  d:'Profi sajtókezelés: jobban üt a promóció, a botrány kevésbé fáj.',eff:'+10% promóció-hatás · fele hírnév-veszteség'},
 {id:'prod',n:'Producer',ic:'headphones',cost:260000,
  d:'Stúdiós kéz a kiadásokon: nagyobb streaming- és rajongó-lökés.',eff:'+25% kiadás-hatás'},
 {id:'mgr',n:'Menedzser',ic:'crown',cost:320000,
  d:'Kemény tárgyaló és feszes működés.',eff:'+8 pont alku-esély · −10% fejenkénti költség'},
];
function facLv(id){return (S.fac&&S.fac[id])||0;}
/* ---------- HETI FENNTARTÁS ----------
   A nagy ügynökség üzemeltetése folyamatosan visz pénzt: stáb-bér, létesítmény-fenntartás,
   előadói retainer (a MÁSODIK névtől) és a saját helyszínek üzemeltetése. Így a kassza
   nem áll meg egy halomban: minél nagyobb a gépezet, annál többe kerül fenntartani. */
function facSpent(){let t=0;FAC.forEach(function(f){for(let l=1;l<=facLv(f.id);l++)t+=f.cost[l];});return t;}
function staffSpent(){let t=0;STAFF.forEach(function(x){if(hasStaff(x.id))t+=x.cost;});return t;}
function upkeepParts(){
 const wage=Math.round(staffSpent()*0.022);
 const fac=Math.round(facSpent()*0.007);
 let ret=0;(S.roster||[]).slice(1).forEach(function(id){if(AM[id])ret+=Math.round(af(AM[id])*90);});
 const ven=Math.round(venSpent()*0.0025);
 return {wage:wage,fac:fac,ret:ret,ven:ven,total:wage+fac+ret+ven};
}
function upkeepWeekly(){return upkeepParts().total;}
function hasStaff(id){return !!(S.staff&&S.staff[id]);}

/* ---- előadó-fejlesztés ---- */
function artUp(id){if(!S.artUp)S.artUp={};if(!S.artUp[id])S.artUp[id]={q:0,f:0};return S.artUp[id];}
function songQ(a,s){return clamp(s.q+artUp(a.id).q,0,100);}
/* Az előadó-fejlesztés nem fogy el: a költség lépésenként MÉRTANI sorral nő,
   így késői vagyonnál is valódi nyelő marad. */
function trainCost(a){return Math.round((30000+af(a)*1400)*Math.pow(1.32,artUp(a.id).q/2)/1000)*1000;}
function imageCost(a){return Math.round((45000+af(a)*2200)*Math.pow(1.30,artUp(a.id).f/3)/1000)*1000;}

function buyFac(id){
 const f=FAC.find(function(x){return x.id===id;});const l=facLv(id);
 if(l>=f.max){toast('Már maximumon van.');return;}
 const c=f.cost[l+1];
 if(S.money<c){toast('Nincs elég pénz — '+money(c)+' kell.');return;}
 S.money-=c;S.fac=S.fac||{};S.fac[id]=l+1;
 pushFeed(f.n+' · '+(l+1)+'. szint',f.eff(l+1),f.ic,'var(--cash)');
 save();toast(f.n+' fejlesztve!');render();
}
function hireStaff(id){
 const st=STAFF.find(function(x){return x.id===id;});
 if(hasStaff(id)){toast('Már nálad dolgozik.');return;}
 if(S.money<st.cost){toast('Nincs elég pénz — '+money(st.cost)+' kell.');return;}
 S.money-=st.cost;S.staff=S.staff||{};S.staff[id]=1;
 pushFeed(st.n+' felvéve',st.eff,st.ic,'var(--cash)');
 save();toast(st.n+' csatlakozott!');render();
}
function trainArtist(id,kind){
 const a=AM[id],u=artUp(id);
 if(kind==='q'){
  if(u.q>=40){toast('A képzés a maximumon van.');return;}
  const c=trainCost(a);if(S.money<c){toast('Nincs elég pénz — '+money(c)+' kell.');return;}
  S.money-=c;u.q+=2;pushFeed(a.n+': képzés','Minden dal minősége +2 (összesen +'+u.q+')',a.ic,'var(--neon)');
 }else{
  if(u.f>=45){toast('Az imázs a maximumon van.');return;}
  const c=imageCost(a);if(S.money<c){toast('Nincs elég pénz — '+money(c)+' kell.');return;}
  S.money-=c;u.f+=3;const A=artState(id);A.fameAdd=Math.min(60,A.fameAdd+3);
  pushFeed(a.n+': imázs-kampány','+3 hírnév (összesen +'+u.f+')',a.ic,'var(--neon)');
 }
 save();render();
}
/* ---------- SAJÁT HELYSZÍNEK (végtelenül skálázódó nyelő) ----------
   Ott vehetsz termet, ahol már játszottál. A saját termedben nem fizetsz bérletet
   (−70% fix helyszínköltség), és hetente bérleti bevételt hoz — de fenntartása is van.
   26 város × 4 méret = rengeteg cél, a stadion-szintű árak a késői játékot is lekötik. */
function venPrice(cityId,venueId){
 const c=CM[cityId],v=VM[venueId];if(!c||!v)return 0;
 return Math.round(v.cap*900*(0.55+c.reach/100*0.75)/10000)*10000;
}
function venOwned(cityId){return (S.venues&&S.venues[cityId])||null;}
function venSpent(){let t=0;Object.keys(S.venues||{}).forEach(function(c){t+=venPrice(c,S.venues[c]);});return t;}
function venIncomeWeekly(){let t=0;Object.keys(S.venues||{}).forEach(function(c){t+=venPrice(c,S.venues[c])*0.0030;});return Math.round(t);}
function venOwnedHere(cityId,venueId){const o=venOwned(cityId);return o&&o===venueId;}
function buyVenue(cityId,venueId){
 const price=venPrice(cityId,venueId);
 const cur=venOwned(cityId);
 if(cur===venueId){toast('Ez a terem már a tiéd.');return;}
 if(S.money<price){toast('Nincs elég pénz — '+money(price)+' kell.');return;}
 S.money-=price;S.venues=S.venues||{};S.venues[cityId]=venueId;
 pushFeed('Saját helyszín: '+CM[cityId].n,VM[venueId].n+' · '+money(price)+' · bérleti bevétel hetente',
   'house','var(--cash)');
 Analytics.track('venue_bought',{city:cityId,venue:venueId,price:price});
 save();toast(CM[cityId].n+': a '+VM[venueId].n.toLowerCase()+' a tiéd!');render();
}

function startTour(id){if(S.live){toast('Előbb fejezd be a folyamatban lévő turnét.');S.tab='terkep';save();render();return;}
 const a=AM[id];
 /* ÜRESEN indul: a szet összerakása és sorrendje a játékos döntése */
 S.tour={artist:id,stops:[],setlist:[],promo:0,risk:false};S.detail=null;S.tab='terkep';save();render();}
/* kezdo szet: a legjobb dalokbol, de mar az idealis ivhez rendezve - innen lehet tovabb csiszolni */
function autoSetlist(a,n){n=Math.min(n||6,a.songs.length);
 const pool=a.songs.map((s,i)=>i),out=new Array(n),tgt=p=>arcTarget(n>1?p/(n-1):0.5);
 /* a legmagasabb célú helyeket (csúcs, ráadás) töltjük fel először, hogy oda jusson a nagyágyú */
 const order=[];for(let p=0;p<n;p++)order.push(p);
 order.sort((x,y)=>tgt(y)-tgt(x));
 order.forEach(p=>{const want=tgt(p);let best=0,bs=-1e9;
  pool.forEach((si,k)=>{const s2=a.songs[si],v=s2.q*0.55-Math.abs(s2.e-want)*0.9;if(v>bs){bs=v;best=k;}});
  out[p]=pool.splice(best,1)[0];});
 return out;}
/* ---------- helyszín-feloldás ---------- */
function venueOpen(v){return S.rep>=(v.minRep||0);}
function bestOpenVenue(){for(let i=VENUES.length-1;i>=0;i--)if(venueOpen(VENUES[i]))return VENUES[i];return VENUES[0];}
function nextLockedVenue(){return VENUES.find(v=>!venueOpen(v))||null;}
/* az előadóhoz illő méret, de sosem nagyobb, mint amit a hírneved már feloldott */
function defVenue(a){const f=af(a);let want=f>=80?VM.arena:f>=50?VM.theatre:VM.club;
 for(let i=VENUES.indexOf(want);i>=0;i--)if(venueOpen(VENUES[i]))return VENUES[i];
 return VM.club;}

/* ---- mobilbarát húzd-és-ejtsd (pointer események, 46px fogantyú) ---- */
function initDrag(){
 const wrap=$('#slwrap');if(!wrap)return;
 wrap.querySelectorAll('[data-drag]').forEach(h=>{
  h.onpointerdown=ev=>{
   ev.preventDefault();
   const rows=[].slice.call(wrap.querySelectorAll('.slrow'));
   const from=+h.dataset.drag, row=rows[from];if(!row)return;
   const rowH=row.offsetHeight+8, startY=ev.clientY;let to=from;
   row.classList.add('drag');
   try{h.setPointerCapture(ev.pointerId);}catch(e){}
   const move=e2=>{
    const dy=e2.clientY-startY;
    to=clamp(from+Math.round(dy/rowH),0,rows.length-1);
    rows.forEach((r,i)=>{
     if(i===from)r.style.transform=`translateY(${dy}px)`;
     else if(to>from&&i>from&&i<=to)r.style.transform=`translateY(${-rowH}px)`;
     else if(to<from&&i<from&&i>=to)r.style.transform=`translateY(${rowH}px)`;
     else r.style.transform='';});
   };
   const up=()=>{
    h.onpointermove=null;h.onpointerup=null;h.onpointercancel=null;
    rows.forEach(r=>{r.style.transform='';r.classList.remove('drag');});
    if(to!==from){const arr=S.tour.setlist;arr.splice(to,0,arr.splice(from,1)[0]);}
    afterSetlistChange();
   };
   h.onpointermove=move;h.onpointerup=up;h.onpointercancel=function(ev){to=from;up(ev);};   // megszakadt húzás: marad az eredeti sorrend
  };
 });
}

/* ---- állomás „beállítva" jelölés + haladás ---- */
function markStopOk(i,goNext){
 const st=S.tour.stops[i];if(!st)return;
 const was=!!st.ok;st.ok=true;save();
 const card=view.querySelector(`.stop[data-i="${i}"]`);
 if(card){card.classList.remove('todo');
  const bd=$('#pbd'+i);if(bd){bd.className='stbadge done';bd.innerHTML=icon('star','10px')+' Beállítva';}
  const ok=$('#pok'+i);if(ok){ok.className='btn dark sm';ok.innerHTML=icon('star','15px')+' Beállítva';}}
 updateStopProgress();updateSticky();
 if(goNext&&!was&&todoCount()>0)gotoNextTodo();   // csak az ELSŐ beállításkor lépünk tovább
}
function todoCount(){return S.tour?S.tour.stops.filter(s=>!s.ok).length:0;}
function updateStopProgress(){const el=$('#stopProg');if(!el||!S.tour)return;
 const n=S.tour.stops.length,d=n-todoCount();
 el.innerHTML=`<span>${d}/${n} beállítva</span><span class="pb"><i style="width:${n?d/n*100:0}%"></i></span>`;
 el.className='r progpill '+(d===n&&n?'act':'');}
/* a következő beállítatlan állomásra görget */
function gotoNextTodo(){
 const el=view.querySelector('.stop.todo');
 const top=el?Math.max(0,el.offsetTop-70):view.scrollHeight;
 /* rejtett/animációt nem futtató oldalon a smooth nem mozdul → azonnali görgetés */
 try{view.scrollTo({top,behavior:document.hidden?'auto':'smooth'});}catch(e){view.scrollTop=top;}
}
/* vizuális sáv: meddig terjedhet a tényleges nézőszám a férőhelyhez képest */
function rngHTML(b,exp,cap){const l=clamp(b.lo/cap*100,0,100),w=clamp((b.hi-b.lo)/cap*100,1,100),m=clamp(exp/cap*100,0,100);
 return `<i style="left:${l}%;width:${w}%"></i><u style="left:${m}%"></u>`;}
function updateSticky(){const stops=S.tour.stops,cost=promoCost(stops,S.tour.promo||0);
 const todo=todoCount();
 const days=stops.reduce((s,st,i)=>s+1+(i>0?travelDays(haversine(CM[stops[i-1].city],CM[st.city])):1),0);
 const realMin=stops.length?Math.round(tourRealMs(stops)/60000):0;

 /* A fő teendő a beállítás — az indítás csak akkor lesz elsődleges gomb, ha minden állomás kész.
    Így nem lehet véletlenül félig beállítva, alap jegyárral turnét indítani. */
 let main;
 if(S.tour.setlist.length<minSet(AM[S.tour.artist])) main=`<button class="btn lime" id="goSet">${icon('notes','17px')} Válassz dalokat · még ${minSet(AM[S.tour.artist])-S.tour.setlist.length}</button>`;
 else if(stops.length<1) main=`<button class="btn lime" id="goCity">${icon('globe','17px')} Válassz várost a térképen</button>`;
 else if(todo>0) main=`<button class="btn lime" id="goTodo">${icon('alert','17px')} Állomások beállítása · ${todo} maradt →</button>`;
 else main=`<button class="btn lime" id="sim">${icon('mic','18px')} Turné indítása · ${stops.length} állomás${cost?' · promó '+money(cost):''}</button>`;

 stickyHost.innerHTML=`<div class="sticky"><div class="in" id="stickyTop">
   ${stops.length?`<div style="text-align:center;font-size:11.5px;font-weight:700;margin-bottom:8px;color:${todo>0?'var(--gold)':'var(--faint)'}">
     ${todo>0?`${icon('alert','12px')} Még ${todo} állomásnál nem állítottad be a jegyárat`
              :`${icon('clock','12px')} ${days} nap · nálad kb. ${realMin} perc${stops.length>1?` · <b style="color:var(--cash)">−${Math.round((1-tourScale(stops.length))*100)}%</b> fix költség a turné méretéért`:''}`}</div>`:''}
   ${main}
   <button class="btn dark sm" id="cancel" style="margin-top:8px">Mégse, vissza</button></div></div>`;
 /* A sticky gomb magassága változó (hint + 2 gomb). Enélkül a lap alja — épp a
    promóció-választó — a gomb alá csúszik, és webnézetben nem lehet elérni. */
 const sb=stickyHost.querySelector('.sticky');
 view.style.paddingBottom=((sb?sb.offsetHeight:0)+($('#obbar').offsetHeight||0)+96)+'px';
 const sim=$('#sim');if(sim)sim.onclick=launchTour;
 const gt=$('#goTodo');if(gt)gt.onclick=()=>{if(plStep()!==2)plGo(2);else gotoNextTodo();};
 const gc=$('#goCity');if(gc)gc.onclick=()=>plGo(1);
 const gs=$('#goSet');if(gs)gs.onclick=()=>plGo(0);
 $('#cancel').onclick=()=>{S.tour=null;teardownMap();obRewindTo('pick');save();render();};}

function fanBars(A,gains){
 let h='';Object.keys(REGIONS).forEach(r=>{const f=A.fans[r],g=gains&&gains[r];
  h+=`<div class="fanrow"><span class="n">${rgN(r)}</span>
    <span class="b"><i style="width:${clamp(f,0,100)}%;background:${fanCol(f)}"></i></span>
    <span class="v" style="color:${fanCol(f)}">${Math.round(f)}</span>
    <span class="d" style="color:${g>0?'var(--cash)':'transparent'}">${g>0?'+'+dec1(g):''}</span></div>`;});
 return h;
}

/* natív indítókép elrejtése, amint a webnézet fut — a saját #splash úgyis takar,
   így nincs villanás. A config launchAutoHide-ja a biztosíték, ez a gyors, tiszta átadás. */
try{if(isNative()){var _SP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SplashScreen;if(_SP&&_SP.hide)_SP.hide();}}catch(e){}
/* csak EGYSZER jelezzük a bemutató indulását — újratöltésenként ne duplikálódjon */
/* ---------- BETÖLTŐ: 0 → 100%, csak utána a kezdőképernyő/játék ----------
   Időzítővel és NEM requestAnimationFrame-mel megy: háttérbe tett fülnél a rAF
   áll, és a betöltő örökre a képernyőn ragadna. Egy háló-időzítő minden esetben
   lezárja 100%-on. */
(function(){
 const el=$('#splash'),fill=$('#spFill'),pctEl=$('#spPct');
 if(!el)return;
 const assets=['assets/logo-empire-v2.webp','assets/bg-start.webp'];
 let done=0;const total=assets.length+1;                 /* +1: betűkészletek */
 assets.forEach(function(u){const i=new Image();i.onload=i.onerror=function(){done++;};i.src=u;});
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){done++;});else done++;
 const t0=Date.now(),MIN=1300,MAX=4500;                  /* alsó / felső időkorlát */
 let shown=0,fin=false,iv=null;
 const finish=function(){
  if(fin)return;fin=true;
  if(iv){clearInterval(iv);iv=null;}
  fill.style.width='100%';pctEl.textContent='100';
  setTimeout(function(){el.className='off';
    setTimeout(function(){el.className='off gone';},480);},260);
 };
 const step=function(){
  const ms=Date.now()-t0;
  let target=Math.min(done/total,ms/MIN)*100;
  if(ms>MAX)target=100;
  shown+=Math.max(0.8,(target-shown)*0.20);
  if(shown>target)shown=target;
  if(shown>100)shown=100;
  fill.style.width=shown.toFixed(1)+'%';
  pctEl.textContent=Math.round(shown);
  if(shown>=99.9)finish();
 };
 iv=setInterval(step,45);step();
 setTimeout(finish,MAX+700);                             /* biztosíték: sosem ragad be */
})();
if(!S.started){renderStart();}
else if(!S.obDone&&S.ob===0&&!S.obStarted){S.obStarted=1;save();Analytics.track('tutorial_started',{source:'first_open'});}
