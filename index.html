 const beAtt=contrib>0?Math.ceil(fix/contrib):Infinity;
 const comm=commRate(a), tprofit=rev+merch-base;
 return{att,raw,fill,rev,base,fp,fans,merch,fix,varRate,beAtt,beFill:beAtt/v.cap,fresh,taste,avgE,comm,tprofit};
}
/* mennyire illik a helyszín mérete a várható kereslethez — a venue-választás így valódi döntés */
function venueFit(fill){
 return fill>=0.98?{t:'Telt ház várható',c:'var(--cash)'}
      :fill>=0.75?{t:'Jó választás',c:'var(--cash)'}
      :fill>=0.45?{t:'Lesznek üres helyek',c:'var(--gold)'}
      :fill>=0.25?{t:'Nagyrészt üres lesz',c:'var(--hot)'}
      :{t:'Túl nagy hely ide',c:'var(--hot)'};
}

/* ---------- BIZONYTALANSÁG ----------
   A becslés csak VÁRHATÓ érték. A tényleges nézőszám szór körülötte:
   kevésbé ismert előadó + gyenge promóció = nagyobb szórás (lehet több, de kevesebb is). */
function sigmaFor(a,promo){
 let s=0.30;                                   // alap szórás
 s*=1-clamp(af(a)/100,0,1)*0.40;               // ismert előadó = kiszámíthatóbb
 s*=PROMO[promo||0].sig;                       // turné-promóció
 s*=1-S.upg.marketing*0.05;                    // iroda marketing-fejlesztés
 return clamp(s,0.06,0.42);
}
/* átlag 1, szórás = sigma (3 egyenletes összege ~ normális) */
function rollFactor(sigma){const u=(Math.random()+Math.random()+Math.random())/3;return Math.max(0.05,1+(u-0.5)*(sigma/0.16667));}
/* ~80%-os sáv a nyers kereslet körül, a végén a férőhelyre vágva */
function band(raw,sigma,cap){return{lo:clamp(Math.round(raw*(1-1.28*sigma)),0,cap),hi:clamp(Math.round(raw*(1+1.28*sigma)),0,cap)};}

/* ================= SETLIST: ENERGIA-ÍV ÉS KÖZÖNSÉG-SZIMULÁCIÓ =================
   Nem a legnagyobb pontszámú dalok halmaza a jó szet, hanem a jól felépített ív:
   erős nyitás → építkezés → lélegzetvételnyi lassú → csúcs → ráadás.
   Csupa nagy energiájú szám egymás után kifárasztja a közönséget (állóképesség). */
const MIN_SET=5;                                  // ennyi dal kell egy indítható szethez
/* A kezdő előadóknak rövidebb a katalógusuk — náluk a teljes repertoár a minimum. */
function minSet(a){return Math.min(MIN_SET,(a&&a.songs)?a.songs.length:MIN_SET);}
const ARC=[70,80,60,74,90,97,88];                 // ideális energia-görbe kulcspontjai (0→1)
function arcTarget(t){const x=clamp(t,0,1)*(ARC.length-1),i=Math.floor(x),f=x-i;
 return ARC[i]+((ARC[Math.min(i+1,ARC.length-1)]-ARC[i])*f);}
/* a város közönségének ízlése: mennyire szereti a nagy energiájú szettet */
function tasteMul(city,avgE){if(!city||city.eLike===undefined)return 1;
 return clamp(1-Math.abs(avgE-city.eLike)/260,0.82,1.06);}

function crowdSim(a,list){
 const songs=(list||[]).map(i=>a.songs[i]).filter(Boolean);
 if(!songs.length)return{pts:[],score:0,avgE:60,notes:['Válassz legalább egy dalt.'],fatigue:0};
 let crowd=48,stam=100,fatigue=0,run=0;const pts=[],notes=[];
 songs.forEach((s,i)=>{
  const t=songs.length>1?i/(songs.length-1):0.5, want=arcTarget(t);
  const fit=1-Math.min(1,Math.abs(s.e-want)/40);          // mennyire illik az ívbe (meredek)
  run=s.e>=78?run+1:0;
  if(run>=3){fatigue++;}                                   // 3+ nagy szám egymás után fáraszt
  const drain=s.e>=78?15:(s.e<=52?-20:-3);                 // pörgős fáraszt, lassú pihentet
  stam=clamp(stam-drain,0,100);
  let gain=(songQ(a,s)/100*0.35+fit*1.0)*26-17;   // az ívhez illés dominál a puszta minőség felett
  gain*=(0.45+stam/100*0.75);                              // fáradt közönség kevésbé reagál
  if(run>=3)gain-=8;
  if(i===songs.length-1&&songs.length>2)gain*=1.8;   // a ráadás nagyobbat üt — jóban-rosszban
  crowd=clamp(crowd+gain,0,100);
  pts.push({crowd:Math.round(crowd),stam:Math.round(stam),e:s.e,q:s.q,n:s.n});
 });
 const avg=pts.reduce((x,p)=>x+p.crowd,0)/pts.length;
 const fin=pts[pts.length-1].crowd, peak=Math.max.apply(null,pts.map(p=>p.crowd));
 const avgE=songs.reduce((x,s)=>x+s.e,0)/songs.length;
 const score=clamp(Math.round(avg*0.50+fin*0.30+peak*0.20),0,100);
 if(fatigue)notes.push(`${fatigue} helyen 3+ nagy szám torlódik — a közönség kifárad.`);
 if(songs.length>=3&&pts[pts.length-1].crowd<peak-10)notes.push('Gyengén zárul — a végére erős, nagy energiájú szám kell.');
 if(songs.length>=4&&!songs.some(s=>s.e<=55))notes.push('Nincs lassú szám: egy lélegzetvétel feljebb vinné a csúcsot.');
 const need=minSet(a);
 if(songs.length<need)notes.push(`Még ${need-songs.length} dal kell — a teljes ívhez legalább ${need} szám.`);
 return{pts,score,avgE,notes,fatigue};
}
function showGrade(s){return s>=86?{g:'A+',c:'var(--cash)'}:s>=76?{g:'A',c:'var(--cash)'}:
 s>=64?{g:'B',c:'var(--neon)'}:s>=50?{g:'C',c:'var(--gold)'}:{g:'D',c:'var(--hot)'};}
/* estimate() ezt kapja setQ helyett: a show-pontszám (0–100), városfüggetlenül */
function setlistQ(a,list){return crowdSim(a,list||(S.tour&&S.tour.setlist)||[]).score;}
function setlistAvgE(a,list){return crowdSim(a,list||(S.tour&&S.tour.setlist)||[]).avgE;}

/* ---------- VÁROS-KIFÁRADÁS ----------
   Ha nemrég játszottál ott, a közönség „elhasználódott"; hetek alatt épül vissza.
   Ettől nem éri meg ugyanazt a bombaerős várost újra és újra lenyomni. */
const FRESH_WEEKS=20, FRESH_FLOOR=0.35;
function freshness(A,cityId){
 const last=A&&A.played?A.played[cityId]:undefined;
 if(last===undefined)return 1;
 const gap=Math.max(0,S.week-last);
 return clamp(FRESH_FLOOR+(1-FRESH_FLOOR)*(gap/FRESH_WEEKS),FRESH_FLOOR,1);
}
/* ---------- TURNÉ-MÉRET ----------
   A hosszabb turné megosztja az overheadet: állomásonként olcsóbb a fix költség. */
function tourScale(n){return clamp(1-(Math.max(1,n)-1)*0.045,0.80,1);}
function promoCost(stops,lvl){const seats=stops.reduce((s,x)=>s+VM[x.venue].cap,0);return Math.round(seats*PROMO[lvl||0].seat/1000)*1000;}
function legCost(prev,city,v){return Math.round(haversine(prev,city)*KM_RATE*v.tmul*(1-facLv('bus')*0.12));}
function routeKm(){const s=S.tour.stops;let d=0;for(let i=1;i<s.length;i++)d+=haversine(CM[s[i-1].city],CM[s[i].city]);return Math.round(d);}
/* ============================ AKTIVITÁS-FOLYAM ============================
   Az iroda „hírfolyama": mérföldkövek, turnék, megjelenések. Ettől él a kezdőlap. */
function pushFeed(t,s,ic,col){
 if(!S.feed)S.feed=[];
 S.feed.unshift({t,s,ic:ic||'star',col:col||'var(--neon)',wk:S.week,fresh:1});
 S.feed=S.feed.slice(0,14);
}
/* szint- és helyszín-feloldás figyelése (bárhonnan jöhet a hírnév-változás) */
function checkUnlocks(){
 const lv=level();
 if(S.lastLevel===undefined)S.lastLevel=lv;
 else if(lv>S.lastLevel){pushFeed(`Iroda Lv.${lv} · ${rankName(lv)}`,'Új szint — nagyobb nevek is szóba állnak veled.','trophy','var(--gold)');S.lastLevel=lv;}
 const openN=VENUES.filter(venueOpen).length;
 if(S.lastVenues===undefined)S.lastVenues=openN;
 else if(openN>S.lastVenues){const v=VENUES[openN-1];
  pushFeed(`${v.n} feloldva`,`Mostantól ${k(v.cap)} férőhelyes helyszínt is szervezhetsz.`,v.ic,'var(--neon)');S.lastVenues=openN;}
}

/* ============================ HETI ÜTEM (a flywheel motorja) ============================
   Minden eltelt hét: a streaming a „természetes" szintje felé húz, a hype lecseng,
   a streaming lassan építi a rajongótábort, és csorog egy kis passzív bevétel. */
function advanceWeeks(n){
 n=Math.max(0,Math.round(n));if(!n)return 0;
 S.week+=n;let income=0;
 for(let w=0;w<n;w++){
  S.roster.forEach(id=>{
   const a=AM[id],st=artState(id),tgt=streamTarget(a);
   st.streams=Math.max(0,Math.round(st.streams+(tgt-st.streams)*0.18));
   st.hype=st.hype>0.02?st.hype*0.78:0;
   const m=st.streams/1e6*0.5;                       // 1M havi hallgató ≈ +0,5 alap
   Object.keys(REGIONS).forEach(r=>{                 // ott nő gyorsabban, ahol már van alap
    st.fans[r]=clamp(st.fans[r]+m*(0.4+st.fans[r]/100*0.9),0,100);});
   income+=st.streams*0.0015;                        // 1M havi hallgató ≈ €1 500/hét
  });
 }
 income=Math.round(income);
 if(income>0){S.money+=income;S.streamIncome=(S.streamIncome||0)+income;}
 return income;
}

/* ============================ KIADÁSOK (stúdió) ============================
   Egyszerre egy kiadás készül (a stúdió foglalt). Ugyanaz az ütemezett-időbélyeg
   logika, mint a turnénál, ezért a játék bezárása alatt is elkészül. */
function startRelease(artistId,kindId){
 if(S.rel){toast('A stúdió most foglalt.');return;}
 const a=AM[artistId],k=RM[kindId],cost=relCost(a,k);
 if(S.money<cost){toast('Nincs elég pénz erre a kiadásra.');return;}
 S.money-=cost;
 S.rel={artist:artistId,kind:kindId,cost,ms:msFromMin(k.min),ends:Date.now()+msFromMin(k.min),days:k.days};
 save();render();startTicker();
 toast(`${a.n} · ${k.n} felvétele elkezdődött.`);
}
function finishRelease(){
 const R=S.rel;if(!R)return;
 const a=AM[R.artist],k=RM[R.kind],st=artState(R.artist);
 const relBoost=1+facLv('studio')*0.12+(hasStaff('prod')?0.25:0);
 st.hype+=k.hype*relBoost;
 st.fameAdd=Math.min(60,st.fameAdd+k.fameAdd);
 st.rels=(st.rels||0)+1;
 Object.keys(REGIONS).forEach(r=>{                    // ahol már ismerik, ott üt nagyobbat
  st.fans[r]=clamp(st.fans[r]+k.fansAdd*relBoost*(0.5+st.fans[r]/100),0,100);});
 const before=st.streams;
 st.streams=Math.round(st.streams*(1+k.hype*0.5));
 S.rel=null;
 S.relLog.unshift({artist:a.n,kind:k.n,ic:k.ic,week:S.week,
   gain:st.streams-before,fame:k.fameAdd,fans:k.fansAdd});
 S.relLog=S.relLog.slice(0,8);
 chalAdd('rel2',1);
 pushFeed(`${a.n} · ${k.n} megjelent`,`Streaming ${fmtStream(before)} → ${fmtStream(st.streams)} · +${k.fameAdd} hírnév`,k.ic,'var(--gold)');
 advanceWeeks(Math.max(1,Math.round(k.days/7)));
 save();
 toast(`${a.n} · ${k.n} megjelent! Streaming ${fmtStream(before)} → ${fmtStream(st.streams)}`);
}
function relRemain(){return S.rel?Math.max(0,S.rel.ends-Date.now()):0;}

/* ============================ ÉLŐ TURNÉ (IDŐMOTOR) ============================
   A turné nem azonnali: minden állomás és minden utazás valós időt vesz igénybe.
   A fázisok ütemezett időbélyegre végződnek (L.ends), ezért a játék bezárása/újratöltése
   után is helyesen halad tovább — a kihagyott fázisok betöltéskor bepótlódnak. */
function buildPhases(stops){
 const ph=[];
 for(let i=0;i<stops.length;i++){
  const km=i>0?haversine(CM[stops[i-1].city],CM[stops[i].city]):0;
  const tmin=i>0?travelMin(km):TIME.prepMin, smin=showMin(VM[stops[i].venue]);
  ph.push({k:'travel',i,km:Math.round(km),min:tmin,ms:msFromMin(tmin),days:i>0?travelDays(km):1});
  ph.push({k:'show',i,min:smin,ms:msFromMin(smin),days:1});
 }
 return ph;
}
/* a teljes turné valós hossza (a tervezőben előre kiírjuk) */
function tourRealMs(stops){return buildPhases(stops).reduce((s,p)=>s+p.ms,0);}
function launchTour(){
 const t=S.tour,a=AM[t.artist],cost=promoCost(t.stops,t.promo||0);

 S.live={artist:t.artist,setlist:t.setlist.slice(),promo:t.promo||0,promoSpent:cost,risk:!!t.risk,riskDone:false,
  stops:t.stops.map(s=>({...s})),ph:buildPhases(t.stops),i:0,ends:Date.now()+msFromMin(TIME.prepMin),
  pausedLeft:null,pendingEv:null,mom:1,attMul:1,skipNext:false,days:0,
  rows:[],log:[],evUsed:[],boost:{},fanGain:{},mini:{},miniSkip:{},
  tRev:0,tCost:0,tPay:0,tTrav:0,tAtt:0,tEvent:0,tMerch:0,tArtist:0,tTake:0,pool:0,rep:0};
 S.tour=null;S.tab='terkep';teardownMap();save();render();
}
function curPhase(){return S.live?S.live.ph[S.live.i]:null;}
function remainMs(){const L=S.live;if(!L)return 0;return L.pausedLeft!=null?L.pausedLeft:Math.max(0,L.ends-Date.now());}
function phaseCity(){const L=S.live,p=curPhase();if(!p)return null;return CM[L.stops[p.i].city];}

let TK=null;
function startTicker(){stopTicker();if(S.live||S.rel)TK=setInterval(tick,TIME.tick);}
function stopTicker(){if(TK){clearInterval(TK);TK=null;}}
function tick(){
 if(!S.live&&!S.rel){stopTicker();return;}
 /* stúdió: elkészült-e a kiadás (a turnétól függetlenül, párhuzamosan fut) */
 if(S.rel&&Date.now()>=S.rel.ends){finishRelease();if(S.tab==='studio')tabStudio();renderHUD();}
 else if(S.rel&&S.tab==='studio')paintRel();
 const L=S.live;if(!L){if(!S.rel)stopTicker();return;}
 if(L.pausedLeft!=null||L.pendingEv)return;
 const before=L.i;let guard=0;
 while(S.live&&S.live.pausedLeft==null&&!S.live.pendingEv&&Date.now()>=S.live.ends&&guard++<80)finishPhase();
 if(!S.live)return;                                  // turné véget ért
 if(S.live.pausedLeft!=null||S.live.pendingEv)return; // esemény modál nyílt
 if(S.live.i!==before){save();if(S.tab==='terkep')liveScreen();renderHUD();}
 else paintLive();
}
/* egy fázis lezárása: utazás kifizetése vagy koncert lejátszása */
function finishPhase(){
 const L=S.live,p=L.ph[L.i],a=AM[L.artist];
 if(p.k==='travel'){
  if(p.i>0){const c=legCost(CM[L.stops[p.i-1].city],CM[L.stops[p.i].city],VM[L.stops[p.i].venue]);
   L.pool-=c;L.tTrav+=c;L.tCost+=c;}   // a turné kasszáját terheli, nem közvetlenül az ügynökséget
  if(p.km>5000)advanceWeeks(1);
 }else{ runShow(p.i); advanceWeeks(1); }
 L.days+=p.days;
 L.i++;
 if(L.i>=L.ph.length){endTour();return;}
 L.ends+=L.ph[L.i].ms;
 if(L.ends<Date.now()-3600000)L.ends=Date.now()+L.ph[L.i].ms;  // nagyon régi mentés: ne pörögjön el
 const ev=rollEvent();if(ev)openEvent(ev);
}
/* egy koncert lefutása — itt dől el a TÉNYLEGES nézőszám (szórással) */
function runShow(i){
 const L=S.live,a=AM[L.artist],st=L.stops[i],city=CM[st.city],v=VM[st.venue];
 const dr=(L.mini&&L.mini[i])||null;
 /* a dobos mini-játék a KÉSZ setlist-ív rendszeren át hat: a show-pontszámhoz adódik */
 const setQ=clamp(setlistQ(a,L.setlist)+(dr?dr.pts:0),0,100);
 const A=artState(a.id),reg=city.r,fansBefore=A.fans[reg];
 const e=estimate(a,city,v,st.price,setQ,L.mom,L.promo), sig=sigmaFor(a,L.promo);
 let att,fill,rev,cost,profit,repD,merch=0,fanG=0,cancelled=false;
 const comm=commRate(a), promoShare=Math.round((L.promoSpent||0)/Math.max(1,L.stops.length));
 if(L.skipNext){                       // elmaradt koncert: bérleti díj bukó, nincs bevétel
  cancelled=true;L.skipNext=false;att=0;fill=0;rev=0;cost=e.fix;profit=-cost;repD=-Math.round(v.rep/2);
 }else{
  /* kiadatlan szám bemutatása — az első koncerten dől el */
  let riskMul=1;
  if(L.risk&&!L.riskDone){L.riskDone=true;
   if(Math.random()<0.55){riskMul=1.15;A.hype+=0.35;S.rep+=6;L.rep+=6;
    L.log.push({t:'Berobbant a kiadatlan szám',s:'A közönség őrjöng, a felvétel terjed a neten · +6 hírnév, streaming-lökés',ic:'star'});
    pushFeed(`${a.n}: berobbant az új szám`,`${city.n} · a bemutató után ugrott a streaming`,'star','var(--cash)');}
   else{riskMul=0.94;S.rep=Math.max(0,S.rep-4);L.rep-=4;
    L.log.push({t:'Langyos fogadtatás',s:'A kiadatlan szám nem fogott — a közönség kivárt · −4 hírnév',ic:'alert'});}
  }
  const f=rollFactor(sig)*L.attMul*riskMul;
  att=clamp(Math.round(e.raw*f),0,v.cap);fill=att/v.cap;rev=att*st.price;
  cost=e.fix+Math.round(att*e.varRate);   // a fejenkénti rész a TÉNYLEGES nézőszámmal számol
  merch=merchRev(att,fansBefore);      // merch: nézőszám × rajongói szint × pult-fejlesztés
  profit=rev+merch-cost;
  repD=Math.round((fill-0.5)*v.rep);
  if(fill>=0.98)repD+=Math.round(v.rep*0.5);        // telt ház: extra hírnév
  else if(fill<0.25)repD-=Math.round(v.rep*0.6);    // kongó terem: rossz sajtó
  /* a fellépés építi az ottani rajongótábort — nagyobb hely, teltebb ház = többet */
  fanG=(0.5+fill)*(VFAN[v.id]||1)*(1+S.upg.marketing*0.05)*(fill>=0.98?1.25:1);
  A.fans[reg]=clamp(A.fans[reg]+fanG,0,100);
  L.fanGain[reg]=(L.fanGain[reg]||0)+fanG;
  L.mom=fill>=0.9?Math.min(1.4,L.mom+0.06):(fill<0.45?Math.max(0.75,L.mom-0.05):L.mom);
  A.played[st.city]=S.week;            // a varos kozonsege elhasznalodott, hetek alatt epul vissza
  bumpRec('maxFill',fill);bumpRec('bestNight',profit);bumpRec('bestAtt',att);
  if(v.cap>=20000){bumpRec('arenaFill',fill);if(fill>=0.9&&!(S.recs&&S.recs.firstArenaWeek))(S.recs=S.recs||{}).firstArenaWeek=S.week;}
  if(fill>=0.98&&v.id==='club'&&city.r==='SA')chalAdd('sa3',1);
 }
 L.attMul=1;                            // az eseményhatás egy koncertre szól
 /* A turné nyereségéből az ügynökség a JUTALÉKÁT viszi, a többi az előadóé. */
 const tp=profit-promoShare+(L.pool||0); L.pool=0;
 const take=Math.round(tp*comm), artistGets=tp-take;
 S.money+=take;                        // azonnal a kasszába (a HUD élőben követi)
 if(take>0)S.earned=(S.earned||0)+take;   // életmű-bevétel: az Örökség-pont egyik alapja
 L.tArtist+=Math.max(0,artistGets);L.tTake+=take;
 if(repD>0)repD=Math.round(repD*repMul());          // örökség-perk + NG+ rang gyorsítja
 S.rep=Math.max(0,S.rep+repD);L.rep+=repD;
 L.tRev+=rev;L.tCost+=cost;L.tAtt+=att;L.tMerch+=merch;
 L.rows.push({city:city.n,region:reg,photo:cityPhoto(city,600,300),venue:v.n,att,exp:e.att,cap:v.cap,fill,
   price:st.price,profit:take,merch,fans:Math.round(fansBefore),fanG:+fanG.toFixed(1),cancelled,
   drum:dr?{acc:dr.acc,pts:dr.pts}:null});
 if(!cancelled&&S.tab==='terkep')toast(`${city.n}: ${k(att)} néző · jutalék ${money(take)} (merch ${money(merch)})`);
}
function endTour(){
 const L=S.live,a=AM[L.artist],A=artState(a.id);
 if(L.pool){const t2=Math.round(L.pool*commRate(a));S.money+=t2;L.tTake+=t2;L.tArtist+=Math.max(0,L.pool-t2);L.pool=0;}
 const net=L.tTake;                                // az ügynökség tényleges bevétele: a jutalék
 S.toursDone++;
 /* Az elhanyagolt régiók lassan kopnak — ezért érdemes visszatérni oda, ahol felépítettél valamit.
    Csak a már jól ismert régiókat érinti, hogy a kezdés ne legyen büntető. */

 const L=S.live,p=L.ph[L.i];if(!p)return null;
 const slot=p.k==='show'?'pre':(L.i<=1?null:'road');   // koncert előtt / úton
 const slots=slot?[slot]:[];
 if(p.k==='travel'&&L.i>1)slots.push('post');          // az előző koncert utóélete
 if(!slots.length)return null;
 if(Math.random()>EV_CHANCE)return null;
 let pool=EVENTS.filter(e=>e.when.some(w=>slots.includes(w))&&L.evUsed.indexOf(e.id)<0);
 if(hasStaff('road'))pool=pool.filter(e=>['sound','gear','bus','visa'].indexOf(e.id)<0||Math.random()<0.5);
 if(!pool.length)return null;
 let tot=pool.reduce((s,e)=>s+e.w,0),r=Math.random()*tot;
 for(const e of pool){r-=e.w;if(r<=0)return e;}
 return pool[0];
}

/* ============================ RITMUS MINI-JÁTÉK (dobos) ============================
   FILOZÓFIA: opcionális felső ráadás, nem kényszer. Aki nem játszik, annál a show
   tisztességes ALAPSZINTEN fut le — a mini-játék csak bónuszt ad (max +14 pont a
   show-értékeléshez), a gyenge játék pedig csak enyhén (max −8) húz le.
   A pontszám a KÉSZ setlist-ív rendszeren keresztül hat: a show-pontszámhoz adódik,
   onnan megy tovább a nézőszámba, merchbe és a rajongótáborba. */
/* A hit-zónák a háttérfotón látható VALÓDI hangszerekre esnek (x/y/w/h = a képdoboz %-a) */
const KIT=[
 {n:'Hi-hat', c:'#FFC24B', x:13, y:50, w:26, h:12, snd:'hihat'},
 {n:'Tom 1',  c:'#C6FF3A', x:34, y:46, w:24, h:14, snd:'tomHi'},
 {n:'Tom 2',  c:'#2FE39B', x:70, y:46, w:24, h:14, snd:'tomLo'},
 {n:'Crash',  c:'#FF3D84', x:86, y:33, w:26, h:12, snd:'crash'},
 {n:'Lábdob', c:'#7CC7FF', x:48, y:69, w:44, h:20, snd:'kick'},
];
/* KÖNNYÍTETT ritmus: lassabb tempó, ritkább minta, jóval nagyvonalúbb időablakok */
/* VILÁGÍTÓ ABLAK modell: a dob kigyullad és világít egy ideig — amíg világít, üss rá.
   Nincs pillanat-találgatás; a világító állapot maga a jelzés. */
const RG={win:900,winHard:560,perfectFrac:0.225,bars:26000,bpm:100};   // hosszabb menet, ütemre eső nóták
let M=null;

/* apró WebAudio visszajelzés — a találat legyen kielégítő */
let AC=null;
function blip(freq,dur,type,vol){
 if(S.sound===false)return;
 try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.16,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(dur||0.09));
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(dur||0.09)+0.02);
 }catch(e){}
}
/* ---------- DOBHANGOK ----------
   WebAudio-szintézis: nincs letöltendő sample, nulla latencia és licenc-kérdés.
   Minden hangszer a SAJÁT hangját kapja (kick / tom hi / tom lo / hi-hat / crash). */
let NOISE=null;
function noiseBuf(){
 if(NOISE)return NOISE;
 const n=Math.floor(AC.sampleRate*1.4),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 NOISE=b;return b;
}
function drumHit(kind){
 if(S.sound===false)return;   // a saját ütés MGAIN nélkül szól, a háttérzene fölé
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime, out=AC.destination;
  const env=(g,peak,dur,curve)=>{g.gain.setValueAtTime(peak,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);};
  if(kind==='kick'){
   const o=AC.createOscillator(),g=AC.createGain();
   o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(44,t+0.13);
   env(g,0.9,0.42);o.connect(g);g.connect(out);o.start(t);o.stop(t+0.45);
   const c=AC.createOscillator(),cg=AC.createGain();          // kattanás a lendülethez
   c.type='triangle';c.frequency.setValueAtTime(900,t);env(cg,0.22,0.035);
   c.connect(cg);cg.connect(out);c.start(t);c.stop(t+0.05);
  }else if(kind==='tomHi'||kind==='tomLo'){
   const hi=kind==='tomHi', f0=hi?260:170, f1=hi?110:72;
   const o=AC.createOscillator(),g=AC.createGain();
   o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+0.22);
   env(g,0.72,hi?0.34:0.44);o.connect(g);g.connect(out);o.start(t);o.stop(t+0.5);
   const s=AC.createBufferSource(),sg=AC.createGain(),bp=AC.createBiquadFilter();
   s.buffer=noiseBuf();bp.type='bandpass';bp.frequency.value=hi?520:340;bp.Q.value=1.2;
   env(sg,0.16,0.08);s.connect(bp);bp.connect(sg);sg.connect(out);s.start(t);s.stop(t+0.1);
  }else if(kind==='hihat'){
   const s=AC.createBufferSource(),g=AC.createGain(),hp=AC.createBiquadFilter();
   s.buffer=noiseBuf();hp.type='highpass';hp.frequency.value=7200;
   env(g,0.3,0.055);s.connect(hp);hp.connect(g);g.connect(out);s.start(t);s.stop(t+0.08);
  }else if(kind==='crash'){
   const s=AC.createBufferSource(),g=AC.createGain(),hp=AC.createBiquadFilter();
   s.buffer=noiseBuf();hp.type='highpass';hp.frequency.value=3600;
   g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.34,t+0.012);
   g.gain.exponentialRampToValueAtTime(0.0001,t+1.25);
   s.connect(hp);hp.connect(g);g.connect(out);s.start(t);s.stop(t+1.3);
  }
 }catch(e){}
}
function buildPattern(){
 /* A nóták a HÁTTÉRZENE ütemére esnek — így tényleg a dalra dobolsz.
    8 ütemből 6-ra jut nóta, hogy legyen levegő; minden ötödik rövidebb ablakú. */
 const beat=60000/RG.bpm, notes=[]; let pad=-1, k=0;
 for(let b=4;b*beat<RG.bars-900;b++){
  if(b%8===1||b%8===5)continue;
  let p;do{p=Math.floor(Math.random()*KIT.length);}while(p===pad);pad=p;
  const hard=(k%5===4);k++;
  notes.push({t:b*beat,dur:hard?RG.winHard:RG.win,hard:hard,pad:p,done:false});
 }
 return notes;
}

 let c=3;const cd=$('#mCount');
 const tick2=()=>{ if(!M||M.ended)return;
   if(c>0){cd.textContent=c;blip(520+(3-c)*90,0.07,'sine',0.12);c--;setTimeout(tick2,620);}
   else{$('#mReady').style.display='none';M.t0=performance.now();M.started=true;
    M.iv=setInterval(miniTick,25);M.raf=requestAnimationFrame(miniDraw);}};
 tick2();
}
function peakSong(a,list){
 const songs=(list||[]).map(i=>a.songs[i]).filter(Boolean);if(!songs.length)return null;
 let best=songs[0];songs.forEach(s=>{if(s.e>best.e)best=s;});return best;
}
function judge(kind,padEl){
 const j=$('#mJudge'),cb=$('#mCombo');
 const snd=padEl&&padEl.dataset?KIT[+padEl.dataset.pad]:null;
 if(kind==='perfect'){M.perfect++;M.combo++;M.crowd=clamp(M.crowd+3.6,0,100);
   drumHit(snd?snd.snd:'kick');blip(1320,0.06,'sine',0.09);}   // + apró csillanás a tökéletesre
 else if(kind==='good'){M.good++;M.combo++;M.crowd=clamp(M.crowd+2,0,100);drumHit(snd?snd.snd:'kick');}
 else{M.miss++;M.combo=0;M.crowd=clamp(M.crowd-4.2,0,100);blip(120,0.12,'square',0.11);}
 M.best=Math.max(M.best,M.combo);
 if(j){const txt=kind==='perfect'?'PERFECT':kind==='good'?'JÓ':'MELLÉ';
  const col=kind==='perfect'?'var(--neon)':kind==='good'?'var(--cash)':'var(--hot)';
  j.textContent=txt;j.style.color=col;j.classList.remove('go');void j.offsetWidth;j.classList.add('go');}
 if(cb)cb.textContent=M.combo>=3?`${M.combo}× SOROZAT`:'';
 if(padEl&&kind!=='miss'){padEl.classList.remove('flash');void padEl.offsetWidth;
  padEl.classList.add('flash','hitfx');setTimeout(()=>padEl.classList.remove('hitfx'),120);}
 const cr=$('#mCrowd');if(cr)cr.style.width=M.crowd.toFixed(1)+'%';
}
function tapPad(pi,padEl){
 if(!M||!M.started||M.ended)return;
 const now=performance.now()-M.t0;
 let hit=null;
 M.notes.forEach(n=>{if(n.done||n.pad!==pi||hit)return;if(now>=n.t&&now<=n.t+n.dur)hit=n;});
 if(!hit)return;                                  // nem világít semmi: nincs büntetés
 hit.done=true;
 const perfect=Math.abs(now-(hit.t+hit.dur/2))<=hit.dur*RG.perfectFrac;
 judge(perfect?'perfect':'good',padEl);
}
/* A LOGIKA idozitovel fut (lekesett notak, jatek vege), a RAJZOLAS rAF-fal.
   Igy a jatek akkor is helyesen zajlik le, ha a rAF akadozik vagy szunetel. */
function miniTick(){
 if(!M||M.ended)return;
 const now=performance.now()-M.t0;
 /* háttérzene: basszus + hi-hat + halk kick + szinti dallam, a nóták ugyanerre az ütemre esnek */
 if(S.sound!==false&&AC){
  const bm=60000/RG.bpm, b=Math.floor(now/bm);
  MGAIN=0.5;
  while(M.sched<b+2&&M.sched*bm<RG.bars){
   M.sched++;const k=M.sched, t=AC.currentTime+Math.max(0,(k*bm-now))/1000;
   if(k%2===0)schedKick(t);
   schedHat(t+bm/2000,false);
   if(k%2===0)schedBass(t,BASSN[(k>>1)%BASSN.length]);
   if(k>=8&&k%2===1)schedLead(t,LEADN[((k-9)>>1)%LEADN.length]);
   if(k%16===0)schedStab(t,220);
  }
  MGAIN=1;
 }
 M.notes.forEach(n=>{if(!n.done&&now>n.t+n.dur){n.done=true;judge('miss',null);}});
 if(now>=RG.bars)endMini();
}
function miniDraw(){
 if(!M||M.ended)return;
 const now=performance.now()-M.t0, pads=$('#mPads');
 if(pads){const zs=pads.querySelectorAll('.dz');
  for(let i=0;i<zs.length;i++){
   const el=zs[i],ring=el.querySelector('.dzr'),lit=el.querySelector('.dzl');
   let act=null;
   M.notes.forEach(n=>{if(n.done||n.pad!==i||act)return;if(now>=n.t&&now<=n.t+n.dur)act=n;});
   if(act){
    const p=clamp((now-act.t)/act.dur,0,1);       // mennyi telt el az ablakból
    ring.style.opacity=1;
    ring.style.transform='scale('+(1.32-p*0.5).toFixed(3)+')';
    if(lit)lit.style.opacity=(0.5*(1-p*0.5)).toFixed(2);
    el.classList.add('armed');
   }else{ring.style.opacity=0;if(lit)lit.style.opacity=0;el.classList.remove('armed');}
  }}
 M.raf=requestAnimationFrame(miniDraw);
}
/* pontszám → a show-értékeléshez adott pont (a setlist-ív rendszeren keresztül) */
/* mindkét mini-játék ugyanezt a skálát használja: max +14 bónusz, max −8 visszahúzás */
function miniPoints(acc){return Math.round(clamp((acc-0.55)*30,-8,14));}
/* közös eredmény-képernyő mindkét mini-játéknak */
function miniResult(kind,acc,detail){
 const pts=miniPoints(acc);
 S.live.mini=S.live.mini||{};
 S.live.mini[M.stop]={kind,acc:+acc.toFixed(3),pts};
 const grade=acc>=0.9?'A+':acc>=0.78?'A':acc>=0.62?'B':acc>=0.45?'C':'D';
 blip(acc>=0.62?1320:220,0.18,'sine',0.18);
 $('#mini').innerHTML=`<div class="mready" style="position:relative;flex:1">
   <div class="mcount" style="color:${pts>=0?'var(--neon)':'var(--hot)'}">${grade}</div>
   <h3>${Math.round(acc*100)}% ${kind==='drum'?'pontosság':'fényteljesítmény'}</h3>
   <p>${detail}<br><b style="color:${pts>=0?'var(--cash)':'var(--hot)'}">${pts>=0?'+':''}${pts} pont</b> a ma esti show-ra.</p>
   ${pts>0?`<button class="btn gold" id="mX2" style="max-width:280px;margin-bottom:9px">${icon('play','16px')} Reklám · dupla bónusz (+${pts})</button>`:''}
   <button class="btn lime" id="mDone" style="max-width:280px">Vissza a koncertre</button></div>`;
 const x2=$('#mX2');
 if(x2)x2.onclick=function(){Ads.show(function(){
   const m=S.live.mini[M.stop];m.pts=pts*2;save();
   toast('Dupla bónusz: +'+m.pts+' pont!');closeMini(true);
 },function(){toast('A videó megszakadt — marad az eredeti bónusz.');});};
 $('#mDone').onclick=()=>closeMini(true);
}
function endMini(){
 if(!M||M.ended)return;M.ended=true;cancelAnimationFrame(M.raf);if(M.iv)clearInterval(M.iv);
 const tot=Math.max(1,M.perfect+M.good+M.miss);
 const acc=(M.perfect+M.good*0.6)/tot;
 miniResult('drum',acc,`${M.perfect} perfect · ${M.good} jó · ${M.miss} mellé · leghosszabb sorozat ${M.best}×`);
}

/* ============================ FÉNYSHOW MINI-JÁTÉK (fénypult) ============================
   Profi koncert-fényrig: hátsó truss + színpad-perem mozgó fejgépekkel, volumetrikus
   nyalábok, haze, színwash, strobe — canvasra rajzolva. Alatta PROCEDURÁLIS zene
   (WebAudio, licencmentes), és a fények, a cue-k és a pontozás a ZENE ÜTEMÉRE mennek.
   Skill: irány + intenzitás húzással, szín-illesztés, és a dropra elsütött cue. */
const LT={dur:26000,bpm:124,nBack:9,nFront:11,
  cols:[{id:'ice',n:'Kék',c:[110,215,255]},{id:'white',n:'Fehér',c:[235,245,255]},{id:'amber',n:'Arany',c:[255,180,70]}],
  drops:[8,16,24,32,40,48],
  cueWin:420};
function countdown(done){
 let c=3;const cd=$('#mCount');
 const step=function(){ if(!M||M.ended)return;
   if(c>0){if(cd)cd.textContent=c;blip(520+(3-c)*90,0.07,'sine',0.12);c--;setTimeout(step,620);}
   else{const r=$('#mReady');if(r)r.style.display='none';done();}};
 step();
}
function beatMs(){return 60000/LT.bpm;}
let MGAIN=1;   // háttérzene hangereje (a dobosnál halkabb, hogy a saját ütés kiemelkedjen)

/* ---- procedurális zene: kick / hat / basszus / stab, tiszta ütemmel ---- */
function schedKick(t){const o=AC.createOscillator(),g=AC.createGain();
 o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(46,t+0.11);
 g.gain.setValueAtTime(0.8*MGAIN,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.36);}
function schedHat(t,open){const s2=AC.createBufferSource(),g=AC.createGain(),hp=AC.createBiquadFilter();
 s2.buffer=noiseBuf();hp.type='highpass';hp.frequency.value=7600;
 g.gain.setValueAtTime((open?0.15:0.09)*MGAIN,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(open?0.16:0.045));
 s2.connect(hp);hp.connect(g);g.connect(AC.destination);s2.start(t);s2.stop(t+0.2);}
function schedBass(t,f){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
 o.type='sawtooth';o.frequency.setValueAtTime(f,t);lp.type='lowpass';lp.frequency.setValueAtTime(420,t);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2*MGAIN,t+0.02);
 g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
 o.connect(lp);lp.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.34);}
function schedStab(t,f){[1,1.5,2].forEach(function(m,i){const o=AC.createOscillator(),g=AC.createGain();
 o.type='square';o.frequency.setValueAtTime(f*m,t);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.07*MGAIN/(i+1),t+0.015);
 g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.45);});}
function schedRiser(t,dur){const s2=AC.createBufferSource(),g=AC.createGain(),bp=AC.createBiquadFilter();
 s2.buffer=noiseBuf();bp.type='bandpass';bp.Q.value=3;
 bp.frequency.setValueAtTime(500,t);bp.frequency.exponentialRampToValueAtTime(6500,t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16*MGAIN,t+dur*0.9);
 g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.06);
 s2.connect(bp);bp.connect(g);g.connect(AC.destination);s2.start(t);s2.stop(t+dur+0.1);}
const BASSN=[55,55,73.4,65.4];
const LEADN=[440,523.3,587.3,523.3,440,392,440,587.3];
function schedLead(t,f){const o=AC.createOscillator(),g=AC.createGain();
 o.type='triangle';o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.06*MGAIN,t+0.02);
 g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.36);}

function openLights(stopIdx){
 const L=S.live;if(!L)return;
 const a=AM[L.artist],peak=peakSong(a,L.setlist),city=CM[L.stops[stopIdx].city];
 L.pausedLeft=remainMs();
 const nBeats=Math.ceil(LT.dur/beatMs());
 M={kind:'lights',stop:stopIdx,crowd:46,combo:0,best:0,down:false,
    aimX:0.5,aimY:0.5,col:0,tgtX:0.5,tgtY:0.6,wantCol:0,
    beat:-1,sched:-1,flash:0,strobe:0,
    trackOn:0,trackAll:0,colOn:0,colAll:0,
    cues:LT.drops.map(function(b){return{b:b,t:b*beatMs(),done:false,hit:false};}),
    cueOk:0,cueMiss:0,
    t0:0,started:false,ended:false,raf:0,iv:0,W:1,H:1,nBeats:nBeats};
 $('#mini').innerHTML=
  '<div class="mtop">'+
    '<div class="r1"><div style="min-width:0">'+
      '<div class="kick2">'+esc(city.n)+' · tiéd a fénypult</div>'+
      '<div class="sng">'+esc(peak?peak.n:'Fényshow')+'</div></div>'+
      '<button class="x" id="mSound" style="color:'+(S.sound===false?'var(--faint)':'var(--neon)')+'">HANG</button></div>'+
    '<div class="mbar"><i id="mCrowd" style="width:46%"></i><b>KÖZÖNSÉG</b></div>'+
  '</div>'+
  '<div class="rig" id="rig">'+
    '<canvas id="rigC"></canvas>'+
    '<div class="hint3" id="rigHint">HÚZD AZ UJJAD — IRÁNY ÉS INTENZITÁS<br>KÖVESD A FEHÉR JELET</div>'+
    '<div class="aimbar"><u id="abT"></u><i id="abM"></i></div>'+
    '<div class="cuebig" id="cueBig">DROP!</div>'+
  '</div>'+
  '<div class="deskbar">'+LT.cols.map(function(c,i){return '<button class="colb '+(i===0?'on':'')+'" data-col="'+i+'" style="color:rgb('+c.c.join(',')+')">'+
      '<span class="dot2" style="background:rgb('+c.c.join(',')+')"></span>'+c.n+'</button>';}).join('')+'</div>'+
  '<div class="deskbar"><button class="cuebtn" id="cueBtn">'+icon('bolt','18px')+' CUE</button></div>'+
  '<div class="mmid" style="flex:0 0 auto;min-height:44px"><div class="mjudge" id="mJudge" style="font-size:29px"></div><div class="mcombo" id="mCombo"></div></div>'+
  '<div class="mfoot"><button class="btn dark sm" id="mQuit">Kihagyom — menjen automatán</button></div>'+
  '<div class="mready" id="mReady">'+
    '<div class="mcount" id="mCount">3</div>'+
    '<h3>Tiéd a fénypult</h3>'+
    '<p>Húzd az ujjad: <b>vízszintesen az irány</b>, <b>függőlegesen az intenzitás</b>. '+
       'Kövesd a fehér jelet, tartsd a <b>kért színt</b>, és a <b style="color:var(--hot)">DROP</b>-ra nyomd a CUE-t.</p>'+
  '</div>';
 $('#mini').className='on';
 $('#mSound').onclick=function(){S.sound=(S.sound===false);save();$('#mSound').style.color=S.sound===false?'var(--faint)':'var(--neon)';};
 $('#mQuit').onclick=function(){closeMini(false);};
 const rig=$('#rig'),cv=$('#rigC');
 const put=function(e){const r=rig.getBoundingClientRect();
   M.aimX=clamp((e.clientX-r.left)/r.width,0,1);
   M.aimY=clamp(1-(e.clientY-r.top)/r.height,0,1);
   const h=$('#rigHint');if(h)h.style.display='none';};
 rig.onpointerdown=function(e){e.preventDefault();M.down=true;try{rig.setPointerCapture(e.pointerId);}catch(x){}put(e);};
 rig.onpointermove=function(e){if(M&&M.down)put(e);};
 rig.onpointerup=rig.onpointercancel=function(){if(M)M.down=false;};
 $('#mini').querySelectorAll('[data-col]').forEach(function(b){b.onclick=function(){M.col=+b.dataset.col;
   $('#mini').querySelectorAll('[data-col]').forEach(function(x){x.classList.toggle('on',+x.dataset.col===M.col);});};});
 $('#cueBtn').onclick=fireCue;
 const r0=rig.getBoundingClientRect();M.W=r0.width;M.H=r0.height;
 const dpr=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.round(M.W*dpr);cv.height=Math.round(M.H*dpr);
 countdown(function(){M.t0=performance.now();M.started=true;
   if(S.sound!==false){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
   M.iv=setInterval(lightTick,25);M.raf=requestAnimationFrame(lightDraw);});
}

function fireCue(){
 if(!M||!M.started||M.ended)return;
 const now=performance.now()-M.t0;
 let c=null;M.cues.forEach(function(x){if(!x.done&&Math.abs(x.t-now)<=LT.cueWin&&!c)c=x;});
 if(!c)return;
 c.done=true;c.hit=true;M.cueOk++;M.combo++;M.best=Math.max(M.best,M.combo);
 M.crowd=clamp(M.crowd+8,0,100);M.strobe=1;M.flash=1;
 judgeL('perfect');
}
function judgeL(kind){
 const j=$('#mJudge'),cb=$('#mCombo');
 const map={perfect:['ROBBANÁS','var(--neon)'],good:['SZÉP','var(--cash)'],miss:['ELSZÚRTAD','var(--hot)']};
 const m=map[kind];if(!m)return;
 if(kind==='perfect')blip(1200,0.1,'sine',0.16);else if(kind==='miss')blip(120,0.14,'square',0.12);
 if(j){j.textContent=m[0];j.style.color=m[1];j.classList.remove('go');void j.offsetWidth;j.classList.add('go');}
 if(cb)cb.textContent=M.combo>=3?(M.combo+'× SOROZAT'):'';
 if(kind==='perfect'){const c=$('#cueBig');if(c){c.classList.remove('go');void c.offsetWidth;c.classList.add('go');}}
}
function lightTick(){
 if(!M||M.ended)return;
 const now=performance.now()-M.t0, bm=beatMs(), b=Math.floor(now/bm);
 if(S.sound!==false&&AC){
  while(M.sched<b+2&&M.sched<M.nBeats){
   M.sched++;const k=M.sched, t=AC.currentTime+Math.max(0,(k*bm-now))/1000;
   schedKick(t);
   schedHat(t+bm/2000,false);
   if(k%2===0)schedBass(t,BASSN[(k>>1)%BASSN.length]);
   if(k%8===0)schedStab(t,220);
   if(LT.drops.indexOf(k)>=0){schedStab(t,330);schedHat(t,true);}
   if(LT.drops.indexOf(k+2)>=0)schedRiser(t,2*bm/1000);
  }
 }
 if(b!==M.beat){M.beat=b;
  M.wantCol=Math.floor(b/6)%LT.cols.length;
  const wc=$('#mini');if(wc)wc.querySelectorAll('[data-col]').forEach(function(x){x.classList.toggle('want',+x.dataset.col===M.wantCol);});
 }
 const ph=now/bm;
 M.tgtX=0.5+0.42*Math.sin(ph*0.72);
 M.tgtY=0.55+0.35*Math.sin(ph*1.5+1.1);
 M.trackAll++;
 const d=Math.hypot((M.aimX-M.tgtX),(M.aimY-M.tgtY)*0.8);
 if(d<=0.19){M.trackOn++;M.crowd=clamp(M.crowd+0.22,0,100);}else M.crowd=clamp(M.crowd-0.16,0,100);
 M.colAll++;if(M.col===M.wantCol)M.colOn++;
 M.cues.forEach(function(c){if(!c.done&&now>c.t+LT.cueWin){c.done=true;M.cueMiss++;M.combo=0;
   M.crowd=clamp(M.crowd-7,0,100);judgeL('miss');}});
 const cb=$('#cueBtn');
 if(cb){const near=M.cues.some(function(c){return !c.done&&Math.abs(c.t-now)<=LT.cueWin;});cb.classList.toggle('armed',near);}
 M.strobe=Math.max(0,M.strobe-0.06);M.flash=Math.max(0,M.flash-0.05);
 const cr=$('#mCrowd');if(cr)cr.style.width=M.crowd.toFixed(1)+'%';
 const at=$('#abT'),am=$('#abM');
 if(at){at.style.left=((M.tgtX-0.09)*100).toFixed(1)+'%';at.style.width='18%';}
 if(am)am.style.left=(M.aimX*100).toFixed(1)+'%';
 if(now>=LT.dur)endLights();
}
function lightDraw(){
 if(!M||M.ended)return;
 const cv=$('#rigC');
 if(!cv){M.raf=requestAnimationFrame(lightDraw);return;}
 const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,now=performance.now()-M.t0,bm=beatMs();
 const beatF=(now%bm)/bm, pulse=Math.pow(1-beatF,2.2);
 const c=LT.cols[M.col].c, inten=0.35+M.aimY*0.65;
 ctx.globalCompositeOperation='source-over';
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#060a12');g.addColorStop(1,'#030407');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='lighter';
 const drawBeams=function(n,y0,dir,len,spread,alpha){
  for(let i=0;i<n;i++){
   const fx=W*(0.06+0.88*(n===1?0.5:i/(n-1)));
   const t=(i-(n-1)/2)/Math.max(1,(n-1)/2);
   const aim=M.aimX*W + t*spread*W*(0.5+0.5*Math.sin(now/700+i*0.5));
   const ex=aim, ey=y0+dir*len*H;
   const ang=Math.atan2(ey-y0,ex-fx), wid=W*0.030*(0.7+inten*0.8);
   const px=Math.cos(ang+Math.PI/2)*wid, py=Math.sin(ang+Math.PI/2)*wid;
   const gr=ctx.createLinearGradient(fx,y0,ex,ey);
   const aa=alpha*inten*(0.55+0.45*pulse);
   gr.addColorStop(0,'rgba(255,255,255,'+(aa*0.85).toFixed(3)+')');
   gr.addColorStop(0.12,'rgba('+c[0]+','+c[1]+','+c[2]+','+(aa*0.8).toFixed(3)+')');
   gr.addColorStop(0.6,'rgba('+c[0]+','+c[1]+','+c[2]+','+(aa*0.22).toFixed(3)+')');
   gr.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
   ctx.fillStyle=gr;ctx.beginPath();
   ctx.moveTo(fx-px*0.25,y0-py*0.25);ctx.lineTo(fx+px*0.25,y0+py*0.25);
   ctx.lineTo(ex+px*2.6,ey+py*2.6);ctx.lineTo(ex-px*2.6,ey-py*2.6);
   ctx.closePath();ctx.fill();
   const hg=ctx.createRadialGradient(fx,y0,0,fx,y0,W*0.028);
   hg.addColorStop(0,'rgba(255,255,255,'+(0.9*inten).toFixed(2)+')');
   hg.addColorStop(0.35,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.5*inten).toFixed(2)+')');
   hg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=hg;
   ctx.beginPath();ctx.arc(fx,y0,W*0.028,0,7);ctx.fill();
  }
 };
 drawBeams(LT.nBack, H*0.16, 1, 1.05, 0.55, 0.62);
 drawBeams(LT.nFront, H*0.93, -1, 1.0, 0.7, 0.52);
 /* haze: lagy fenykod a szinpad felett */
 const hz=ctx.createLinearGradient(0,H*0.16,0,H);
 hz.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.06*inten).toFixed(3)+')');
 hz.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=hz;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(0,H*0.145,W,H*0.012);ctx.fillRect(0,H*0.925,W,H*0.014);

 const wg=ctx.createRadialGradient(M.aimX*W,H*0.9,0,M.aimX*W,H*0.9,W*0.55);
 wg.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.2*inten).toFixed(3)+')');

 if(M.strobe>0.02){ctx.fillStyle='rgba(255,255,255,'+(M.strobe*0.5*(Math.random()>0.4?1:0.2)).toFixed(3)+')';ctx.fillRect(0,0,W,H);}
 ctx.globalCompositeOperation='source-over';
 M.raf=requestAnimationFrame(lightDraw);
}

function doneCount(){return S.live?S.live.rows.length:0;}
function teardownMap(){if(G.map){try{G.map.remove();}catch(e){}G.map=null;G.markers={};G.route=null;G.glow=null;G.done=null;G.pos=null;}}
function pinIcon(city,ord,done){const on=ord>0;return L.divIcon({className:'',iconSize:on?[26,26]:[12,12],iconAnchor:on?[13,13]:[6,6],
  html:`<div class="pin ${on?'on':''} ${done?'done':''}"><div class="dot">${on?ord:''}</div></div>`});}
function initMap(){if(!HAS_MAP)return;teardownMap();
 G.map=L.map('lmap',{worldCopyJump:true,zoomControl:true,attributionControl:true,minZoom:1}).setView([25,12],2);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(G.map);
 const st=actStops(),dc=doneCount();
 cityList().forEach(c=>{const ord=st.findIndex(s=>s.city===c.id)+1;
  const m=L.marker([c.lat,c.lon],{icon:pinIcon(c,ord,ord>0&&ord<=dc),title:c.n}).addTo(G.map);
  if(!S.live)m.on('click',()=>toggleCity(c.id));
  m.bindTooltip(c.n,{direction:'top',offset:[0,-8]});G.markers[c.id]=m;});
 drawRoute();setTimeout(()=>{try{G.map.invalidateSize();}catch(e){}},80);}

 cityList().forEach(c=>{const ord=st.findIndex(s=>s.city===c.id)+1;G.markers[c.id]&&G.markers[c.id].setIcon(pinIcon(c,ord,ord>0&&ord<=dc));});}
function drawRoute(){if(!G.map)return;
 [ 'route','glow','done' ].forEach(k=>{if(G[k]){G.map.removeLayer(G[k]);G[k]=null;}});
 const pts=actStops().map(s=>[CM[s.city].lat,CM[s.city].lon]);
 if(pts.length>1){G.glow=L.polyline(pts,{color:'#C6FF3A',weight:8,opacity:.18}).addTo(G.map);
  G.route=L.polyline(pts,{color:'#C6FF3A',weight:3,opacity:.95,dashArray:'9,7'}).addTo(G.map);}
 const dc=doneCount();                                   // már megjárt szakasz kiemelése
 if(dc>1){G.done=L.polyline(pts.slice(0,dc),{color:'#2FE39B',weight:4,opacity:.95}).addTo(G.map);}}
function fitRoute(){if(!G.map)return;const pts=actStops().map(s=>[CM[s.city].lat,CM[s.city].lon]);
 if(pts.length>=2)G.map.fitBounds(pts,{padding:[40,40]});else if(pts.length===1)G.map.setView(pts[0],4);}

function updateLivePos(prog){
 if(!G.map||!S.live)return;const p=curPhase();if(!p)return;
 const L2=S.live,cur=CM[L2.stops[p.i].city];let lat=cur.lat,lon=cur.lon;
 if(p.k==='travel'&&p.i>0){const pv=CM[L2.stops[p.i-1].city];
  lat=pv.lat+(cur.lat-pv.lat)*prog;let d=cur.lon-pv.lon;
  if(d>180)d-=360;if(d<-180)d+=360;lon=pv.lon+d*prog;}
 const html=`<div class="movpin">${icon(p.k==='travel'?'plane':'mic','14px')}</div>`;
 if(!G.pos){G.pos=L.marker([lat,lon],{icon:L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html}),
   zIndexOffset:900,interactive:false}).addTo(G.map);}
 else{G.pos.setLatLng([lat,lon]);G.pos.setIcon(L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html}));}}

/* ============================ SZÁMLÁLÓ ANIMÁCIÓ ============================ */
function animateNum(el,to,fmt){if(!el)return;const from=parseFloat(el.dataset.v||'0')||0;
 /* háttérben a requestAnimationFrame nem fut → azonnal a végértéket írjuk, ne ragadjon 0-n */
 if(from===to||document.hidden){el.textContent=fmt(to);el.dataset.v=to;return;}
 const t0=performance.now(),dur=650;el.dataset.v=to;
 function step(t){const p=clamp((t-t0)/dur,0,1),e=1-Math.pow(1-p,3),val=from+(to-from)*e;el.textContent=fmt(val);if(p<1)requestAnimationFrame(step);}
 requestAnimationFrame(step);}

function grantReward(rw,label){
 let bits=[];
 if(rw.money){S.money+=rw.money;bits.push(money(rw.money));}
 if(rw.cred){if(legRank()>0){S.money+=rw.cred*4000;bits.push(money(rw.cred*4000));}
              else{S.credits=credits()+rw.cred;bits.push(rw.cred+' kredit');}}
 if(rw.theme&&(S.themes||[]).indexOf(rw.theme)<0){S.themes.push(rw.theme);
   const th=THEMES.find(function(x){return x.id===rw.theme;});bits.push((th?th.n:'új')+' téma');}
 return bits.join(' · ');
}

 if(!S.mile)S.mile={};
 MILES.forEach(function(m){

const CHALS=[
 {id:'sa3',n:'Dél-amerikai roham',d:'Játssz 3 telt házas klubkoncertet Dél-Amerikában.',g:3,rw:{cred:12}},
 {id:'rel2',n:'Stúdiómaraton',d:'Adj ki 2 zenét (single, EP vagy album).',g:2,rw:{money:60000}},
 {id:'fan60',n:'Helyi hősök',d:'Érj el 60 rajongót egy régióban.',g:60,rw:{cred:10}},
 {id:'tour4',n:'Nagy körút',d:'Vigyél végig egy 4+ állomásos turnét.',g:1,rw:{money:50000}},
 {id:'mrc',n:'Pólóbiznisz',d:'Keress €50 000 merchet egy turnén.',g:50000,rw:{cred:12}},
 {id:'ai',n:'Ázsiai áttörés',d:'Érj el 45 rajongót Ázsiában.',g:45,rw:{cred:12}},
];
function rollChal(){
 const pool=CHALS.filter(function(c){return !S.chal||c.id!==S.chal.id;});
 const c=pool[Math.floor(Math.random()*pool.length)]||CHALS[0];
 S.chal={id:c.id,p:0};return S.chal;
}
function curChal(){if(!S.chal)rollChal();const d=CHALS.find(function(c){return c.id===S.chal.id;});return d?{d:d,st:S.chal}:null;}
function chalSet(id,val){const c=curChal();if(!c||c.d.id!==id)return;if(val>c.st.p)c.st.p=val;chalCheck();}
function chalAdd(id,n){const c=curChal();if(!c||c.d.id!==id)return;c.st.p+=n;chalCheck();}
function chalCheck(){
 const c=curChal();if(!c)return;
 if(c.st.p>=c.d.g){
  const got=grantReward(c.d.rw);
  pushFeed('Kihívás teljesítve: '+c.d.n,(got?got+' · ':'')+c.d.d,'trophy','var(--cash)');
  toast('Kihívás kész: '+c.d.n+(got?' · '+got:''));
  S.chalDone=(S.chalDone||0)+1;rollChal();
 }
}
/* élőben mért kihívások frissítése */
function chalLive(){
 const c=curChal();if(!c)return;
 if(c.d.id==='fan60'||c.d.id==='ai'){
  const rg=c.d.id==='ai'?'AS':null;let best=0;
  S.roster.forEach(function(id){const A=artState(id);
   Object.keys(REGIONS).forEach(function(g){if(rg&&g!==rg)return;best=Math.max(best,A.fans[g]||0);});});
  chalSet(c.d.id,Math.round(best));
 }
}

/* ============================ RÉSZESEDÉS-ALKU ============================
   Leigazoláskor a játékos megalkudja az ÜGYNÖKSÉGI részesedést. A csúszka a kért %,
   a sikeresély élőben látszik: minél többet kérsz az alaphoz képest, annál kisebb —
   és egy felfutott sztárt sokkal nehezebb megszorítani, mint egy feltörekvőt.
   Az alku egy mozgó jelölő megállítása: a siker-zóna MÉRETE = a sikeresély. */
/* Valós zeneipari modell: a játékos a MENEDZSMENT, ami az előadó bevételéből
   jutalékot visz (management + booking, tipikusan 15-20%). Az előadó viszi a többséget.
   A jutalék alapja a turné NYERESÉGE (bevétel + merch − költségek), és a split 100%-ra jön ki.
   Alap-jutalék státusz szerint: a nagy név alkuereje miatt kevesebbet enged. */
function dealBase(a){const f=af(a);return f>=85?12:f>=65?16:f>=45?20:25;}
function dealChance(a,ask){
 const base=dealBase(a), steep=0.9+af(a)/50;      // sztárnál meredekebb a romlás
 return clamp(0.92+(hasStaff('mgr')?0.08:0)-Math.max(0,ask-base)*0.045*steep,0.05,0.95);
}
function dealShare(a){const d=S.deal&&S.deal[a.id];return d===undefined?dealBase(a):d;}
function commRate(a){return dealShare(a)/100;}
function openDeal(id){
 const a=AM[id];
 if(S.money<a.sign){toast('Nincs elég pénz.');return;}
 const base=dealBase(a);
 D={a:a,ask:base,round:0,done:false,pos:0,dir:1,raf:0,zone:0.5};
 renderDeal();
}
let D=null;
function dealStatus(a){const f=af(a);return f>=85?'Legenda':f>=65?'Sztár':f>=45?'Áttörés':'Feltörekvő';}
function renderDeal(){

 let h='<div class="ev"><div class="ph"><img src="'+artistPhoto(a,700,300)+'" '+imgFB()+'><div class="g"></div>'+

     '<span class="bigprice" id="dPct">'+D.ask+'%</span></div>'+
     '<div class="prow"><button class="step" data-dn="-1">−</button>'+
       '<input type="range" min="5" max="30" step="1" value="'+D.ask+'" id="dRange">'+
       '<button class="step" data-dn="1">+</button></div></div>'+
   '<div class="band"><span>Sikeresély</span><span><b id="dCh" style="color:'+(ch>=0.6?'var(--cash)':ch>=0.3?'var(--gold)':'var(--hot)')+'">'+Math.round(ch*100)+'%</b></span></div>'+
   '<div class="band"><span>Ügynökség / Előadó</span><span><b id="dCut">'+D.ask+'% / '+(100-D.ask)+'%</b></span></div>'+

   '<div class="evch" style="margin-top:13px">'+
     '<button class="evb good" data-go="1"><div class="l">'+icon('star','15px')+' Alkudjunk · '+D.ask+'%</div></button>'+
     '<button class="evb" data-base="1"><div class="l">Elfogadom az alapot · '+base+'%</div></button>'+
     '<button class="evb" data-cancel="1"><div class="l">Mégse</div></button>'+
   '</div></div></div>';
 const m=$('#modal');m.innerHTML=h;m.className='on';
 const rg=$('#dRange');
 const upd=function(){D.ask=+rg.value;const c2=dealChance(a,D.ask);
  $('#dPct').textContent=D.ask+'%';
  const e=$('#dCh');e.textContent=Math.round(c2*100)+'%';
  e.style.color=c2>=0.6?'var(--cash)':c2>=0.3?'var(--gold)':'var(--hot)';
  $('#dCut').textContent=D.ask+'% / '+(100-D.ask)+'%';
  m.querySelector('[data-go] .l').innerHTML=icon('star','15px')+' Alkudjunk · '+D.ask+'%';};
 rg.oninput=upd;

 m.querySelector('[data-go]').onclick=function(){D.round=0;dealRound();};

 m.querySelector('[data-cancel]').onclick=function(){D=null;$('#modal').className='';$('#modal').innerHTML='';};

function dealRound(){
 D.round++;
 const a=D.a,ch=dealChance(a,D.ask);
 /* A nehézség SZOROSAN a sikeresélyhez kötött, két tengelyen egyszerre:
    a zóna négyzetesen szűkül, a jelölő pedig gyorsul. Egy mohó ajánlat így valódi
    kockázat: 90% → fél sáv és lassú inga, 5% → hajszálcsík és villámgyors inga. */
 D.zw=clamp(0.05+ch*ch*0.52,0.05,0.60);
 D.spd=0.014+(1-ch)*0.024;
 D.zone=D.zw/2+Math.random()*(1-D.zw);           // a zóna végig a sávon belül marad
 D.pos=0;D.dir=1;D.locked=false;
 const h='<div class="ev"><div class="bd">'+
  '<h3>Alku · '+D.round+'/3 próba</h3>'+

  '<button class="cuebtn" id="dStop" style="margin-top:16px">MEGÁLLÍT</button>'+
  '<div class="band" style="justify-content:center;margin-top:12px"><span id="dMsg">Kért jutalék: <b>'+D.ask+'%</b></span></div>'+
  '</div></div>';
 const m=$('#modal');m.innerHTML=h;m.className='on';
 const z=$('#dZone');z.style.left=((D.zone-D.zw/2)*100).toFixed(1)+'%';z.style.width=(D.zw*100).toFixed(1)+'%';
 $('#dStop').onclick=dealStop;
 /* időzítőn fut, nem rAF-on: akkor is helyesen mozog, ha a rajzolás akadozik */
 const step=function(){
  if(!D||D.locked)return;
  D.pos+=D.dir*(D.spd||0.018);
  if(D.pos>=1){D.pos=1;D.dir=-1;} if(D.pos<=0){D.pos=0;D.dir=1;}
  const mk=$('#dMark');if(mk)mk.style.left=(D.pos*100).toFixed(1)+'%';};
 D.raf=setInterval(step,16);
}
function dealStop(){
 if(!D||D.locked)return;D.locked=true;clearInterval(D.raf);
 const ok=Math.abs(D.pos-D.zone)<=D.zw/2;
 const msg=$('#dMsg');
 if(ok){blip(1200,0.12,'sine',0.18);
  if(msg)msg.innerHTML='<b style="color:var(--cash)">MEGVAN! '+D.ask+'% jutalék.</b>';
  setTimeout(function(){closeDeal(true);},700);
 }else{blip(140,0.14,'square',0.13);
  if(msg)msg.innerHTML='<b style="color:var(--hot)">Nem ment.</b>';
  setTimeout(function(){
    if(!D)return;
    if(D.round<3)dealOffer();                       // fizetős újrapróbálkozás vagy alap
    else{D.ask=dealBase(D.a);closeDeal(false);}
  },800);
 }
}
/* Sikertelen próba után: a játékos VÁLASZT — fizet a következőért, vagy elfogadja az alapot.
   A 2. próba egy reklámvideó, a 3. arany lemez (kredit). */
function dealOffer(){
 if(!D)return;
 const a=D.a,base=dealBase(a),nxt=D.round+1,byAd=(nxt===2);
 const cost=byAd?'egy reklámvideó':(COST_DEAL+' arany lemez');
 const h='<div class="ev"><div class="bd">'+
  '<h3>'+D.round+'. próba nem sikerült</h3>'+
  '<p>Újra <b>'+D.ask+'%</b>-kal — vagy lezárod az alapon.</p>'+
  '<div class="evch" style="margin-top:14px">'+
   '<button class="evb '+(byAd?'good':'pay')+'" data-retry="1"><div class="l">'+
     (byAd?icon('play','15px')+' Reklám megnézése · '+nxt+'. próba'

function facLv(id){return (S.fac&&S.fac[id])||0;}
function hasStaff(id){return !!(S.staff&&S.staff[id]);}
function rosterCap(){return 3+facLv('office')*2;}
/* ---- előadó-fejlesztés ---- */
function artUp(id){if(!S.artUp)S.artUp={};if(!S.artUp[id])S.artUp[id]={q:0,f:0};return S.artUp[id];}
function songQ(a,s){return clamp(s.q+artUp(a.id).q,0,100);}
function trainCost(a){return Math.round((30000+af(a)*1400)*(1+artUp(a.id).q*0.22)/1000)*1000;}
function imageCost(a){return Math.round((45000+af(a)*2200)*(1+artUp(a.id).f/3*0.3)/1000)*1000;}

function buyFac(id){
 const f=FAC.find(function(x){return x.id===id;});const l=facLv(id);
 if(l>=f.max){toast('Már maximumon van.');return;}
 const c=f.cost[l+1];
 if(S.money<c){toast('Nincs elég pénz — '+money(c)+' kell.');return;}
 S.money-=c;S.fac=S.fac||{};S.fac[id]=l+1;
 pushFeed(f.n+' · '+(l+1)+'. szint',f.eff(l+1),f.ic,'var(--cash)');
 save();toast(f.n+' fejlesztve!');render();
}
function hireStaff(id){
 const st=STAFF.find(function(x){return x.id===id;});
 if(hasStaff(id)){toast('Már nálad dolgozik.');return;}
 if(S.money<st.cost){toast('Nincs elég pénz — '+money(st.cost)+' kell.');return;}
 S.money-=st.cost;S.staff=S.staff||{};S.staff[id]=1;
 pushFeed(st.n+' felvéve',st.eff,st.ic,'var(--cash)');
 save();toast(st.n+' csatlakozott!');render();
}
function trainArtist(id,kind){
 const a=AM[id],u=artUp(id);
 if(kind==='q'){
  if(u.q>=12){toast('A képzés a maximumon van.');return;}
  const c=trainCost(a);if(S.money<c){toast('Nincs elég pénz — '+money(c)+' kell.');return;}
  S.money-=c;u.q+=2;pushFeed(a.n+': képzés','Minden dal minősége +2 (összesen +'+u.q+')',a.ic,'var(--neon)');
 }else{
  if(u.f>=15){toast('Az imázs a maximumon van.');return;}
  const c=imageCost(a);if(S.money<c){toast('Nincs elég pénz — '+money(c)+' kell.');return;}
  S.money-=c;u.f+=3;const A=artState(id);A.fameAdd=Math.min(60,A.fameAdd+3);
  pushFeed(a.n+': imázs-kampány','+3 hírnév (összesen +'+u.f+')',a.ic,'var(--neon)');
 }
 save();render();
}

/* ---------- TÉRKÉP / TURNÉ ---------- */
function startTour(id){if(S.live){toast('Előbb fejezd be a folyamatban lévő turnét.');S.tab='terkep';save();render();return;}
 const a=AM[id];
 /* ÜRESEN indul: a szet összerakása és sorrendje a játékos döntése */
 S.tour={artist:id,stops:[],setlist:[],promo:0,risk:false};S.detail=null;S.tab='terkep';save();render();}
/* kezdo szet: a legjobb dalokbol, de mar az idealis ivhez rendezve - innen lehet tovabb csiszolni */
function autoSetlist(a,n){n=Math.min(n||6,a.songs.length);
 const pool=a.songs.map((s,i)=>i),out=new Array(n),tgt=p=>arcTarget(n>1?p/(n-1):0.5);
 /* a legmagasabb célú helyeket (csúcs, ráadás) töltjük fel először, hogy oda jusson a nagyágyú */
 const order=[];for(let p=0;p<n;p++)order.push(p);
 order.sort((x,y)=>tgt(y)-tgt(x));
 order.forEach(p=>{const want=tgt(p);let best=0,bs=-1e9;
  pool.forEach((si,k)=>{const s2=a.songs[si],v=s2.q*0.55-Math.abs(s2.e-want)*0.9;if(v>bs){bs=v;best=k;}});
  out[p]=pool.splice(best,1)[0];});
 return out;}
/* ---------- helyszín-feloldás ---------- */
function venueOpen(v){return S.rep>=(v.minRep||0);}
function bestOpenVenue(){for(let i=VENUES.length-1;i>=0;i--)if(venueOpen(VENUES[i]))return VENUES[i];return VENUES[0];}
function nextLockedVenue(){return VENUES.find(v=>!venueOpen(v))||null;}
/* az előadóhoz illő méret, de sosem nagyobb, mint amit a hírneved már feloldott */
function defVenue(a){const f=af(a);let want=f>=80?VM.arena:f>=50?VM.theatre:VM.club;
 for(let i=VENUES.indexOf(want);i>=0;i--)if(venueOpen(VENUES[i]))return VENUES[i];
 return VM.club;}

function curveSVG(sim){
 const n=sim.pts.length;
 if(!n)return `<div style="height:96px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12.5px;font-weight:600;text-align:center;padding:0 14px">Adj hozzá dalokat — itt látod élőben, hogyan alakul a közönség energiája.</div>`;
 const X=i=>n>1?(i/(n-1))*100:50, Y=v=>38-(v/100)*34;
 const pts=sim.pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.crowd).toFixed(1)}`).join(' ');
 let ideal='';for(let i=0;i<=24;i++){const t=i/24;ideal+=`${(t*100).toFixed(1)},${Y(arcTarget(t)).toFixed(1)} `;}
 return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" class="csvg">
   <polyline class="ideal" points="${ideal.trim()}"/>
   <polygon class="fill" points="0,40 ${pts} 100,40"/>
   <polyline class="line" points="${pts}"/>
   ${sim.pts.map((p,i)=>`<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(p.crowd).toFixed(1)}" r="1.7"/>`).join('')}
 </svg>`;
}

/* ---- mobilbarát húzd-és-ejtsd (pointer események, 46px fogantyú) ---- */
function initDrag(){
 const wrap=$('#slwrap');if(!wrap)return;
 wrap.querySelectorAll('[data-drag]').forEach(h=>{
  h.onpointerdown=ev=>{
   ev.preventDefault();
   const rows=[].slice.call(wrap.querySelectorAll('.slrow'));
   const from=+h.dataset.drag, row=rows[from];if(!row)return;
   const rowH=row.offsetHeight+8, startY=ev.clientY;let to=from;
   row.classList.add('drag');
   try{h.setPointerCapture(ev.pointerId);}catch(e){}
   const move=e2=>{
    const dy=e2.clientY-startY;
    to=clamp(from+Math.round(dy/rowH),0,rows.length-1);
    rows.forEach((r,i)=>{
     if(i===from)r.style.transform=`translateY(${dy}px)`;
     else if(to>from&&i>from&&i<=to)r.style.transform=`translateY(${-rowH}px)`;
     else if(to<from&&i<from&&i>=to)r.style.transform=`translateY(${rowH}px)`;
     else r.style.transform='';});
   };
   const up=()=>{
    h.onpointermove=null;h.onpointerup=null;h.onpointercancel=null;
    rows.forEach(r=>{r.style.transform='';r.classList.remove('drag');});
    if(to!==from){const arr=S.tour.setlist;arr.splice(to,0,arr.splice(from,1)[0]);}
    afterSetlistChange();
   };
   h.onpointermove=move;h.onpointerup=up;h.onpointercancel=up;
  };
 });
}

 el.innerHTML=`<span>${d}/${n} beállítva</span><span class="pb"><i style="width:${n?d/n*100:0}%"></i></span>`;
 el.className='r progpill '+(d===n&&n?'act':'');}
/* a következő beállítatlan állomásra görget */
function gotoNextTodo(){
 const el=view.querySelector('.stop.todo');
 const top=el?Math.max(0,el.offsetTop-70):view.scrollHeight;
 /* rejtett/animációt nem futtató oldalon a smooth nem mozdul → azonnali görgetés */
 try{view.scrollTo({top,behavior:document.hidden?'auto':'smooth'});}catch(e){view.scrollTop=top;}

function rngHTML(b,exp,cap){const l=clamp(b.lo/cap*100,0,100),w=clamp((b.hi-b.lo)/cap*100,1,100),m=clamp(exp/cap*100,0,100);

function updateSticky(){const stops=S.tour.stops,cost=promoCost(stops,S.tour.promo||0);
 const todo=todoCount();
 const days=stops.reduce((s,st,i)=>s+1+(i>0?travelDays(haversine(CM[stops[i-1].city],CM[st.city])):1),0);
 const realMin=stops.length?Math.round(tourRealMs(stops)/60000):0;

 /* A fő teendő a beállítás — az indítás csak akkor lesz elsődleges gomb, ha minden állomás kész.
    Így nem lehet véletlenül félig beállítva, alap jegyárral turnét indítani. */
 let main;
 if(stops.length<1) main=`<button class="btn lime" disabled>Adj hozzá legalább 1 várost</button>`;
 else if(S.tour.setlist.length<minSet(AM[S.tour.artist])) main=`<button class="btn lime" id="goSet">${icon('notes','17px')} Rakd össze a szetet · még ${minSet(AM[S.tour.artist])-S.tour.setlist.length} dal</button>`;
 else if(todo>0) main=`<button class="btn lime" id="goTodo">${icon('alert','17px')} Állomások beállítása · ${todo} maradt →</button>`;
 else main=`<button class="btn lime" id="sim">${icon('mic','18px')} Turné indítása · ${stops.length} állomás${cost?' · promó '+money(cost):''}</button>`;

 stickyHost.innerHTML=`<div class="sticky"><div class="in" id="stickyTop">
   ${stops.length?`<div style="text-align:center;font-size:11.5px;font-weight:700;margin-bottom:8px;color:${todo>0?'var(--gold)':'var(--faint)'}">
     ${todo>0?`${icon('alert','12px')} Még ${todo} állomásnál nem állítottad be a jegyárat`
              :`${icon('clock','12px')} ${days} nap · nálad kb. ${realMin} perc${stops.length>1?` · <b style="color:var(--cash)">−${Math.round((1-tourScale(stops.length))*100)}%</b> fix költség a turné méretéért`:''}`}</div>`:''}
   ${main}
   <button class="btn dark sm" id="cancel" style="margin-top:8px">Mégse, vissza</button></div></div>`;
 /* A sticky gomb magassága változó (hint + 2 gomb). Enélkül a lap alja — épp a
    promóció-választó — a gomb alá csúszik, és webnézetben nem lehet elérni. */
 const sb=stickyHost.querySelector('.sticky');
 view.style.paddingBottom=(sb?sb.offsetHeight+90:96)+'px';
 const sim=$('#sim');if(sim)sim.onclick=launchTour;
 const gt=$('#goTodo');if(gt)gt.onclick=gotoNextTodo;
 const gs=$('#goSet');if(gs)gs.onclick=()=>{const el=view.querySelector('#songs');
   if(el)try{view.scrollTo({top:Math.max(0,el.offsetTop-70),behavior:document.hidden?'auto':'smooth'});}catch(e){view.scrollTop=el.offsetTop;}};
 $('#cancel').onclick=()=>{S.tour=null;teardownMap();save();render();};}

function fanBars(A,gains){
 let h='';Object.keys(REGIONS).forEach(r=>{const f=A.fans[r],g=gains&&gains[r];
  h+=`<div class="fanrow"><span class="n">${REGIONS[r]}</span>
    <span class="b"><i style="width:${clamp(f,0,100)}%;background:${fanCol(f)}"></i></span>
    <span class="v" style="color:${fanCol(f)}">${Math.round(f)}</span>
    <span class="d" style="color:${g>0?'var(--cash)':'transparent'}">${g>0?'+'+dec1(g):''}</span></div>`;});
 return h;
}

/* ---------- FEJLESZTÉS ---------- */
/* A kártyák azt mutatják, amit a fizetéssel NYERSZ (jelenlegi → következő szint),
   nem a jelenlegi szint hatását — különben a 0. szinten „+0%" állna az ár mellett. */
const UPG={
 marketing:{n:'Marketing',ic:'megaphone',cost:MK_COST,unit:'nézőszám',
   eff:l=>`+${l*10}%`, eff2:l=>`−${l*5}%`, unit2:'bizonytalanság',
   desc:'Több ember tud a koncertekről → nagyobb nézőszám minden helyszínen, és kiszámíthatóbb a jegyeladás.'},
 staff:{n:'Stáb és technika',ic:'upgrade',cost:ST_COST,unit:'produkciós költség',
   eff:l=>`−${l*8}%`,
   desc:'Olcsóbb színpad és technika → nagyobb profit, főleg aréna és stadion méretben.'},
 merch:{n:'Merch-pult',ic:'ticket',cost:MERCH_COST,unit:'merch-bevétel',
   eff:l=>`+${l*35}%`,
   desc:'Nagyobb választék és profibb pult a helyszíneken. A merch a rajongótábor kamata: ahol imádnak, ott sokkal többet költenek.'}
};
function tabFejlesztes(){
 let h=`<div class="hud-space"></div><div class="pad"><div class="shead"><div class="eyebrow">Iroda</div><h1>Fejlesztés</h1><p>Fektesd vissza a bevételt: a marketing több nézőt hoz, az erős stáb csökkenti a költséget.</p></div>`;
 h+=upgCard('marketing')+upgCard('staff')+upgCard('merch');


 /* ---- BERUHÁZÁSOK: a pénz célja ---- */
 h+=`<div class="sec"><h2>Létesítmények</h2><span class="r act">${money(S.money)}</span></div>`;
 FAC.forEach(f=>h+=facCard(f));
 h+=`<div class="sec"><h2>Stáb felvétele</h2><span class="r">${Object.keys(S.staff||{}).length}/${STAFF.length}</span></div>`;
 STAFF.forEach(st=>h+=staffCard(st));

 THEMES.forEach(t=>{const own=(S.themes||[]).indexOf(t.id)>=0, on=S.theme===t.id;

 h+=`</div></div>`;
 view.innerHTML=h;
 bind('[data-theme]',b=>{const t=THEMES.find(x=>x.id===b.dataset.theme);if(!t)return;
   if((S.themes||[]).indexOf(t.id)<0){
     if(!spendCredits(t.cost)){openShop(`A(z) „${t.n}" téma ${t.cost} kredit. Tisztán kozmetika — a játékmenetre nincs hatása.`);return;}
     S.themes.push(t.id);toast(`${t.n} téma feloldva!`);}
   S.theme=t.id;save();applyTheme();render();});
 bind('[data-fac]',b=>buyFac(b.dataset.fac));
 bind('[data-staff]',b=>hireStaff(b.dataset.staff));
 bind('[data-up]',b=>{const key=b.dataset.up,cost=UPG[key].cost[S.upg[key]+1];

  S.money-=cost;S.upg[key]++;save();toast(`${UPG[key].n} fejlesztve — most ${UPG[key].eff(S.upg[key])} ${UPG[key].unit}.`);render();});}
function upgCard(key){
 const u=UPG[key],lvl=S.upg[key],next=u.cost[lvl+1],maxed=next===undefined,can=!maxed&&S.money>=next;
 /* a fő badge: mit ad a JELENLEGI szint → mit adna a KÖVETKEZŐ */
 const gain=maxed?`${u.eff(lvl)} ${u.unit} · teljes`
                 :`${u.eff(lvl)} → <b style="color:var(--neon)">${u.eff(lvl+1)}</b> ${u.unit}`;
 const gain2=u.eff2?(maxed?`${u.eff2(lvl)} ${u.unit2}`
                          :`${u.eff2(lvl)} → <b style="color:var(--neon)">${u.eff2(lvl+1)}</b> ${u.unit2}`):'';
 return `<div class="lcard" style="margin-top:12px"><div class="ph" style="flex:0 0 84px;width:84px;background:linear-gradient(145deg,#1a1f10,#0d0f08);display:flex;align-items:center;justify-content:center;color:var(--neon);font-size:30px">${icon(u.ic)}</div>
   <div class="bd"><div class="nm" style="font-size:17px">${u.n}</div>
     <div class="chips"><span class="chip lime">Szint ${lvl}/4</span><span class="chip mint">${gain}</span></div>
     ${gain2?`<div class="chips" style="margin-top:5px"><span class="chip">${gain2}</span></div>`:''}
     <div style="font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.4">${u.desc}</div>
     <div class="btm">${maxed
        ?`<span class="lock" style="color:var(--cash);border-color:rgba(47,227,155,.4)">✓ Maximális szint</span>`
        :`<button class="btn ${can?'lime':'dark'} sm" data-up="${key}" ${can?'':'disabled'}>${can?`Fejlesztés → ${u.eff(lvl+1)} · ${money(next)}`:`Nincs elég pénz · ${money(next)}`}</button>`}</div>
   </div></div>`;}

 const cc=curChal();
 if(cc){const pr2=clamp(cc.st.p/cc.d.g,0,1);
  h+=`<div class="goalcard alt" style="margin-top:10px"><div class="g1">${icon('star','20px')}</div><div class="g2">
    <div class="gh">${esc(cc.d.n)}</div><div class="gs">${esc(cc.d.d)}</div>
    <div class="gbar"><i style="width:${(pr2*100).toFixed(0)}%;background:var(--gold)"></i></div>
    <div class="gm"><span>${Math.min(cc.st.p,cc.d.g)} / ${cc.d.g}</span><span>${rewardText(cc.d.rw)}</span></div></div></div>`;}
 const mBonus=Math.round((r.tMerch||0)*((r.comm||0)/100));
 if(mBonus>0&&!r.merchX2)h+=`<button class="btn gold" id="resX2" style="margin-top:12px">${icon('play','18px')} Reklám · dupla merch (+${money(mBonus)})</button>`;
 h+=`<button class="btn lime" id="resHome" style="margin-top:${mBonus>0&&!r.merchX2?'9':'12'}px">${icon('house','18px')} Vissza az irodába</button></div>`;
 resultEl.innerHTML=h;resultEl.style.display='block';resultEl.scrollTop=0;
 const rn=$('#resNet');rn.dataset.v=0;animateNum(rn,r.net,v=>money(v));
 const rx=$('#resX2');
 if(rx)rx.onclick=function(){Ads.show(function(){
   S.money+=mBonus;r.merchX2=true;r.net+=mBonus;save();
   toast('Dupla merch: +'+money(mBonus));showResult();
 },function(){toast('A videó megszakadt — nincs bónusz.');});};
 $('#resHome').onclick=()=>{resultEl.style.display='none';resultEl.innerHTML='';S.tab='iroda';S.resultPending=false;save();render();};
 renderHUD();
}

/* ============================ INDÍTÁS ============================ */
render();
/* a turné a játék bezárása alatt is véget érhetett — az eredményt akkor is meg kell mutatni */
if(S.resultPending&&S.lastResult)showResult();
if(location.search.indexOf('dbg')>=0)window.__G={S,AM,VM,VENUES,estimate,fairPrice,commRate,dealBase,dealChance,af,artState,legCost,CM,promoCost,setlistQ,launchTour,save,render,artistPhoto,byFame,ARTISTS,miniResult,skipPhase,skipAll,claimGift,giftReady,legEarn,legLv,legRank,legPts,doPrestige,prestigeConfirm,buyLegPerk,canPrestige,careerScreen,cityList,LEGPERKS,level,recs};
})();
</script>
