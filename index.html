<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Turné Menedzser</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=clash-display@600,700&f%5B%5D=satoshi@500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#070809; --bg2:#0b0d10; --panel:#111318; --panel2:#171a20; --panel3:#1f232b;
  --line:#242a33; --line2:#333b47;
  --neon:#C6FF3A; --neon-d:#9bd211; --neon-dd:#6f9400; --neonglow:rgba(198,255,58,.55);
  --cash:#2FE39B; --gold:#FFC24B; --hot:#FF3D84;
  --text:#F4F6F1; --muted:#9199a8; --faint:#606877;
  --disp:'Clash Display',system-ui,sans-serif;
  --body:'Satoshi',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sh:0 20px 45px -18px rgba(0,0,0,.75);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);color:var(--text);background:var(--bg);overflow:hidden}
button{font-family:var(--body);cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%}
.num{font-family:var(--disp);font-weight:700;font-feature-settings:"tnum" 1;letter-spacing:.02em}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:.005em}

/* ---------- app frame ---------- */
#app{max-width:480px;height:100dvh;margin:0 auto;position:relative;background:var(--bg);overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.6)}

/* ambient light */
#app::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(520px 300px at 50% -6%,rgba(198,255,58,.08),transparent 62%),
             radial-gradient(600px 340px at 100% 8%,rgba(255,61,132,.08),transparent 60%)}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;z-index:30;padding:12px 14px 10px;
  background:linear-gradient(180deg,rgba(7,8,9,.96),rgba(7,8,9,.7) 78%,transparent);backdrop-filter:blur(6px)}
.hud-top{display:flex;align-items:center;gap:11px}
.ag-av{width:42px;height:42px;border-radius:13px;flex:0 0 auto;overflow:hidden;position:relative;border:1px solid var(--line2);
  background:linear-gradient(145deg,#2a2f16,#0e1005);display:flex;align-items:center;justify-content:center;color:var(--neon)}
.ag-av img{width:100%;height:100%;object-fit:cover}
.ag-who{flex:1;min-width:0}
.ag-who .nm{font-family:var(--disp);font-weight:700;font-size:17px;line-height:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-who .lv{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11px;color:var(--muted);font-weight:600}
.ag-who .lv b{color:var(--neon);background:rgba(198,255,58,.12);border:1px solid rgba(198,255,58,.32);
  padding:1px 8px;border-radius:20px;font-family:var(--disp);font-size:11px;letter-spacing:.03em}
.ag-set{width:36px;height:36px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:17px;flex:0 0 auto}
.res{display:flex;gap:8px;margin-top:11px}
.pill{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:8px 11px;display:flex;align-items:center;gap:9px}
.pill .ic{font-size:18px;flex:0 0 auto}
.pill.cash .ic{color:var(--cash)} .pill.rep .ic{color:var(--gold)} .pill.wk .ic{color:var(--muted)}
.pill .k{font-size:8.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);font-weight:700}
.pill .v{font-family:var(--disp);font-weight:700;font-size:16px;font-feature-settings:"tnum" 1;letter-spacing:.02em;line-height:1;margin-top:3px}
.pill.cash .v{color:var(--cash)}

/* ---------- scroll view ---------- */
#view{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:10;
  padding-bottom:96px}
#view::-webkit-scrollbar{display:none}
.pad{padding:0 14px}
.hud-space{height:118px}

/* ---------- section head ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 12px}
.sec h2{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.005em}
.sec .r{font-size:11px;font-weight:700;color:var(--faint);background:var(--panel);border:1px solid var(--line);
  padding:4px 9px;border-radius:9px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.sec .r.act{color:var(--neon);border-color:rgba(198,255,58,.3)}

/* ---------- coach / next step ---------- */
.coach{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(198,255,58,.14),rgba(198,255,58,.04));
  border:1px solid rgba(198,255,58,.3);border-radius:16px;padding:13px 14px;margin-top:4px}
.coach .n{width:34px;height:34px;border-radius:11px;background:var(--neon);color:#141a03;font-family:var(--disp);font-weight:700;
  font-size:17px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 4px 0 var(--neon-dd)}
.coach .t{flex:1}
.coach .t .h{font-family:var(--disp);font-weight:700;font-size:14px}
.coach .t .s{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.coach .go{color:var(--neon);font-size:22px;flex:0 0 auto}

/* ---------- 3D buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:16px;
  border-radius:15px;padding:15px;letter-spacing:.01em;position:relative;transition:transform .07s,box-shadow .07s;width:100%}
.btn .ic{font-size:19px}
.btn:active{transform:translateY(4px)}
.btn.lime{background:linear-gradient(180deg,#d6ff62,var(--neon));color:#141a03;box-shadow:0 5px 0 var(--neon-d),0 12px 26px -8px var(--neonglow)}
.btn.lime:active{box-shadow:0 1px 0 var(--neon-d),0 6px 14px -8px var(--neonglow)}
.btn.dark{background:linear-gradient(180deg,var(--panel3),var(--panel));color:var(--text);border:1px solid var(--line2);box-shadow:0 5px 0 #0b0d10}
.btn.dark:active{box-shadow:0 1px 0 #0b0d10}
.btn.hot{background:linear-gradient(180deg,#ff5c9a,var(--hot));color:#2c0714;box-shadow:0 5px 0 #c31e5e,0 12px 26px -8px rgba(255,61,132,.5)}
.btn.hot:active{box-shadow:0 1px 0 #c31e5e}
.btn:disabled{opacity:.45;filter:grayscale(.3);box-shadow:none;transform:none;cursor:not-allowed}
.btn.sm{font-size:13px;padding:11px 14px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.btnrow{display:flex;gap:10px;margin-top:12px}

/* ---------- hero tile (image forward) ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);margin-top:4px}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,9,.15) 0%,rgba(7,8,9,.45) 46%,rgba(7,8,9,.95) 100%)}
.hero .in{position:relative;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.hero .kick{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--neon);font-weight:700;margin-bottom:8px;
  display:flex;align-items:center;gap:7px}
.hero h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.02;letter-spacing:.005em;text-shadow:0 3px 16px rgba(0,0,0,.5)}
.hero p{color:#e7e9e0;font-size:13px;margin-top:8px;line-height:1.5;max-width:38ch;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* equalizer motif */
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.eq i{width:3px;background:var(--neon);border-radius:2px;animation:eq 900ms ease-in-out infinite}
.eq i:nth-child(1){height:40%;animation-delay:0ms}
.eq i:nth-child(2){height:100%;animation-delay:150ms}
.eq i:nth-child(3){height:60%;animation-delay:300ms}
.eq i:nth-child(4){height:85%;animation-delay:100ms}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* live dot */
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.5);border:1px solid var(--line2);
  padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--neon)}
.live .d{width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* ---------- artist portrait tiles ---------- */
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 14px 6px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.acard{scroll-snap-align:start;flex:0 0 150px;border-radius:18px;overflow:hidden;position:relative;border:1px solid var(--line);
  background:var(--panel);box-shadow:var(--sh)}
.acard .ph{position:relative;height:212px}
.acard .ph img{width:100%;height:100%;object-fit:cover}
.acard .ph .g{position:absolute;inset:0;background:linear-gradient(180deg,transparent 32%,rgba(9,10,12,.92))}
.acard .badge{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.55);border:1px solid var(--line2);border-radius:9px;
  padding:3px 8px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--neon);display:flex;align-items:center;gap:5px}
.acard .info{position:absolute;left:11px;right:11px;bottom:10px}
.acard .info .nm{font-family:var(--disp);font-weight:700;font-size:17px;line-height:1.02;letter-spacing:.01em;word-spacing:.04em}
.acard .info .gen{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.acard .info .fame{display:flex;align-items:center;gap:6px;margin-top:8px}
.acard .info .fbar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.acard .info .fbar i{display:block;height:100%;background:var(--neon);box-shadow:0 0 8px var(--neonglow)}
.acard .info .fn{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--neon);font-feature-settings:"tnum" 1}
.acard.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;color:var(--muted);
  border-style:dashed;border-color:var(--line2)}
.acard.add .plus{width:44px;height:44px;border-radius:14px;background:var(--panel3);display:flex;align-items:center;justify-content:center;
  font-size:26px;color:var(--neon)}
.acard.add .l{font-family:var(--disp);font-weight:700;font-size:13px;text-align:center;padding:0 12px}

/* ---------- big list card (image left) ---------- */
.lcard{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:11px;box-shadow:var(--sh)}
.lcard .ph{width:108px;flex:0 0 108px;position:relative;overflow:hidden}
.lcard .ph img{width:100%;height:100%;object-fit:cover;min-height:118px}
.lcard .ph .gi{position:absolute;left:8px;top:8px;font-size:14px;color:#141a03;background:var(--neon);border-radius:8px;padding:3px;line-height:0}
.lcard .bd{flex:1;min-width:0;padding:12px 13px;display:flex;flex-direction:column;justify-content:center}
.lcard .nm{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.01em;word-spacing:.05em;line-height:1.02}
.lcard .chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--panel2);border:1px solid var(--line);
  padding:3px 9px;border-radius:8px;letter-spacing:.02em}
.chip.mint{color:var(--cash);border-color:rgba(47,227,155,.3)}
.chip.gold{color:var(--gold);border-color:rgba(255,194,75,.3)}
.chip.lime{color:var(--neon);border-color:rgba(198,255,58,.3)}
.lcard .btm{margin-top:10px}

/* pips fame meter */
.pips{display:flex;gap:3px;align-items:center}
.pips .p{height:7px;width:9px;border-radius:3px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.pips .p.on{background:var(--neon);border-color:var(--neon);box-shadow:0 0 5px var(--neonglow)}
.pips .fn{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--neon);margin-left:5px;font-feature-settings:"tnum" 1}

/* ---------- next show ---------- */
.nextshow{border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);position:relative}
.nextshow .ph{position:relative;height:158px}
.nextshow .ph img{width:100%;height:100%;object-fit:cover}
.nextshow .ph .g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,10,12,.1),rgba(9,10,12,.55) 45%,var(--panel))}
.nextshow .top{position:absolute;top:11px;left:11px;right:11px;display:flex;justify-content:space-between;align-items:center}
.nextshow .bd{padding:0 14px 14px;margin-top:-34px;position:relative}
.nextshow .city{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:.01em;line-height:1}
.nextshow .sub{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:3px}
.statrow{display:flex;gap:9px;margin:13px 0}
.st{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.st .k{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.st .v{font-family:var(--disp);font-weight:700;font-size:16px;margin-top:3px;font-feature-settings:"tnum" 1;letter-spacing:.02em}
.st .v.pos{color:var(--cash)} .st .v.neg{color:var(--hot)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 10px;text-align:center}
.tile .ic{font-size:20px;margin-bottom:5px}
.tile.c1 .ic{color:var(--cash)} .tile.c2 .ic{color:var(--gold)} .tile.c3 .ic{color:var(--neon)}
.tile .v{font-family:var(--disp);font-weight:700;font-size:19px;font-feature-settings:"tnum" 1;letter-spacing:.02em}
.tile .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin-top:3px}

/* ---------- head (screen title) ---------- */
.shead{padding:6px 2px 2px}
.shead .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--neon);font-weight:700}
.shead h1{font-family:var(--disp);font-weight:700;font-size:26px;margin-top:6px;letter-spacing:.005em}
.shead p{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.45}

/* ---------- artist detail ---------- */
.adhero{position:relative;border-radius:0 0 24px 24px;overflow:hidden;margin:0 -0px}
.adhero img{width:100%;height:330px;object-fit:cover}
.adhero .g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,9,.45),rgba(7,8,9,.1) 40%,var(--bg))}
.adhero .back{position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.5);
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;z-index:5}
.adhero .info{position:absolute;left:16px;right:16px;bottom:14px}
.adhero .info .gen{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--neon);font-weight:700}
.adhero .info h1{font-family:var(--disp);font-weight:700;font-size:36px;letter-spacing:.01em;line-height:1;margin-top:6px;word-spacing:.05em}

/* songs */
.song{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;background:var(--panel);
  border:1px solid var(--line);margin-bottom:8px;transition:.12s}
.song.on{border-color:var(--neon);background:rgba(198,255,58,.07)}
.song .q{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.song .t{font-weight:700;font-size:14px;flex:1;letter-spacing:.01em}
.song .qn{font-family:var(--disp);font-size:12px;color:var(--muted);font-feature-settings:"tnum" 1}
.song .ck{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent}
.song.on .ck{background:var(--neon);border-color:var(--neon);color:#141a03}

/* ---------- map ---------- */
#lmap{height:300px;width:100%;background:#0a0f18}
.leaflet-container{background:#0a0f18;font-family:var(--body)}
.leaflet-control-zoom a{background:var(--panel3)!important;color:var(--text)!important;border-color:var(--line2)!important}
.leaflet-bar{border:1px solid var(--line2)!important;box-shadow:none!important}
.leaflet-control-attribution{background:rgba(7,8,9,.6)!important;color:var(--faint)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.pin{display:flex;align-items:center;justify-content:center}
.pin .dot{width:12px;height:12px;border-radius:50%;background:#aeb6c4;border:2px solid rgba(0,0,0,.55)}
.pin.on .dot{width:26px;height:26px;background:radial-gradient(circle at 35% 30%,#eaffb0,var(--neon));border:2px solid #141a03;
  box-shadow:0 0 0 4px rgba(198,255,58,.22),0 0 15px var(--neonglow);font-family:var(--disp);font-weight:700;font-size:12px;color:#141a03;
  display:flex;align-items:center;justify-content:center}
.pin.on.done .dot{background:radial-gradient(circle at 35% 30%,#b5ffe2,var(--cash));box-shadow:0 0 0 4px rgba(47,227,155,.2),0 0 14px rgba(47,227,155,.6)}
.movpin{width:30px;height:30px;border-radius:50%;background:rgba(7,8,9,.85);border:2px solid var(--neon);color:var(--neon);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px var(--neonglow);animation:pulse 1.6s infinite}
.route-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}
.route-sum .b{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.route-sum .k{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.route-sum .v{font-family:var(--disp);font-weight:700;font-size:15px;margin-top:3px;font-feature-settings:"tnum" 1;letter-spacing:.02em}

/* city chips */
.grp{margin-top:12px}
.grp .l{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:700;margin:0 0 7px}
.cchips{display:flex;flex-wrap:wrap;gap:7px}
.cchip{padding:8px 11px;border-radius:11px;background:var(--panel);border:1px solid var(--line2);font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:7px;transition:.12s}
.cchip .o{font-family:var(--disp);font-size:11px;font-weight:700;background:var(--neon);color:#141a03;width:18px;height:18px;
  border-radius:50%;display:none;align-items:center;justify-content:center}
.cchip.on{background:rgba(198,255,58,.13);border-color:var(--neon);color:#fff}
.cchip.on .o{display:inline-flex}
.cchip small{color:var(--faint);font-size:10px}

/* stop cards with city photo */
.stop{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px;background:var(--panel);box-shadow:var(--sh)}
.stop .ph{position:relative;height:120px}
.stop .ph img{width:100%;height:100%;object-fit:cover}
.stop .ph .g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,10,12,.1),rgba(9,10,12,.35) 50%,var(--panel))}
.stop .ph .lab{position:absolute;left:12px;right:12px;bottom:9px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.stop .ph .no{font-family:var(--disp);font-weight:700;font-size:11px;color:#141a03;background:var(--neon);border-radius:7px;padding:2px 8px}
.stop .ph .c{font-family:var(--disp);font-weight:700;font-size:23px;letter-spacing:.01em;text-shadow:0 2px 10px rgba(0,0,0,.7);line-height:1;margin-top:5px}
.stop .ph .leg{font-size:11px;color:#e6ecd9;background:rgba(0,0,0,.4);padding:3px 9px;border-radius:8px;white-space:nowrap;font-weight:600}
.stop .bd{padding:15px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg button{padding:11px 3px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-size:12.5px;font-weight:700;
  color:var(--muted);display:flex;flex-direction:column;gap:2px;line-height:1.15}
.seg button small{font-size:10px;color:var(--faint);font-weight:700;margin-top:2px}
.seg button.on{background:rgba(198,255,58,.14);border-color:var(--neon);color:#fff}
.seg button.lk{opacity:.55;border-style:dashed;border-color:var(--line);color:var(--faint);cursor:not-allowed}
.seg button.lk small{color:var(--gold)}
.pr{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.pr label{font-size:12px;color:var(--muted);min-width:52px;font-weight:600}
/* 44px magas tap-target, vastag sáv, nagy fogantyu - ujjal is huzhato */
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:44px;background:transparent;outline:none;
  cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:13px;border-radius:13px;
  background:linear-gradient(90deg,var(--hot),var(--gold) 45%,var(--neon));border:1px solid rgba(0,0,0,.35)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-11px;border-radius:50%;
  background:#fff;border:5px solid var(--neon);box-shadow:0 3px 12px rgba(0,0,0,.65),0 0 14px var(--neonglow)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.08)}
input[type=range]::-moz-range-track{height:13px;border-radius:13px;background:linear-gradient(90deg,var(--hot),var(--gold) 45%,var(--neon))}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:5px solid var(--neon)}

/* +/- lepteto gombok a csuszka mellett */
.step{width:46px;height:46px;flex:0 0 auto;border-radius:15px;background:var(--panel3);border:1px solid var(--line2);
  color:var(--text);font-family:var(--disp);font-weight:700;font-size:24px;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #0b0d10;transition:transform .07s}
.step:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0d10}
.prow{display:flex;align-items:center;gap:9px}
.bigprice{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--neon);font-feature-settings:"tnum" 1;
  letter-spacing:.02em;line-height:1}
.presets{display:flex;gap:7px;margin-top:11px}
.presets button{flex:1;padding:9px 4px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);
  font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:2px;line-height:1.2}
.presets button small{font-size:10px;color:var(--faint);font-weight:700}
.presets button.on{background:rgba(198,255,58,.14);border-color:var(--neon);color:#fff}
.presets button.on small{color:var(--neon)}

/* allomas-kartya: csoportok, levego, nagyobb betuk */
.grp2{margin-bottom:16px}
.grp2:last-child{margin-bottom:0}
.grp2 .gl{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:9px}
.grp2 .gl2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.notes{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:2px}
.stbadge{position:absolute;top:10px;right:10px;border-radius:20px;padding:5px 11px;font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,194,75,.16);border:1px solid rgba(255,194,75,.5);color:var(--gold)}
.stbadge.done{background:rgba(47,227,155,.14);border-color:rgba(47,227,155,.45);color:var(--cash)}
.stop.todo{border-color:rgba(255,194,75,.45);box-shadow:var(--sh),0 0 0 1px rgba(255,194,75,.12)}
.progpill{display:flex;align-items:center;gap:8px}
.progpill .pb{width:54px;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.progpill .pb i{display:block;height:100%;background:var(--neon);transition:width .3s}
.pv-price{font-family:var(--disp);font-weight:700;min-width:52px;text-align:right;color:var(--neon);font-feature-settings:"tnum" 1;letter-spacing:.02em}
.pv{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pv .b{background:var(--panel2);border-radius:12px;padding:11px 5px;text-align:center;border:1px solid var(--line)}
.pv .k{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;display:block;font-weight:700}
.pv .v{font-family:var(--disp);font-weight:700;font-size:16.5px;margin-top:4px;font-feature-settings:"tnum" 1;letter-spacing:.02em}
.good{color:var(--cash)} .bad{color:var(--hot)}
.fbar2{height:6px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:9px}
.fbar2 i{display:block;height:100%;transition:width .25s}

/* ---------- sticky action ---------- */
.sticky{position:absolute;left:0;right:0;bottom:74px;z-index:25;padding:12px 14px 8px;
  background:linear-gradient(180deg,transparent,var(--bg) 40%);pointer-events:none}
.sticky .in{pointer-events:auto}

/* ---------- bottom nav ---------- */
#nav{position:absolute;left:0;right:0;bottom:0;height:74px;z-index:40;display:flex;padding:9px 8px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(11,13,16,.86),var(--bg));backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint);font-size:10px;font-weight:700;
  position:relative;padding-top:7px;transition:color .15s}
#nav a .ic{font-size:23px}
#nav a.on{color:var(--neon)}
#nav a.on .ic{filter:drop-shadow(0 0 7px var(--neonglow))}
#nav a.on::before{content:"";position:absolute;top:-9px;width:26px;height:3px;border-radius:3px;background:var(--neon);box-shadow:0 0 8px var(--neon)}

/* ---------- result ---------- */
#result{position:absolute;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding-bottom:30px;display:none}
#result::-webkit-scrollbar{display:none}
.rhero{position:relative;text-align:center;padding:40px 16px 20px;overflow:hidden}
.rhero .lights{position:absolute;inset:0;pointer-events:none;opacity:.5}
.rhero .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.rhero .big{font-family:var(--disp);font-weight:700;font-size:52px;line-height:.95;margin-top:8px;font-feature-settings:"tnum" 1;letter-spacing:.02em}
.rhero .sub{color:var(--muted);font-size:13px;margin-top:10px}
.rline{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.rline:last-child{border-bottom:0}
.rline .num{font-weight:700}
.tkt{border-radius:15px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;background:var(--panel)}
.tkt .ph{position:relative;height:96px}
.tkt .ph img{width:100%;height:100%;object-fit:cover}
.tkt .ph .g{position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,10,12,.85),rgba(9,10,12,.2))}
.tkt .ph .h{position:absolute;inset:0;padding:11px 13px;display:flex;flex-direction:column;justify-content:space-between}
.tkt .ph .c{font-family:var(--disp);font-weight:700;font-size:19px;text-shadow:0 2px 8px rgba(0,0,0,.7);letter-spacing:.01em}
.tkt .ph .p{font-family:var(--disp);font-weight:700;font-size:17px;align-self:flex-end;font-feature-settings:"tnum" 1;letter-spacing:.02em}

/* misc */
.hint{font-size:12px;color:var(--faint);display:flex;gap:8px;align-items:flex-start;line-height:1.45;margin-top:11px;font-weight:500}
.hint .i{color:var(--neon);flex:0 0 auto}
.empty{text-align:center;color:var(--muted);padding:26px 16px;font-size:14px;line-height:1.5}
.lock{font-size:11px;color:var(--faint);border:1px dashed var(--line2);border-radius:9px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.divider{height:1px;background:var(--line);margin:16px 0}
.ico{width:1em;height:1em;fill:currentColor;display:inline-block;vertical-align:-.14em}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;background:var(--panel3);border:1px solid var(--line2);
  border-radius:13px;padding:12px 18px;font-size:13px;font-weight:600;box-shadow:var(--sh);max-width:90%;text-align:center;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- ÉLŐ TURNÉ ---------- */
.lvc{border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);position:relative;background:var(--panel)}
.lvc .ph{position:relative;height:172px}
.lvc .ph img{width:100%;height:100%;object-fit:cover}
.lvc .ph .g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,10,12,.15),rgba(9,10,12,.6) 55%,var(--panel))}
.lvc .top{position:absolute;top:11px;left:11px;right:11px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge2{background:rgba(0,0,0,.55);border:1px solid var(--line2);border-radius:20px;padding:4px 11px;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lvc .bd{padding:0 15px 15px;margin-top:-40px;position:relative}
.lvc .kick{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--neon);font-weight:700;margin-bottom:5px}
.lvc .ttl{font-family:var(--disp);font-weight:700;font-size:27px;line-height:1.03;letter-spacing:.01em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.lvc .sub{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:4px}
.pbar{height:9px;border-radius:9px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:13px;position:relative}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon-d),var(--neon));box-shadow:0 0 12px var(--neonglow);
  border-radius:9px;transition:width .2s linear}
.pmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted);font-weight:600}
.pmeta .t{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--text);font-feature-settings:"tnum" 1;letter-spacing:.02em;
  display:flex;align-items:center;gap:6px}
.pmeta .t .ico{color:var(--neon)}

/* timeline */
.tl{position:relative;padding-left:26px;margin-top:4px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:12px;width:2px;background:var(--line)}
.tlr{position:relative;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.tlr::before{content:"";position:absolute;left:-24px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--panel3);
  border:2px solid var(--line2)}
.tlr.done::before{background:var(--cash);border-color:var(--cash);box-shadow:0 0 8px rgba(47,227,155,.6)}
.tlr.now{border-color:var(--neon);background:rgba(198,255,58,.07)}
.tlr.now::before{background:var(--neon);border-color:var(--neon);box-shadow:0 0 10px var(--neonglow);animation:pulse 1.4s infinite}
.tlr.dead{opacity:.55}
.tlr .h{display:flex;justify-content:space-between;align-items:baseline;gap:9px}
.tlr .c{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.01em}
.tlr .p{font-family:var(--disp);font-weight:700;font-size:14px;font-feature-settings:"tnum" 1;letter-spacing:.02em}
.tlr .m{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.tlr .d{font-size:11px;color:var(--faint);margin-top:3px}

/* esemény napló */
.logr{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:10px 12px;margin-bottom:8px}
.logr .i{width:28px;height:28px;border-radius:9px;background:var(--panel3);display:flex;align-items:center;justify-content:center;
  font-size:15px;flex:0 0 auto;color:var(--gold)}
.logr .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.4}
.logr .tx b{font-family:var(--disp);font-size:13px;letter-spacing:.01em}
.logr .tx span{color:var(--muted);display:block;margin-top:2px}

/* ---------- esemény modál ---------- */
#modal{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(4,5,6,.82);backdrop-filter:blur(8px)}
#modal.on{display:flex;animation:mfade .22s}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.ev{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line2);border-radius:22px;overflow:hidden;
  box-shadow:0 30px 70px -20px #000;animation:mpop .26s cubic-bezier(.2,1.2,.4,1)}
@keyframes mpop{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.ev .ph{position:relative;height:132px}
.ev .ph img{width:100%;height:100%;object-fit:cover}
.ev .ph .g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,10,12,.3),rgba(9,10,12,.55) 50%,var(--panel))}
.ev .ph .ic{position:absolute;left:16px;bottom:12px;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:22px;background:var(--panel3);border:1px solid var(--line2)}
.ev .ph .kick{position:absolute;right:14px;top:13px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  background:rgba(0,0,0,.55);border:1px solid var(--line2);border-radius:20px;padding:4px 11px}
.ev .bd{padding:15px 16px 16px}
.ev h3{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.005em;line-height:1.1}
.ev p{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}
.evch{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.evb{text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;
  transition:transform .07s,border-color .12s;box-shadow:0 4px 0 #0b0d10}
.evb:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0d10}
.evb .l{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.01em}
.evb .s{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.evb.good{border-color:rgba(47,227,155,.4)} .evb.good .s{color:var(--cash)}
.evb.risk{border-color:rgba(255,61,132,.35)} .evb.risk .s{color:var(--hot)}
.evb.pay .s{color:var(--gold)}

/* ---------- reklám overlay ---------- */
#adv{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(3,4,5,.95);padding:18px}
#adv.on{display:flex}
.adbox{width:100%;max-width:400px;text-align:center}
.adscreen{border-radius:20px;border:1px solid var(--line2);background:linear-gradient(160deg,#141821,#090b0e);padding:34px 20px;
  position:relative;overflow:hidden}
.adscreen .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:700}
.adscreen .big{font-family:var(--disp);font-weight:700;font-size:23px;margin-top:12px;line-height:1.2}
.adscreen .cd{font-family:var(--disp);font-weight:700;font-size:46px;color:var(--neon);margin-top:14px;font-feature-settings:"tnum" 1}
.adscreen .sm{font-size:12px;color:var(--muted);margin-top:10px}
.adring{width:74px;height:74px;margin:16px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.1);border-top-color:var(--neon);
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.adx{position:absolute;top:10px;right:12px;color:var(--faint);font-size:20px;font-weight:700;padding:4px 8px}

.credchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,194,75,.14);border:1px solid rgba(255,194,75,.45);
  border-radius:20px;padding:5px 11px;flex:0 0 auto;color:var(--gold);font-family:var(--disp);font-weight:700;
  font-size:13px;letter-spacing:.02em;font-feature-settings:"tnum" 1}
.credchip .ico{font-size:14px}
.packs{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.pack{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line2);border-radius:15px;
  padding:12px 14px;text-align:left;box-shadow:0 4px 0 #0b0d10;transition:transform .07s}
.pack:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0d10}
.pack.best{border-color:var(--gold);background:rgba(255,194,75,.09)}
.pack .amt{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--gold);min-width:74px;
  font-feature-settings:"tnum" 1}
.pack .mid2{flex:1;min-width:0}
.pack .mid2 .b1{font-size:11.5px;color:var(--muted);font-weight:600}
.pack .pr2{font-family:var(--disp);font-weight:700;font-size:16px;flex:0 0 auto}
.pack .tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#2a1c00;background:var(--gold);border-radius:6px;padding:2px 6px;margin-left:6px}

/* ---------- RITMUS MINI-JÁTÉK ---------- */
#mini{position:absolute;inset:0;z-index:85;display:none;flex-direction:column;
  background:radial-gradient(120% 70% at 50% 0%,#141a06,#070809 62%)}
#mini.on{display:flex}
.mtop{padding:14px 16px 8px;flex:0 0 auto}
.mtop .r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mtop .kick2{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--neon);font-weight:700}
.mtop .sng{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.05;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .x{width:58px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--panel);border:1px solid var(--line2);
  font-size:10px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.mbar{height:16px;border-radius:16px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:12px;
  border:1px solid rgba(255,255,255,.08);position:relative}
.mbar i{display:block;height:100%;border-radius:16px;background:linear-gradient(90deg,var(--gold),var(--neon));
  box-shadow:0 0 16px var(--neonglow);transition:width .12s linear}
.mbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);
  font-size:10px;letter-spacing:.14em;color:#0d1004;text-shadow:0 0 6px rgba(255,255,255,.5)}
.mmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:70px}
.mjudge{font-family:var(--disp);font-weight:700;font-size:38px;letter-spacing:.03em;opacity:0;transform:scale(.7)}
.mjudge.go{animation:jpop .42s cubic-bezier(.2,1.4,.4,1)}
@keyframes jpop{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.12)}100%{opacity:0;transform:scale(1)}}
.mcombo{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.04em;height:20px}
.mcount{font-family:var(--disp);font-weight:700;font-size:64px;color:var(--neon);text-shadow:0 0 26px var(--neonglow)}
/* valódi dobfelszerelés a dobos szemszögéből — a hit-zónák a fotón látható hangszerekre esnek */
.kit{position:relative;flex:1;margin:8px 12px 0;border-radius:20px;overflow:hidden;min-height:280px;
  border:1px solid var(--line2);touch-action:manipulation;
  background:#05060a url('assets/drumkit.jpg') center/100% 100% no-repeat}
.kit .vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 78% at 50% 42%,transparent 42%,rgba(4,5,8,.55) 100%)}
.dz{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;
  justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.dz .dzr{position:absolute;inset:0;border-radius:50%;border:4px solid currentColor;opacity:0;pointer-events:none;
  box-shadow:0 0 20px currentColor,inset 0 0 22px currentColor}
.dz .dzf{position:absolute;inset:-6%;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.85),currentColor 45%,transparent 72%)}
.dz .dzl{position:absolute;inset:-10%;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,currentColor 0%,transparent 68%);filter:blur(3px)}
.dz .dzn{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-family:var(--disp);font-weight:700;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:currentColor;opacity:0;white-space:nowrap;
  text-shadow:0 1px 6px #000;pointer-events:none}
.dz.armed .dzn{opacity:.9}
.dz.flash .dzf{animation:dzf .26s ease-out}
@keyframes dzf{0%{opacity:.9;transform:scale(.86)}100%{opacity:0;transform:scale(1.15)}}
.dz.hitfx{transform:translate(-50%,-50%) scale(.94)}
.mfoot{padding:0 14px 12px;display:flex;gap:9px;flex:0 0 auto}
.mfoot .btn{flex:1}
.mready{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(7,8,9,.93);z-index:3;padding:24px;text-align:center}
.mready h3{font-family:var(--disp);font-weight:700;font-size:25px;line-height:1.1}
.mready p{font-size:13px;color:var(--muted);line-height:1.5;max-width:30ch}

/* felkínáló kártya az élő turnén */
.offer{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(198,255,58,.16),rgba(198,255,58,.04));
  border:1px solid rgba(198,255,58,.42);border-radius:18px;padding:13px 14px;margin-top:12px;
  animation:opulse 2.4s ease-in-out infinite}
@keyframes opulse{0%,100%{box-shadow:0 0 0 0 rgba(198,255,58,0)}50%{box-shadow:0 0 22px -4px rgba(198,255,58,.45)}}
.offer .ic3{width:40px;height:40px;border-radius:13px;background:var(--neon);color:#141a03;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 0 var(--neon-dd)}
.offer .t3{flex:1;min-width:0}
.offer .t3 .h3{font-family:var(--disp);font-weight:700;font-size:14.5px}
.offer .t3 .s3{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.drumres{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;margin-top:11px}
.drumres .v3{font-family:var(--disp);font-weight:700;font-size:20px;font-feature-settings:"tnum" 1}

.dealbar{position:relative;height:34px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);
  margin-top:16px;overflow:hidden}
.dealbar .dz2{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(198,255,58,.42),rgba(198,255,58,.18));
  border-left:2px solid var(--neon);border-right:2px solid var(--neon);box-shadow:0 0 18px var(--neonglow) inset}
.dealbar .dm{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2px;border-radius:4px;background:#fff;
  box-shadow:0 0 14px #fff;left:0}
.goalcard{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:13px 14px;margin-top:4px;
  background:linear-gradient(135deg,rgba(198,255,58,.15),rgba(198,255,58,.04));border:1px solid rgba(198,255,58,.36);box-shadow:var(--sh)}
.goalcard.alt{background:linear-gradient(135deg,rgba(255,194,75,.13),rgba(255,194,75,.03));border-color:rgba(255,194,75,.34)}
.goalcard .g1{width:40px;height:40px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.35);color:var(--neon)}
.goalcard.alt .g1{color:var(--gold)}
.goalcard .g2{flex:1;min-width:0}
.goalcard .gh{font-family:var(--disp);font-weight:700;font-size:15.5px;letter-spacing:.01em}
.goalcard .gs{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.goalcard .gbar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:9px}
.goalcard .gbar i{display:block;height:100%;border-radius:8px;background:var(--neon);box-shadow:0 0 10px var(--neonglow);transition:width .5s}
.goalcard .gm{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--muted)}

/* ---------- FÉNYSHOW MINI-JÁTÉK (fénypult) ---------- */
.rig{position:relative;flex:1;margin:8px 12px 0;border-radius:20px;overflow:hidden;min-height:230px;
  border:1px solid var(--line2);touch-action:none;background:#04060a}
.rig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.rig .hud2{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;
  align-items:flex-start;gap:8px;pointer-events:none}
.rig .aimbar{position:absolute;left:12px;right:12px;bottom:10px;height:8px;border-radius:8px;
  background:rgba(255,255,255,.1);pointer-events:none;overflow:hidden}
.rig .aimbar u{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.28);border-radius:8px}
.rig .aimbar i{position:absolute;top:-3px;width:4px;height:14px;border-radius:3px;background:#fff;
  box-shadow:0 0 10px #fff}
.rig .cuebig{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--disp);font-weight:700;
  font-size:30px;letter-spacing:.2em;color:#fff;opacity:0;pointer-events:none;text-shadow:0 0 24px #fff}
.rig .cuebig.go{animation:cb .6s ease-out}
@keyframes cb{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1)}}
.rig .hint3{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:var(--disp);font-weight:700;
  font-size:12.5px;letter-spacing:.14em;color:rgba(255,255,255,.4);pointer-events:none;padding:0 20px;line-height:1.6}
.deskbar{display:flex;gap:8px;padding:10px 12px 0;flex:0 0 auto}
.colb{flex:1;height:56px;border-radius:15px;border:2px solid var(--line2);background:var(--panel2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:.06em;color:var(--faint);
  transition:transform .07s,border-color .12s}
.colb .dot2{width:20px;height:20px;border-radius:50%;box-shadow:0 0 12px currentColor}
.colb:active{transform:translateY(2px)}
.colb.on{border-color:#fff;color:#fff;background:rgba(255,255,255,.08)}
.colb.want{animation:cwant 1s ease-in-out infinite}
@keyframes cwant{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 3px rgba(255,255,255,.35)}}
.cuebtn{width:100%;height:62px;border-radius:17px;border:2px solid var(--hot);
  background:linear-gradient(180deg,rgba(255,61,132,.28),rgba(255,61,132,.10));color:#fff;
  font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.14em;
  display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 5px 0 #7d1338;transition:transform .07s}
.cuebtn:active{transform:translateY(4px);box-shadow:0 1px 0 #7d1338}
.cuebtn.armed{border-color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,61,132,.2));
  animation:carm .34s ease-in-out infinite}
@keyframes carm{0%,100%{box-shadow:0 5px 0 #7d1338}50%{box-shadow:0 5px 0 #7d1338,0 0 24px rgba(255,255,255,.6)}}

/* ---------- SETLIST: energia-ív ---------- */
.curve{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--sh)}
.curve .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.curve .grade{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1;letter-spacing:.02em}
.curve .sc{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.curve .lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;line-height:1.35}
.csvg{width:100%;height:96px;display:block;background:linear-gradient(180deg,rgba(198,255,58,.05),transparent);border-radius:12px}
.csvg .ideal{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1.5;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.csvg .fill{fill:rgba(198,255,58,.16)}
.csvg .line{fill:none;stroke:var(--neon);stroke-width:2.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.csvg .dot{fill:#fff;stroke:var(--neon);stroke-width:1.5;vector-effect:non-scaling-stroke}
.curve .legend{display:flex;gap:14px;margin-top:9px;font-size:10.5px;color:var(--faint);font-weight:700}
.curve .legend i{display:inline-block;width:14px;height:2px;background:var(--neon);vertical-align:middle;margin-right:5px}
.curve .legend i.d{background:none;border-top:2px dashed rgba(255,255,255,.35)}
.curve .note{font-size:12px;color:var(--gold);margin-top:9px;line-height:1.4;display:flex;gap:7px}
.curve .note .i{flex:0 0 auto}

/* szet-sorok: nagy fogantyú, húzható */
.slrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  margin-bottom:8px;padding:0 6px 0 0;position:relative;touch-action:pan-y;
  transition:transform .16s cubic-bezier(.2,1,.3,1),box-shadow .12s,border-color .12s}
.slrow.drag{border-color:var(--neon);box-shadow:0 14px 30px -8px #000,0 0 0 1px var(--neon);z-index:5;transition:none;opacity:.97}
.slrow .hnd{width:46px;height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  color:var(--faint);cursor:grab;touch-action:none;border-radius:14px 0 0 14px}
.slrow .hnd:active{cursor:grabbing;color:var(--neon)}
.slrow .hnd span{display:block;width:16px;height:2px;background:currentColor;border-radius:2px;box-shadow:0 5px 0 currentColor,0 -5px 0 currentColor}
.slrow .no{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--neon);width:16px;flex:0 0 auto;text-align:center}
.slrow .mid{flex:1;min-width:0;padding:8px 0}
.slrow .nm2{font-weight:700;font-size:13.5px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slrow .ebar{height:5px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.slrow .ebar i{display:block;height:100%;border-radius:5px}
.slrow .es{font-size:10px;color:var(--faint);font-weight:700;margin-top:4px}
.slrow .rm{width:44px;height:44px;flex:0 0 auto;border-radius:12px;color:var(--faint);font-size:20px;
  display:flex;align-items:center;justify-content:center}
.slrow .rm:active{background:rgba(255,61,132,.14);color:var(--hot)}
.slrow.hot{border-left:3px solid var(--hot)}
.pool{display:flex;flex-wrap:wrap;gap:7px}
.pool button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);min-height:44px;justify-content:center}
.pool button .n2{font-size:12.5px;font-weight:700}
.pool button .m2{font-size:10px;color:var(--faint);font-weight:700}
.risk{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(255,61,132,.12),rgba(255,61,132,.03));
  border:1px solid rgba(255,61,132,.35);border-radius:16px;padding:12px 14px;margin-top:12px}
.risk.on{background:linear-gradient(135deg,rgba(198,255,58,.14),rgba(198,255,58,.04));border-color:rgba(198,255,58,.45)}
.risk .t{flex:1}
.risk .t .h{font-family:var(--disp);font-weight:700;font-size:14px}
.risk .t .s{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.risk .sw{width:52px;height:31px;border-radius:31px;background:var(--panel3);border:1px solid var(--line2);flex:0 0 auto;position:relative}
.risk .sw i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--muted);transition:.18s}
.risk.on .sw{background:rgba(198,255,58,.25);border-color:var(--neon)}
.risk.on .sw i{left:26px;background:var(--neon)}

/* ---------- IRODA: identitás-banner (a szinttel fejlődik) ---------- */
.office{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line2);box-shadow:var(--sh);margin-top:4px}
.office .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.office .g{position:absolute;inset:0;background:linear-gradient(160deg,rgba(7,8,9,.18) 0%,rgba(7,8,9,.55) 42%,rgba(7,8,9,.95) 100%)}
.office .shine{position:absolute;top:0;bottom:0;width:42%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(198,255,58,.14),transparent);animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%{left:-46%}60%{left:106%}100%{left:106%}}
.office .in{position:relative;padding:16px;min-height:172px;display:flex;flex-direction:column;justify-content:flex-end}
.office .row{display:flex;align-items:center;gap:12px}
.office .crest{width:54px;height:54px;border-radius:17px;flex:0 0 auto;overflow:hidden;position:relative;
  border:1.5px solid rgba(198,255,58,.45);background:linear-gradient(145deg,#2a3016,#0d1005);
  display:flex;align-items:center;justify-content:center;color:var(--neon);font-size:24px;
  box-shadow:0 0 18px rgba(198,255,58,.22)}
.office .crest img{width:100%;height:100%;object-fit:cover}
.office .who{flex:1;min-width:0}
.office .rank{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--neon);font-weight:700}
.office .nm{font-family:var(--disp);font-weight:700;font-size:25px;line-height:1.02;letter-spacing:.01em;margin-top:4px;
  text-shadow:0 2px 12px rgba(0,0,0,.6)}
.office .lvb{font-family:var(--disp);font-weight:700;font-size:13px;color:#141a03;background:var(--neon);
  border-radius:11px;padding:5px 11px;flex:0 0 auto;box-shadow:0 3px 0 var(--neon-dd)}
.xp{margin-top:15px}
.xp .bar{height:11px;border-radius:11px;background:rgba(255,255,255,.11);overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.xp .bar i{display:block;height:100%;border-radius:11px;width:0;
  background:linear-gradient(90deg,var(--neon-d),var(--neon));box-shadow:0 0 14px var(--neonglow);
  transition:width 1s cubic-bezier(.2,1,.3,1)}
.xp .lbl{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.xp .lbl b{font-family:var(--disp);color:var(--neon);font-feature-settings:"tnum" 1;letter-spacing:.02em}

/* koppintható stat-csempe */
.tile.tap{position:relative;transition:transform .08s,border-color .15s,background .15s}
.tile.tap:active{transform:translateY(2px);border-color:var(--line2)}
.tile.tap::after{content:"›";position:absolute;top:7px;right:10px;color:var(--faint);font-size:15px;font-weight:700}

/* aktivitás-folyam */
.feedbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 14px;box-shadow:var(--sh)}
.fitem{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.fitem:last-child{border-bottom:0}
.fitem .ic{width:34px;height:34px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:16px;background:var(--panel3);border:1px solid var(--line2)}
.fitem .tx{flex:1;min-width:0}
.fitem .tx .h{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.01em;display:flex;justify-content:space-between;gap:8px}
.fitem .tx .h em{font-style:normal;font-size:10px;color:var(--faint);font-family:var(--body);flex:0 0 auto;padding-top:3px}
.fitem .tx .s{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.fitem.new{animation:fpop .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes fpop{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* gazdagabb roster-kártya + hívogató üres állapot */
.acard .meta{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:10px;color:#cfd6c2;font-weight:700}
.acard .meta .ico{color:var(--neon)}
.acard.disc{position:relative;border-style:solid;border-color:var(--line2)}
.acard.disc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.acard.disc .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,10,12,.45),rgba(9,10,12,.92));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 14px;text-align:center}
.acard.disc .plus{width:46px;height:46px;border-radius:15px;background:var(--neon);color:#141a03;display:flex;
  align-items:center;justify-content:center;font-size:27px;box-shadow:0 4px 0 var(--neon-dd)}
.acard.disc .l{font-family:var(--disp);font-weight:700;font-size:13.5px;line-height:1.15}
.acard.disc .s{font-size:10.5px;color:var(--muted);font-weight:600}

/* ---------- rajongótábor / streaming ---------- */
.fanrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.fanrow .n{font-size:12px;font-weight:700;width:92px;flex:0 0 auto;color:var(--muted)}
.fanrow .b{flex:1;height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.fanrow .b i{display:block;height:100%;border-radius:9px;transition:width .35s}
.fanrow .v{font-family:var(--disp);font-weight:700;font-size:13px;width:30px;text-align:right;font-feature-settings:"tnum" 1}
.fanrow .d{font-size:10.5px;font-weight:700;width:38px;text-align:right}
.bigstat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:var(--sh)}
.bigstat .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);font-weight:700}
.bigstat .v{font-family:var(--disp);font-weight:700;font-size:36px;letter-spacing:.02em;font-feature-settings:"tnum" 1;
  line-height:1;margin-top:7px;color:var(--neon)}
.bigstat .s{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.hypechip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,194,75,.14);border:1px solid rgba(255,194,75,.4);
  color:var(--gold);border-radius:20px;padding:4px 11px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.relbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line2);
  border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 4px 0 #0b0d10;transition:transform .07s}
.relbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0d10}
.relbtn:disabled{opacity:.45;box-shadow:none;transform:none}
.relbtn .ic{width:44px;height:44px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:21px;background:linear-gradient(145deg,#1a1f10,#0d0f08);color:var(--neon)}
.relbtn .t{flex:1;min-width:0}
.relbtn .t .h{font-family:var(--disp);font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.relbtn .t .h span{color:var(--neon)}
.relbtn .t .s{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.relbtn .t .m{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

/* promó szegmens */
.pseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pseg button{padding:10px 3px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-size:11.5px;font-weight:700;
  color:var(--muted);display:flex;flex-direction:column;gap:3px;line-height:1.15;align-items:center}
.pseg button small{font-size:9.5px;color:var(--faint);font-weight:700;font-family:var(--disp);letter-spacing:.02em}
.pseg button.on{background:rgba(198,255,58,.14);border-color:var(--neon);color:#fff}
.pseg button.on small{color:var(--neon)}
.band{font-size:12.5px;color:var(--muted);margin-top:9px;display:flex;justify-content:space-between;gap:10px;font-weight:600;line-height:1.35}
.band b{font-family:var(--disp);color:var(--text);font-feature-settings:"tnum" 1;letter-spacing:.02em}
.rng{height:6px;border-radius:6px;background:rgba(255,255,255,.07);margin-top:6px;position:relative;overflow:hidden}
.rng i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,61,132,.55),rgba(198,255,58,.75));border-radius:6px}
.rng u{position:absolute;top:-2px;width:2px;height:10px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(255,255,255,.7)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.legr{margin-top:4px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:5px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.lgc{border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03)}
.lgc.bad{border-color:rgba(255,77,90,.32)}
.lgc.good{border-color:rgba(47,227,155,.32)}
.lgh{font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px}
.lgc.bad .lgh{color:var(--hot)} .lgc.good .lgh{color:var(--cash)}
.lgb{font-size:11px;line-height:1.55;color:var(--muted)}

             'Kontinentális erő','Nemzetközi ügynökség','Iparági nagyhatalom','Globális birodalom'];

                  'city,skyline,night','city,skyline,night','skyscraper,night,lights','skyscraper,night,lights','skyline,night,metropolis'];
function rankName(l){return RANKS[clamp(l,1,RANKS.length)-1];}
function officePhoto(l,w,h){return `https://loremflickr.com/${w}/${h}/${OFFICE_PIC[clamp(l,1,OFFICE_PIC.length)-1]}?lock=${900+l}`;}

/* ---------- PROMÓCIÓ (turnénkénti marketingköltés) ----------
   dem = várható nézőszám szorzó · sig = szórás szorzó (kisebb = kiszámíthatóbb)
   seat = € férőhelyenként (a turné teljes kapacitására vetítve) */

/* ================= RAJONGÓTÁBOR · STREAMING · KIADÁS · MERCH =================
   A rendszer közepe a RÉGIÓNKÉNTI RAJONGÓTÁBOR (0–100). Minden más ezt táplálja,
   és minden más ebből él:
     kiadás → streaming ↑ → rajongótábor ↑ → koncertkereslet ↑ → pénz + merch ↑ → új kiadás
   Ezért a régi statikus `a.reg` szorzó helyére a dinamikus rajongótábor lépett. */
const FAN_MIN=0.6, FAN_SPAN=1.4;                       // kereslet-szorzó: 0 rajongó=0,6× · 100=2,0×
function fanMul(f){return FAN_MIN+clamp(f,0,100)/100*FAN_SPAN;}
function baseFans(reg){return clamp(Math.round((reg-FAN_MIN)/FAN_SPAN*100),5,70);}
/* előadónkénti, mentett állapot (a statikus ARTISTS adat érintetlen marad) */
function artState(id){
 if(!S.art)S.art={};
 if(!S.art[id]){const a=AM[id],f={};let s=0,n=0;
  Object.keys(REGIONS).forEach(r=>{f[r]=baseFans(a.reg[r]||1);s+=f[r];n++;});
  S.art[id]={fans:f,streams:Math.round(Math.pow(a.fame,2.4)*60*(0.55+(s/n)/100*0.9)),hype:0,fameAdd:0,rels:0,played:{}};}
 if(!S.art[id].played)S.art[id].played={};
 return S.art[id];
}
function af(a){return clamp(a.fame+(S.art&&S.art[a.id]?S.art[a.id].fameAdd:0),0,100);}
function avgFans(st){const v=Object.values(st.fans);return v.reduce((x,y)=>x+y,0)/v.length;}
function topRegion(st){return Object.entries(st.fans).sort((x,y)=>y[1]-x[1])[0];}
function fanLabel(f){return f>=80?'Fanatikus':f>=60?'Erős':f>=40?'Ismerik':f>=20?'Kezdődik':'Ismeretlen';}
function dec1(n){return (Math.round(n*10)/10).toString().replace('.',',');}
function fanCol(f){return f>=70?'var(--cash)':f>=40?'var(--neon)':f>=20?'var(--gold)':'var(--hot)';}
/* havi hallgató „természetes" szintje — ide húz a streaming hétről hétre */
function streamTarget(a){const st=artState(a.id);
 return Math.round(Math.pow(af(a),2.4)*60*(0.55+avgFans(st)/100*0.9)*(1+st.hype*0.6));}
function fmtStream(n){return n>=1e6?(n/1e6).toFixed(2).replace('.',',')+'M':n>=1000?Math.round(n/1000)+'e':String(Math.round(n));}

function relCost(a,k){return Math.round((4000+af(a)*260)*k.mul*(1-facLv('studio')*0.15)/500)*500;}

/* ---------- MERCH ---------- */
/* Fejenkénti költés: az alap × rajongói szint × a merch-pult fejlesztése.
   A hűséges rajongó sokkal többet költ — ezért a merch a rajongótábor „kamata". */
const MERCH_COST=[0,18000,45000,95000,175000];
/* a helyszín mérete szorozza a rajongótábor-építést: nagy hely = nagyobb nyomot hagy */
const VFAN={club:1,theatre:1.5,arena:2.2,stadium:3};
function merchMul(){return 1+S.upg.merch*0.35;}
function merchPerHead(fans){return 2.6*(0.6+clamp(fans,0,100)/100)*merchMul();}
function merchRev(att,fans){return Math.round(att*merchPerHead(fans));}

/* ---------- IDŐ ---------- */
/* A játék JÁTÉKBELI percekben gondolkodik, és egyetlen aránnyal váltja valós időre.
   Így a tempó egyetlen szám (hourMs) átírásával hangolható. */
const TIME={
 hourMs:45000,    // 1 játékbeli óra = 45 valós másodperc → klubkoncert 45 mp, 3 állomás ≈ 4 perc
 prepMin:25,      // indulás előtti felkészülés (játékbeli perc)
 tick:200
};
function msFromMin(min){return Math.round(min*TIME.hourMs/60);}
/* koncert hossza: kisebb hely rövidebb műsor, aréna/stadion nagyprodukció */
function showMin(v){return v.cap>=20000?90:v.cap>=9000?75:60;}
/* utazás: távolság-arányos, de TÖMÖRÍTVE — a hosszú járatok nem tartanak reális 12 órát.
   Rövid ugrás ~40 perc, tengerentúli ~1 ó 45 p, a leghosszabb út is max ~2 ó 50 p. */
function travelMin(km){return Math.round((0.4+2.4*Math.pow(clamp(km/16000,0,1),0.55))*60*(1-facLv('bus')*0.08));}
function travelDays(km){return Math.max(1,Math.round(km/1400));}
/* játékbeli perc -> olvasható magyar időtartam */
function dur(min){const h=Math.floor(min/60),m=Math.round(min%60);
 return h?(m?`${h} ó ${m} p`:`${h} óra`):`${m} perc`;}
