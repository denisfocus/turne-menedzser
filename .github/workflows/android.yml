name: Android csomag

# Kézzel indítható: Actions fül → "Android csomag" → Run workflow.
# Eredmény: letölthető APK (telefonra közvetlenül telepíthető teszthez), és ha a
# kulcstár-titkok be vannak állítva, akkor egy Play Console-ra feltölthető AAB is.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icons.js'
      - 'assets/**'
      - 'icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Függőségek
        run: npm install

      - name: Webes fájlok összeállítása (www/)
        run: npm run build

      - name: Android projekt létrehozása
        run: npx cap add android

      - name: Natív beállítások (AdMob azonosítók)
        run: node scripts/native-config.mjs

      - name: Ikonok és indítókép generálása
        run: >
          npx capacitor-assets generate --android --assetPath store-assets
          --iconBackgroundColor '#06070a' --iconBackgroundColorDark '#06070a'
          --splashBackgroundColor '#06070a' --splashBackgroundColorDark '#06070a'

      - name: Szinkron
        run: npx cap sync android

      - name: Teszt-APK (mindig)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Aláírás bekötése (csak ha van kulcstár)
        if: env.KS_BASE64 != ''
        run: |
          echo "$KS_BASE64" | base64 -d > android/app/release.keystore
          node scripts/android-signing.mjs

      - name: Play-csomag (AAB, csak aláírással)
        if: env.KS_BASE64 != ''
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Csomagok feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: tour-empire-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
